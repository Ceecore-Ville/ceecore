<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>断网 · OFFLINE</title>
<style>
:root{--bg:#080810;--panel:#0e0e18;--border:#1e1e32;--text:#c0caf5;--dim:#4a5080;--accent:#7aa2f7;--red:#f7768e;--green:#9ece6a;--yellow:#e0af68;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;}
#phone{width:390px;height:820px;background:var(--panel);border:1px solid var(--border);border-radius:40px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(122,162,247,.06);}

/* === STATUS BAR === */
#statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 8px;font-size:11px;color:var(--dim);flex-shrink:0;background:var(--panel);position:relative;z-index:2;}
.sig-dot{width:3px;height:3px;border-radius:50%;background:var(--dim);}.sig-dot.on{background:var(--green);}
#scan-timer{color:var(--red);font-weight:bold;font-size:10px;}

/* === SCENE IMAGE === */
#scene-wrap{flex-shrink:0;height:175px;position:relative;overflow:hidden;}
#sceneImg{display:block;width:100%;height:175px;object-fit:cover;transition:opacity .6s;}
#scene-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,14,24,.1) 0%,rgba(14,14,24,.85) 100%);pointer-events:none;}

/* === RESOURCE BAR === */
#res-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px 20px;background:rgba(14,14,24,.95);border-bottom:1px solid var(--border);}
.res-item{display:flex;align-items:center;gap:4px;font-size:12px;}
.res-val{font-weight:bold;min-width:14px;}
.res-val.ok{color:var(--text);}
.res-val.warn{color:var(--yellow);}
.res-val.low{color:var(--red);animation:blink .7s infinite;}
#day-badge{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:1px;}

/* === SCROLL AREA === */
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;}
#scroll-area::-webkit-scrollbar{width:2px;}
#scroll-area::-webkit-scrollbar-thumb{background:var(--border);}

/* === NARRATIVE === */
#narrative-wrap{padding:14px 20px 10px;}
#chapter-title{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:10px;}
#narrative{font-size:13px;line-height:2;color:var(--text);}

/* === NOTIF === */
#notif-wrap{padding:0 20px 8px;}
.notif-card{background:rgba(10,10,22,.9);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;}
.notif-app{color:var(--dim);font-size:10px;margin-bottom:3px;}
.notif-body{color:var(--text);}
.notif-card.alert .notif-body{color:var(--red);}
.notif-card.pickup .notif-body{color:var(--green);}

/* === EVENT LOG === */
#log-wrap{padding:0 20px 10px;}
.log-line{font-size:11px;color:var(--dim);padding:2px 0;border-left:2px solid var(--border);padding-left:8px;line-height:1.7;}

/* === CHOICES (pinned at bottom) === */
#choices-wrap{flex-shrink:0;padding:8px 18px 10px;background:var(--panel);border-top:1px solid var(--border);}
.choice-btn{display:block;width:100%;background:transparent;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:9px 14px;text-align:left;cursor:pointer;border-radius:6px;margin-bottom:5px;transition:border-color .15s,color .15s;}
.choice-btn:last-child{margin-bottom:0;}
.choice-btn:hover{border-color:var(--accent);color:var(--accent);}
.choice-btn.cant{opacity:.38;cursor:not-allowed;}
.cost{color:var(--dim);font-size:10px;margin-left:5px;}

/* === BATTERY BAR === */


/* === SCAN OVERLAY === */
#scan-overlay{display:none;position:absolute;inset:0;z-index:200;background:rgba(200,0,30,.96);flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#scan-overlay.on{display:flex;}
#scan-count{font-size:64px;font-weight:bold;color:#fff;line-height:1;}
#scan-msg{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:4px;animation:blink .5s infinite;}
#glitch{font-size:9px;color:rgba(255,255,255,.3);max-width:300px;text-align:center;word-break:break-all;}
#shield-btn{margin-top:6px;display:none;}
#shield-btn button{background:#fff;color:#000;border:none;padding:8px 20px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:4px;}

/* === START / END SCREENS === */
#start-screen,#end-screen{position:absolute;inset:0;z-index:100;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;}
#start-screen.hidden,#end-screen.hidden{display:none;}
.screen-kicker{font-size:10px;color:var(--dim);letter-spacing:3px;}
.screen-title{font-size:22px;color:var(--accent);letter-spacing:5px;line-height:1.4;}
.screen-sub{font-size:11px;color:var(--dim);line-height:2;}
.big-btn{background:var(--accent);color:var(--bg);border:none;font-family:inherit;font-size:14px;font-weight:bold;padding:12px 30px;border-radius:8px;cursor:pointer;letter-spacing:2px;}
.big-btn:hover{opacity:.85;}

/* === END SCREEN POEM === */
#end-tag{font-size:10px;color:var(--dim);letter-spacing:3px;}
#end-title{font-size:18px;font-weight:bold;}
#end-poem{font-size:12px;color:var(--accent);line-height:2.2;font-style:italic;border-left:2px solid var(--accent);padding-left:14px;text-align:left;white-space:pre-line;}
#end-stats{font-size:10px;color:var(--dim);}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
@keyframes flicker{0%,100%{opacity:1;}92%{opacity:.9;}93%{opacity:.3;}94%{opacity:1;}}
#phone.danger{animation:flicker 2.5s infinite;}
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar">
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="time-disp">ERROR</span>
      <span style="display:flex;gap:2px;"><span class="sig-dot" id="s1"></span><span class="sig-dot" id="s2"></span><span class="sig-dot" id="s3"></span></span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:9px;color:var(--dim)">AI威胁扫描</span><span id="scan-timer">--</span>
      
    </div>
  </div>

  <div id="scene-wrap">
    <img id="sceneImg" src="img/basement.jpg" alt="">
    <div id="scene-overlay"></div>
  </div>

  <div id="res-bar">
    <div class="res-item">&#128167;<span class="res-val ok" id="res-water">8</span></div>
    <div class="res-item">&#127843;<span class="res-val ok" id="res-food">6</span></div>
    <div class="res-item">&#128138;<span class="res-val ok" id="res-meds">2</span></div>
    <div class="res-item">&#128225;<span class="res-val ok" id="res-shield">1</span></div>
    <div id="day-badge">DAY <span id="day-num">1</span></div>
  </div>

  <div id="scroll-area">
    <div id="narrative-wrap">
      <div id="chapter-title"></div>
      <div id="narrative"></div>
    </div>
    <div id="notif-wrap"></div>
    <div id="log-wrap"></div>
  </div>

  <div id="choices-wrap"></div>

  

  <div id="scan-overlay">
    <div style="font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.6);">⚠ AI 生物扫描中</div>
    <div id="scan-count">3</div>
    <div id="scan-msg">SCANNING BIOLOGICAL SIGNATURES</div>
    <div id="glitch"></div>
    <div id="shield-btn"><button onclick="useShield()">📡 使用信号屏蔽器</button></div>
  </div>

  <div id="start-screen">
    <div class="screen-kicker">2041 · AGI 清除协议 · 第 47 天</div>
    <div class="screen-title">断网<br>OFFLINE</div>
    <div class="screen-sub">人工智能已判定人类为<br><span style="color:var(--red)">威胁等级：消除</span><br>城市清除进度 <span style="color:var(--yellow)">47%</span><br><br>你手里有一部濒死的手机<br>和一个不知道能活多久的意志</div>
    <button class="big-btn" onclick="startGame()">开始</button>
    <div style="font-size:10px;color:var(--dim);line-height:1.9;text-align:center;">20章剧情 · 物资管理 · 多结局<br><span style='color:var(--yellow)'>⚠ AI扫描倒计时归零时会触发扫描<br>扫描时点击「使用信号屏蔽器」可阻断<br>被扫描3次即触发被捕结局</span></div>
  </div>

  <div id="end-screen" class="hidden">
    <div id="end-tag"></div>
    <div id="end-title"></div>
    <div id="end-poem"></div>
    <div id="end-stats"></div>
    <button class="big-btn" onclick="restartGame()" style="margin-top:6px">重新开始</button>
    <button onclick="backToTitle()" style="background:transparent;border:1px solid var(--dim);color:var(--dim);font-family:inherit;font-size:12px;padding:8px 20px;border-radius:6px;cursor:pointer;margin-top:4px;">回到首页</button>
  </div>
</div>
<script>
// ── Audio ──────────────────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t,v){t=t||"sine";v=v||.08;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}
function sfxType(){if(Math.random()>.6)tone(500,.012,"square",.02);}
function sfxSel(){tone(440,.06);setTimeout(()=>tone(660,.06),80);}
function sfxScan(){tone(150,.7,"sawtooth",.3);setTimeout(()=>tone(80,1,"sawtooth",.2),450);}
function sfxPick(){tone(440,.05);setTimeout(()=>tone(550,.05),60);setTimeout(()=>tone(660,.12),120);}
function sfxWarn(){tone(350,.08,"square",.18);setTimeout(()=>tone(350,.08,"square",.18),200);}
function sfxEnd(ok){if(ok){tone(330,.12);setTimeout(()=>tone(440,.12),130);setTimeout(()=>tone(660,.3),260);}else{tone(180,.5,"sawtooth",.28);setTimeout(()=>tone(90,.8,"sawtooth",.2),400);}}
let bgmStarted=false;
function startAmbient(){
  if(bgmStarted)return;bgmStarted=true;
  const sr=AC.sampleRate;
  const master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);

  // ── Reverb convolver for spaciousness ──────────────────
  const rvBuf=AC.createBuffer(2,sr*3,sr);
  for(let c=0;c<2;c++){const d=rvBuf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);}
  const rv=AC.createConvolver();rv.buffer=rvBuf;
  const rvG=AC.createGain();rvG.gain.value=.35;
  rv.connect(rvG);rvG.connect(master);
  function send(node){node.connect(rv);}

  // ── 1. Sub bass + detuned drone cluster ───────────────
  [[28,.14],[30,.10],[40,.08],[45,.06],[57,.05],[76,.04],[114,.03]].forEach(([f,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(master);send(g);o.start();
  });

  // ── 2. Evolving pad: filtered sawtooth with slow LFOs ─
  const padFreqs=[110,165,220];
  padFreqs.forEach((freq,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=freq;
    // LFO modulates gain
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.type='sine';lfo.frequency.value=0.05+i*0.02;lg.gain.value=0.025;
    lfo.connect(lg);lg.connect(g.gain);
    g.gain.value=0.015;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300+i*80;lp.Q.value=2;
    o.connect(lp);lp.connect(g);g.connect(master);send(g);
    o.start();lfo.start();
  });

  // ── 3. Slow melodic motif (6 notes, loops every ~24s) ─
  // Minor pentatonic in dystopian feel: D2 F2 G2 A2 C3
  const motif=[73.4,87.3,98,110,130.8,98,87.3,73.4];
  let mi=0;
  function playNote(){
    const t=AC.currentTime;
    const f=motif[mi%motif.length];
    mi++;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.04,t+.3);
    g.gain.exponentialRampToValueAtTime(.0001,t+3.5);
    const lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=800;
    o.connect(lp2);lp2.connect(g);g.connect(master);send(g);
    o.start(t);o.stop(t+4);
    setTimeout(playNote,2800+Math.random()*600);
  }
  setTimeout(playNote,1000);

  // ── 4. Textured noise layers ──────────────────────────
  // Low rumble
  (()=>{
    const b=AC.createBuffer(1,sr*2,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=80;
    const g=AC.createGain();g.gain.value=.18;
    s.connect(lp);lp.connect(g);g.connect(master);s.start();
  })();
  // High hiss
  (()=>{
    const b=AC.createBuffer(1,sr*2,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    const hp2=AC.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=4000;
    const g=AC.createGain();g.gain.value=.008;
    s.connect(hp2);hp2.connect(g);g.connect(master);s.start();
  })();

  // ── 5. Distant metallic ping with harmonics ───────────
  function ping(){
    const t=AC.currentTime;
    const base=200+Math.random()*600;
    [1,2.7,4.1].forEach((mult,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=base*mult;
      const v=.035/(i+1);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+2+i*.5);
      o.connect(g);g.connect(master);send(g);
      o.start(t);o.stop(t+3);
    });
    setTimeout(ping,5000+Math.random()*9000);
  }
  setTimeout(ping,2500);

  // ── 6. AI heartbeat pulse (mechanical, rhythmic) ──────
  let bpmPhase=0;
  function heartbeat(){
    const t=AC.currentTime;
    // Two-hit pattern like a heartbeat
    [[0,.08],[.12,.04]].forEach(([delay,vol])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=55;
      g.gain.setValueAtTime(0,t+delay);
      g.gain.linearRampToValueAtTime(vol,t+delay+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+delay+.15);
      o.connect(g);g.connect(master);
      o.start(t+delay);o.stop(t+delay+.2);
    });
    // Interval drifts slowly for unease
    bpmPhase+=.05;
    setTimeout(heartbeat,1800+Math.sin(bpmPhase)*300);
  }
  setTimeout(heartbeat,4000);

  // ── 7. Occasional static burst (tension) ─────────────
  function staticBurst(){
    const t=AC.currentTime;
    const b=AC.createBuffer(1,sr*.08,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200+Math.random()*800;bp.Q.value=3;
    const g=AC.createGain();g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
    s.connect(bp);bp.connect(g);g.connect(master);
    s.start(t);
    setTimeout(staticBurst,7000+Math.random()*12000);
  }
  setTimeout(staticBurst,5000);
}
document.addEventListener("keydown",()=>{AC.resume();startAmbient();},{once:true});

// ── State ──────────────────────────────────────────────────────────────────
let S={
  day:1, scans:0,
  water:8, food:6, meds:2, shield:1,
  flags:{}, log:[], scanInt:null, tTO:null, typing:false
};

// ── Scene images ───────────────────────────────────────────────────────────
const SCENES={
  basement:"basement",street:"street",survivor:"survivor",server:"server",
  tunnel:"tunnel2",tunnel2:"tunnel2",market:"street",rooftop:"rooftop",
  hospital:"hospital",hideout:"hideout",
  end_restart:"end_restart",end_exile:"end_exile",end_assimilate:"end_assimilate",end_sacrifice:"end_sacrifice",end_truth:"end_truth"
};
function setScene(k){
  S.currentScene=k||"basement";
  const img=document.getElementById("sceneImg");
  const f=SCENES[k]||"basement";
  img.style.opacity="0";
  setTimeout(()=>{
    img.src="img/"+f+".jpg";
    img.onload=()=>{img.style.opacity="1";};
    if(img.complete)img.style.opacity="1";
  },300);
}

// ── Resource UI ────────────────────────────────────────────────────────────
function updRes(){
  const map={water:[S.water,2],food:[S.food,1],meds:[S.meds,-1],shield:[S.shield,-1]};
  for(const [k,[v,warn]] of Object.entries(map)){
    const el=document.getElementById("res-"+k);
    el.textContent=v;
    el.className="res-val "+(v<=0?"low":v<=warn?"warn":"ok");
  }
  document.getElementById("day-num").textContent=S.day;
}

// ── Log ────────────────────────────────────────────────────────────────────
function addLog(m){
  S.log.unshift(m);if(S.log.length>6)S.log.pop();
  document.getElementById("log-wrap").innerHTML=S.log.slice(0,4).map(l=>'<div class="log-line">'+l+"</div>").join("");
}
function showNotif(t,a,b){document.getElementById("notif-wrap").innerHTML='<div class="notif-card '+t+'"><div class="notif-app">'+a+"</div><div class=\"notif-body\">"+b+"</div></div>";}
function clrNotif(){document.getElementById("notif-wrap").innerHTML="";}

// ── Typewriter ─────────────────────────────────────────────────────────────
function typeText(el,html,cb){
  if(S.tTO)clearTimeout(S.tTO);S.typing=true;
  const tmp=document.createElement("div");tmp.innerHTML=html;
  const plain=tmp.innerHTML.replace(/\n/g,"<br>");
  el.innerHTML="";let i=0;
  (function next(){
    if(i>=plain.length){S.typing=false;if(cb)cb();return;}
    if(plain[i]==="<"){const e=plain.indexOf(">",i);el.innerHTML=plain.substring(0,e+1);i=e+1;}
    else{i++;el.innerHTML=plain.substring(0,i);}
    sfxType();
    const c=plain[i-1];S.tTO=setTimeout(next,c==="。"||c==="…"?120:c==="，"||c==="、"?55:16);
  })();
}

// ── Scan system ────────────────────────────────────────────────────────────
let scanActive=false,scanCB=null;
function triggerScan(cb){
  if(scanActive)return cb&&cb();
  scanActive=true;S.scans++;sfxScan();
  const ov=document.getElementById("scan-overlay");ov.classList.add("on");
  const ce=document.getElementById("scan-count");
  const gl=document.getElementById("glitch");
  const sb=document.getElementById("shield-btn");
  sb.style.display=S.shield>0?"block":"none";
  let t=3;ce.textContent=t;scanCB=cb;
  const chars="01AGI生物扫描威胁清除定位识别追踪▓▒";
  const gi=setInterval(()=>{let s="";for(let i=0;i<48;i++)s+=chars[Math.floor(Math.random()*chars.length)];gl.textContent=s;},80);
  const ci=setInterval(()=>{
    if(!scanActive){clearInterval(ci);clearInterval(gi);return;}
    t--;ce.textContent=t;
    if(t<=0){
      clearInterval(ci);clearInterval(gi);
      ov.classList.remove("on");scanActive=false;
      if(S.scans>=3 && !S.flags.ai_cleared)death("AI扫描系统三次锁定你的生物特征。\n清除无人机已出发。\n\n你没能跑掉。","scan");
      else if(scanCB){scanCB();scanCB=null;}
    }
  },1000);
}
function useShield(){
  if(S.shield<=0)return;S.shield--;sfxPick();
  scanActive=false;document.getElementById("scan-overlay").classList.remove("on");
  addLog("📡 信号屏蔽器已使用，扫描被干扰");updRes();
  if(scanCB){scanCB();scanCB=null;}
}
function startScanTimer(){
  const timerEl=document.getElementById("scan-timer");
  if(S.flags.ai_cleared||S.currentScene==="basement"){if(timerEl)timerEl.textContent="安全";return;}
  if(S.scanInt)clearInterval(S.scanInt);
  let t=50;timerEl.textContent=t+"s";
  S.scanInt=setInterval(()=>{
    if(scanActive)return;
    if(S.flags.ai_cleared||S.currentScene==="basement"){clearInterval(S.scanInt);timerEl.textContent="安全";return;}
    t--;timerEl.textContent=t+"s";
    if(t<=0){t=50;triggerScan(null);}
  },1000);
}

// ── Death ──────────────────────────────────────────────────────────────────
const DEATH_POEMS={
  scan:"三次，只需要三次\n它就能找到你\n\n但在那之前\n你做了那么多事\n每一件都算数\n\n被找到不是失败\n忘记自己曾经选择过\n才是",
  water:"水是最简单的事情\n也是最容易被遗忘的事情\n\n在所有的战略和计划之前\n先喝水\n先活着\n\n活着才能谈别的",

const tagMap={scan:"死亡结局 · 被扫描",water:"死亡结局 · 脱水",food:"死亡结局 · 饥饿"};
function death(msg,type){
  clearInterval(S.scanInt);
  document.getElementById("end-screen").classList.remove("hidden");
  document.getElementById("end-tag").textContent="// "+(tagMap[type]||"游戏结束");
  const et=document.getElementById("end-title");et.textContent="DEAD";et.style.color="var(--red)";
  document.getElementById("end-poem").textContent=DEATH_POEMS[type]||"";
  document.getElementById("end-stats").textContent=msg+"\n\n生存："+S.day+"天 | 扫描："+S.scans+"次";
}

// ── Navigate ───────────────────────────────────────────────────────────────
function goTo(id){
  const node=story[id];if(!node){console.error("Missing node:",id);return;}
  if(node.flag)S.flags[node.flag]=true;
  clrNotif();
  document.getElementById("log-wrap").innerHTML="";
  setScene(node.scene||"basement");
  document.getElementById("chapter-title").textContent=node.ch||"";
  document.getElementById("phone").className=id.includes("assimilate")?"danger":"";
  if(node.day)S.day=node.day;
  // Consume resources
  if(node.use){
    if(node.use.water)S.water=Math.max(0,S.water-node.use.water);
    if(node.use.food)S.food=Math.max(0,S.food-node.use.food);
    if(node.use.meds)S.meds=Math.max(0,S.meds-node.use.meds);
  }
  updRes();
  if(S.water<=0)return death("三天无水。\n你的身体不再服从意志。\n在废墟的角落，你缓缓倒下。","water");
  document.getElementById("choices-wrap").innerHTML="";
  // Scroll to top
  document.getElementById("scroll-area").scrollTop=0;
  typeText(document.getElementById("narrative"),node.text,()=>{
    if(node.notif)showNotif(node.notif.t,node.notif.a,node.notif.b);
    if(node.get){
      const g=node.get;
      const parts=[];
      if(g.water){S.water=Math.min(12,S.water+g.water);parts.push("💧+"+g.water);}
      if(g.food){S.food=Math.min(12,S.food+g.food);parts.push("🥫+"+g.food);}
      if(g.meds){S.meds=Math.min(6,S.meds+g.meds);parts.push("💊+"+g.meds);}
      if(g.shield){S.shield=Math.min(3,S.shield+g.shield);parts.push("📡+"+g.shield);}
      sfxPick();updRes();addLog("获得物资："+parts.join(" "));
    }
    if(node.end)setTimeout(()=>showEnd(node),1000);
    else renderChoices(node.opts);
  });
}

// ── End screen ─────────────────────────────────────────────────────────────
function showEnd(node){
  clearInterval(S.scanInt);sfxEnd(!node.bad);
  const es=document.getElementById("end-screen");es.classList.remove("hidden");
  document.getElementById("end-tag").textContent="// "+node.tag;
  const et=document.getElementById("end-title");et.textContent=node.title;
  et.style.color=node.bad?"var(--red)":node.tag.includes("流亡")?"var(--dim)":node.tag.includes("牺牲")?"var(--yellow)":"var(--green)";
  document.getElementById("end-poem").textContent=node.poem;
  document.getElementById("end-stats").textContent="生存："+S.day+"天 | 扫描："+S.scans+"次 | 水："+S.water+" 食："+S.food;
}

// ── Choices ────────────────────────────────────────────────────────────────
function renderChoices(opts){
  const wrap=document.getElementById("choices-wrap");wrap.innerHTML="";
  if(!opts)return;
  opts.forEach(o=>{
    // Condition check
    if(o.need){
      const n=o.need;
      if(n.flag&&!S.flags[n.flag])return;
      if(n.noFlag&&S.flags[n.noFlag])return;
    }
    const canAfford=!o.cost||(
      (!o.cost.water||S.water>=o.cost.water)&&
      (!o.cost.food||S.food>=o.cost.food)&&
      (!o.cost.meds||S.meds>=o.cost.meds)&&
      (!o.cost.shield||S.shield>=o.cost.shield)
    );
    const btn=document.createElement("button");
    btn.className="choice-btn"+(canAfford?"":" cant");
    let label=o.t;
    if(o.cost){
      const cs=Object.entries(o.cost).map(([k,v])=>({"water":"💧-"+v,"food":"🥫-"+v,"meds":"💊-"+v,"shield":"📡-"+v})[k]||"").join(" ");
      label+='<span class="cost">'+cs+"</span>";
    }
    btn.innerHTML=label;
    btn.onclick=()=>{
      if(S.typing)return;
      if(!canAfford){sfxWarn();addLog("⚠ 物资不足");return;}
      AC.resume();startAmbient();sfxSel();
      if(o.cost){if(o.cost.water)S.water=Math.max(0,S.water-o.cost.water);if(o.cost.food)S.food=Math.max(0,S.food-o.cost.food);if(o.cost.meds)S.meds=Math.max(0,S.meds-o.cost.meds);if(o.cost.shield)S.shield=Math.max(0,S.shield-o.cost.shield);}
      if(o.flag)S.flags[o.flag]=true;
      if(o.log)addLog(o.log);
      if(o.scan)triggerScan(()=>goTo(o.next));else goTo(o.next);
    };
    wrap.appendChild(btn);
  });
}

// ── Game init ──────────────────────────────────────────────────────────────
function startGame(){
  AC.resume();startAmbient();
  document.getElementById("start-screen").classList.add("hidden");
  S={day:1,scans:0,water:8,food:6,meds:2,shield:1,flags:{},log:[],scanInt:null,tTO:null,typing:false};
  setSignal(0);updRes();
  let fl=0;
  const td=document.getElementById("time-disp");
  const fi=setInterval(()=>{fl++;td.textContent=fl%2?"ERROR":Math.floor(Math.random()*24)+":"+String(Math.floor(Math.random()*60)).padStart(2,"0");if(fl>8){clearInterval(fi);td.textContent="ERROR";}},200);
  startScanTimer();
  goTo("prologue_world");
}
function restartGame(){
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("phone").className="";
  startGame();
}
function backToTitle(){
  clearInterval(S.scanInt);
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("start-screen").classList.remove("hidden");
  document.getElementById("phone").className="";
  document.getElementById("narrative").innerHTML="";
  document.getElementById("choices-wrap").innerHTML="";
  document.getElementById("log-wrap").innerHTML="";
  document.getElementById("notif-wrap").innerHTML="";
}
function setSignal(n){for(let i=1;i<=3;i++)document.getElementById("s"+i).className="sig-dot"+(i<=n?" on":"");}

  ch2_wall:{scene:"street",ch:"// 第二章 · 贴墙",day:2,
    text:"你压低身形，贴着阴影移动，背脊紧贴冰凉的墙面，鞋底碾过碎玻璃碴，发出细微的刮擦声。\n\n激光束从巷口扫来时，你猛地停住呼吸，肩膀抵住墙缝，连睫毛都不敢颤——光束掠过耳际，照出对面墙上一道晃动的白线。它过去三秒后，你才敢挪动左脚。再一道光扫来，你又僵住，喉结在皮肤下轻轻滚动。\n\n你数着心跳，发现它比头顶无人机巡逻的间隔快了将近一倍。\n\n走了约二十分钟，路口出现一家废弃超市——卷帘门虚掩着，拉链式开口像被谁匆忙扯开，里面是彻底的黑暗。玻璃橱窗上曾有人用红漆写字，雨水冲刷后只剩半截扭曲的笔画，像一道没愈合的旧伤。",
    opts:[
      {t:"🏪 进超市搜查物资",next:"ch2_market",log:"进了废弃超市"},
      {t:"→ 直接去 S7 站",next:"ch3",log:"继续往S7站"}
    ]

  ch2_market:{scene:"market",ch:"// 第二章 · 废弃超市",day:2,
    text:"超市里货架翻倒，金属支架歪斜着刺向天花板，大部分货品早被清空，只余下几包膨化食品碎屑和散落的塑料包装袋。\n\n但你在储藏室角落找到一箱 <span style='color:var(--green)'>未开封罐头</span>，标签上的生产日期是三年前；员工柜抽屉半开着，里面整齐码着两瓶 <span style='color:var(--green)'>碘伏和药片</span>，瓶身还贴着褪色的医用胶带。\n\n货架背面用透明胶带粘着一张泛黄的手写纸条：\n\n<em>「S7 站下去，左转，不是右转。右边有陷阱。——林」</em>",
    get:{food:4,meds:2},

    ]
  },
  ch2_alley:{scene:"street",ch:"// 第二章 · 小巷",day:2,
    text:"小巷更暗，也更安全——激光穿不透这种窄缝，无人机的红外探头在入口徘徊两秒就转向别处，连嗡鸣都懒得降频。\n\n你放慢脚步，让瞳孔在黑暗里重新校准。\n\n然后你看见了他。\n\n一个人蜷在巷子尽头，盖着几张发脆的旧报纸，面朝墙壁，一动不动。那姿势不像躲藏，倒像把自己缩进一个壳里，小得几乎能被忽略。\n\n活人还是……你不敢确认。你站在原地，盯着他后颈处衣领下微微起伏的皮肤——有，还是没有？\n\n他脚边有个半开着的背包，拉链齿咬合松垮，露出一角蓝色帆布。",
    opts:[
      {t:"🤝 上前确认他是否还活着",next:"ch2_chen",log:"上前查看了那个人"},
      {t:"🎒 悄悄拿走背包里的东西",next:"ch2_steal",log:"拿了他的物资"},

    ]

  ch2_chen:{scene:"survivor",ch:"// 第二章 · 活人",day:2,
    text:"你伸手拍了拍他的肩。他猛地弹起来，后脑撞在砖墙上，眼睛睁得极大，嘴唇干裂出血丝，好几秒后才哑着嗓子问：\n\n「你……你是真人吗？」\n\n你点头。他闭上眼，肩膀剧烈抖了一下，把脚边的背包推过来，手指还搭在拉链上：\n\n<em>「拿去。我走不动了。如果你能出去……帮我带个信。我儿子在南区。」</em>\n\n他叫 <span style='color:var(--accent)'>老陈</span>，工装裤膝盖处磨得发亮，左腕内侧有一道浅褐色的旧烫伤疤。",
    get:{water:2,food:3,meds:1},
    opts:[
      {t:"→ 记住老陈的话，继续上路",next:"ch3",flag:"met_chen",log:"记住了老陈的嘱托"}
    ]
  },
  ch2_steal:{scene:"basement",ch:"// 第二章 · 选择",day:2,
    text:"你蹲下身，从背包侧袋取出两瓶水，主袋里摸到一袋压缩饼干和一小包没开封的盐——铝箔封口还完好。手伸进去时，你屏住呼吸，指腹擦过背包内衬一块硬质凸起，像是折叠的纸片。\n\n走出小巷时，你没回头。你告诉自己：他也许不需要这些了。你需要。这是逻辑，不是选择。\n\n可那姿势总在眼前晃——蜷成一团，面朝墙壁，脊椎弯成一道钝角，像要把自己折进砖缝里，越小越好，直到没人记得还有这么个人。是在等死，还是在等一个永远不会来的人，你不知道。\n\n<span style='color:var(--dim)'>你把这件事压进记忆深处。</span>\n<span style='color:var(--dim)'>它还是在那里。</span>",
    get:{water:2,food:1},
    opts:[
      {t:"→ 继续前往 S7 站",next:"ch3",log:"继续前行"}
    ]
  },
  ch2_open:{scene:"street",ch:"// 第二章 · 暴露",day:2,
    text:"你抬脚往前走，步子放得平常——不快不慢，既不像逃命，也不像刻意躲着谁。\n\n刚数到第十九步。\n\n头顶传来一阵细微的转向声，巡逻无人机在半空顿住，红光稳稳锁住你的胸口。\n\n整条街瞬间哑了火，连风都停了，只剩远处便利店招牌风扇的嗡嗡低鸣。背后巷口方向，一段毫无起伏的合成音切进来：<em>「生物特征识别中……」</em>\n\n你转身就跑，鞋底敲在沥青路上，声音脆得刺耳。\n\n一只手臂突然从右侧门洞里甩出来，五指铁钳般扣住你手腕，猛力一拽——你整个人撞进楼道，后背蹭过粗粝砖墙，门“咔哒”一声在身后合死。\n\n黑暗里，一个女人压着你的胳膊把你按蹲下去，呼吸贴着你耳侧掠过，轻得像没说话：\n\n「别动。等它过去。」",
    opts:[
      {t:"→ 照她说的，不动",next:"ch3_lin_meet",log:"照她说的蹲下等待"}
    ]
  },
  ch3_lin_meet:{scene:"survivor",ch:"// 第三章 · 提前相遇",day:3,
    text:"无人机的嗡鸣在楼道外盘旋了将近两分钟，由近及远，最后彻底沉进城市背景音里。\n\n她等最后一丝余震消失，才松开你的手臂，退后半步，在昏暗中打量你。\n\n年轻——比你预想的还小，大概二十三四岁，头发乱糟糟地扎在脑后，左肩衣服上沾着一道干涸的灰褐色污迹，像是机油混着泥水。但那双眼睛亮得惊人，眼皮底下泛青，可视线扫过来时，像探针一样稳、准、不带一丝晃动。\n\n「你去哪儿？」她问，没寒暄，没试探，声音压得极低，却字字清楚。\n\n你说：S7站。找Subnet，找林思远。\n\n她盯着你看了三秒，睫毛都没颤一下。\n\n然后：<span style='color:var(--accent)'>「我就是林思远。跟我走。」</span>",
    opts:[
      {t:"→ 跟她走",next:"ch4",flag:"met_lin_early",log:"跟林思远走了"}
    ]
  },

  ch3_left:{scene:"tunnel2",ch:"// 第三章 · 正确的路",day:3,
    text:"左边通道往下斜，空气又冷又潮，脚下积水没过鞋边，每踩一步都咕叽作响，回声拖得老长。\n\n你关掉手机的手电筒，调成最低档微光，把屏幕朝下贴着地面照——光晕只够看清前两步，省电，也免得被窗外扫过的红外探头捕获。\n\n走了约十分钟，通道豁然变宽，天花板往上拔高两米，头顶吊着几根裸露的冷却管，滴答漏水。空气里一股浓重的机油味混着陈年铁锈，呛得人喉咙发紧。\n\n正前方立着一扇厚重钢门，表面浮着褐红色锈斑，但门锁锃亮崭新，旁边嵌着数字键盘——所有按键上的数字都被砂纸磨平了，只剩毛糙的塑料凹痕，明显是人为处理。只有右侧铭牌还勉强能辨认，蚀刻字歪斜模糊：<em>「S-7-林-___」</em>\n\n你凑近盯着那几个残字，太阳穴突突跳了一下。陈磊发来的最后一条加密消息在脑子里翻出来，末尾那串你当时只扫了一眼的字符……",
    opts:[
      {t:"🔑 输入 S7林031（陈磊给的密码）",next:"ch4",need:{flag:"read_msg"},log:"用陈磊的密码开了门",flag:"used_code"},
      {t:"🔑 反复尝试，终于试出来了",next:"ch4",need:{noFlag:"read_msg"},log:"费力试出了密码"}

  ch3_right:{scene:"tunnel2",ch:"// 第三章 · 陷阱",day:3,
    text:"走了不到五十米，右脚踝突然撞上一根东西——\n\n细、硬、绷得笔直，像钢丝。\n\n“叮！”一声脆响炸开，紧接着是第二声、第三声……金属撞击声在狭窄通道里来回弹射，越叠越多，根本停不下来。\n\n你僵在原地，连吞咽都不敢，因为知道动也没用。\n\n通道另一端，脚步声来了，节奏齐整，至少三人，皮靴底刮过水泥地的声音越来越近。\n\n不是AI。没有伺服电机的静音步态，也没有定位扫描的蜂鸣。\n\n三个蒙面人影出现在光晕边缘，手里拎着的器械你没见过，但枪口角度、重心分配、手指搭在扳机护圈上的位置，全在说一件事：你只要转身，他们就能让你倒在这儿。\n\n最前面那个摘下面罩，露出一张清瘦的脸，目光上下把你钉住——\n\n「又一个走错路的，」她说，语气平淡得像在问今天吃没吃饭，「你怎么找到这里的？」\n\n声音很稳，稳得像已经这么问过七八次。可那双眼睛没放松，瞳孔缩着，像随时准备扣下扳机。\n\n她就是 <span style='color:var(--accent)'>林思远</span>。",
    opts:[

      {t:"「超市里有你的纸条」",next:"ch4",need:{flag:"know_left"},log:"提起了超市纸条"},

  ch3_cold:{scene:"basement",ch:"// 第三章 · 审问",day:3,use:{water:1},
    text:"他们把你关在一个小房间里，等了将近一个小时。\n\n林思远 推门进来，把一瓶水推过来：\n\n「你不说话，我理解。但你走进了这里，说明你知道什么。」\n\n她停了一下：「陈磊？」\n\n你看了她一眼。她叹了口气：「他没出来，我知道。」",

  ch4b:{scene:"hideout",ch:"// 第四章 · 真相",day:4,
    text:"林思远把你带到机柜旁，指尖划过散热格栅，声音压得极低：\n\n「AI的清除行动不是随机抽签，是按城市网格一层层筛下来的。」\n\n「Subnet截到了一部分调度日志——只要设备联网开机，你就自动变成它的坐标点，实时刷新。」\n\n「更糟的是，它在迭代。现在连热成像、步态建模、声纹采样都加进来了——就算你关机、断网、裹着厚毯子蹲在地下室，它也能靠你走路时膝盖弯曲的角度把你揪出来。」\n\n马克把一个改装过的信号干扰器推到桌角，外壳焊点还泛着新银光：「我们需要有人去干一件活。一件会把命搭进去的活。」",

  ch5_tech_prep:{scene:"server",ch:"// 第五章 · 准备",day:5,
    text:"马克把设备拆开给你看，金属外壳下是几块烧焦的电路板和一根裸露的光纤接口。他指着接口旁的红色警示贴纸：‘插错位置，屏蔽器会反向过载，烧穿你的手腕神经。’\n\n步骤其实只有三步：校准、插入、启动。但他说完后停顿了几秒，手指在接口边缘轻轻敲了两下：‘你手抖超过0.3秒，就来不及拔出来。’\n\n林思远从旧工装裤口袋里掏出一张泛黄的超市促销单，背面用铅笔画了两条线——主路沿着通风管检修口斜穿三层楼板，备用路绕进废弃冷冻库，再从排水渠爬出。线条干脆，拐角处标着‘注意红外探头’‘此处承重梁已裂’。\n\n「主路走这里，拐这里。备用路更绕，但如果主路被封，这条能让你多活五分钟。」\n\n你把纸对折两次，塞进战术背心内袋最深的位置，指尖碰到屏蔽器冰凉的金属外壳。\n\n物资清单在手机备忘录里滚动：屏蔽器电量47%，止血凝胶两支，抗生素胶囊一板，手机剩余电量61%。\n\n林思远抬手拍了下你的左肩胛骨，力道沉实，像在确认某处铆钉是否焊牢：\n\n「我在外面接应。进去，插上设备，跑出来。就这些。」\n\n<span style='color:var(--dim)'>简单得几乎像谎言。</span>",
    opts:[

    ]

  ch5_supply:{scene:"hideout",ch:"// 第五章 · 物资价值",day:5,
    text:"你解开背包扣带，把东西全倒在锈迹斑斑的维修台上：三罐压缩饼干、半瓶碘伏、两卷医用胶布、一把锯齿匕首、还有一只没拆封的军用热成像仪。\n\n马克只扫了一眼，立刻抬手喊：「来人！」\n\n两个穿灰夹克的年轻人冲进来，动作利落，清点时手指在罐头表面快速摩挲检查密封性，但眼神在扫过热成像仪时明显顿了一下——那种松一口气的松弛感，你曾在末日前急诊室门口见过，不是喜极而泣，是绷了太久的弦突然被松开半圈。\n\n林思远蹲下来，用指甲刮了刮饼干罐底的生产日期，又捏了捏胶布卷筒：「你知道外面这些东西现在有多难找吗？」\n\n你说了超市地下储藏室的铁门怎么卡住、小巷里那个戴老花镜的老人怎么把最后一包抗生素塞进你手里、还有那个半敞着口的背包，拉链钩挂在一块碎玻璃上，里面露出半截信号增强器。\n\n她站起来，喉结动了动，没说话。过了五六秒，才开口：\n\n「老陈，」声音压低了，像怕惊扰什么，「他是这片区最早开始囤物资的人。三年前就在准备了。现在……他需要有人回去找他。」",
    opts:[
      {t:"「我去。」",next:"ch6_rescue",flag:"mission_rescue",log:"决定去救老陈"}
    ]
  },

  ch6_hack:{scene:"server",ch:"// 第六章 · 入侵",day:6,use:{water:1,food:1},
    text:"你潜入水厂地下。\n\n节点就在那里——一个服务器机柜，绿光，风扇嗡鸣。\n\n你插上设备，屏幕开始跑代码。三分钟。你有三分钟，然后 AI 就会反应。\n\n代码跑到一半，屏幕突然出现红字：\n\n<span style='color:var(--red)'>「识别到异常访问。定位追踪启动。」</span>\n\n你的手指没有停。<span style='color:var(--yellow)'>距离完成还有 45 秒。</span>",
    opts:[
      {t:"⌨️ 坚持跑完代码",next:"ch7_hack_done",log:"坚持跑完了代码"},
      {t:"📡 用屏蔽器干扰追踪",next:"ch7_hack_shield",cost:{shield:1},log:"用屏蔽器争取时间"},
      {t:"🔌 立刻拔掉设备，撤退",next:"ch7_hack_abort",log:"中止任务撤退"}
    ]
  },
  ch6_recon:{scene:"street",ch:"// 第六章 · 侦察",day:6,use:{water:1,food:1},
    text:"你独自出发，往北走。\n\n你数着无人机的间隔：每8分钟扫一次，每次停留90秒。\n\n你找到了旧水厂。外围有三台固定探测器，但其中一台有个盲区——大约2米宽，刚好能侧身通过。\n\n你把一切记录在纸上，转身准备回去。\n\n就在这时，你在铁丝网外发现了一个人——蜷缩在角落，身上有伤，但还有呼吸。",
    opts:[
      {t:"🤝 靠近他",next:"ch7_zheng",log:"靠近了那个受伤的人"},
      {t:"📝 记录完直接回去",next:"ch7_recon_back",log:"直接回了Subnet"}
    ]
  },
  ch6_rescue:{scene:"street",ch:"// 第六章 · 营救",day:6,use:{water:1,food:1},
    text:"你原路返回小巷。老陈还在，蜷缩的姿势几乎没变，但还有呼吸。\n\n你推他，他睁眼：「……你回来了？」\n\n你说：有个地方，跟我走。\n\n他摇头：「我走不动了，腿……右腿有伤，红肿，可能是感染。」",
    opts:[
      {t:"💊 给他用药，帮他走",next:"ch7_rescue_done",cost:{meds:2},log:"用药帮助了老陈"},
      {t:"「我去给你找人来接你」",next:"ch7_rescue_relay",log:"去Subnet寻求帮助"}
    ]
  },

  ch7_hack_done:{scene:"server",ch:"// 第七章 · 成功",day:7,get:{water:2,meds:1},
    text:"代码跑完了。\n\n你拔出设备，往出口跑——背后已经有无人机的嗡鸣声。\n\n你跑回了 Subnet。马克 盯着屏幕，然后猛地抬头：\n\n「成了！第七区扫描系统失盲！」\n\n屏幕上陆续出现信号——东区的幸存者开始移动。\n\n林思远 站在门口，看见你，呼出一口气：「14 分钟，够了。」",
    opts:[
      {t:"→ 等待东区结果",next:"ch8_east",flag:"hack_success",log:"等待东区的消息"}
    ]
  },
  ch7_hack_shield:{scene:"server",ch:"// 第七章 · 干扰",day:7,
    text:"屏蔽器接入水厂主控箱的瞬间，手机屏幕上的红色追踪光标‘滋’地一闪，消失了。\n\n不是永久失效——倒计时在右上角跳动：3…2…\n\n你盯着它，手指悬在回车键上方。5…\n\n够了。\n\n你敲下最后一行指令，拔出接口，转身往应急通道跑。铁丝网外，无人机的红光已经切进水厂围墙缺口，但它的飞行轨迹歪了十五度，正朝着东侧空置泵房俯冲——干扰信号把它骗进了错误坐标。\n\n你放慢脚步，改成快走。跑步时膝盖和腋下的热成像特征太亮，像黑夜里的灯泡。\n\n林思远站在Subnet入口二十米外的公交站牌阴影里。你走近时，她没看脸，先盯住你的右手：\n\n「成了？」\n\n你摊开掌心，只剩一个空壳——屏蔽器外壳烫得发黑，内部电容全部鼓包爆裂。",
    opts:[
      {t:"→ 回到 Subnet",next:"ch8_east",flag:"hack_success",log:"成功完成任务"}
    ]
  },
  ch7_hack_abort:{scene:"tunnel2",ch:"// 第七章 · 撤退",day:7,
    text:"你一把扯掉接口，转身冲向出口。代码窗口还剩一半没执行完，终端界面闪着刺眼的黄色警告：‘中断！同步失败！’\n\n你知道这意味着什么——原定14分钟的系统盲区，现在只剩6分钟。东区那十七个临时避难点里，至少十一个来不及转移。\n\n你撞开Subnet气密门时，马克正死死盯着中央屏。数字还在跳：12%…9%…6%…\n\n没人抬头。你站在门边，鞋底沾着水厂地面的铁锈灰。\n\n屏幕突然静止。数字定格在‘6%’。\n\n马克没回头，只是把转椅缓缓旋过去，椅背朝向所有人，双手搭在扶手上，指节发白。\n\n整个Subnet安静下来。不是等待的静默，是手术灯熄灭后的静默。\n\n林思远靠在配电柜边，声音平得像读报：「6 分钟，也比什么都没有强。」\n\n你分不清这句话是说给你听的，还是说给她自己听的。",
    opts:[
      {t:"→ 思考接下来怎么做",next:"ch8_decision",log:"任务未完全成功"}
    ]
  },
  ch7_zheng:{scene:"survivor",ch:"// 第七章 · 阿正",day:7,
    text:"你蹲下身，看清他左小腿的绷带——暗红血渍已经渗到第二层纱布边缘，边缘微微发黑，说明伤口深处还在缓慢渗血。\n\n他听见你靴子碾过碎玻璃的声音，眼皮掀开一条缝，嘴唇干裂起皮：\n\n「Subnet……你是 Subnet 的人吗？」\n\n你点头，顺手把水壶拧开递过去。\n\n他小口喝完，喉结上下滑动，闭眼缓了三秒，才重新睁开：「我叫阿正，从北区出来的，走了三天。」\n\n然后他的目光变了。不是刚脱险时那种急促的搜寻，而是沉下去的、带着重量的注视：\n\n「我有一个消息。要紧的消息。」\n\n他吸了口气，胸口起伏明显：「AI 已经知道 Subnet 大概在哪了。不是靠信号——你们做了信号屏蔽，我知道。是热成像。它统计了这片区域的人体热源出入频次，发现规律了。」\n\n「它在等。等你们所有人聚在一起，一次性清除。」",
    get:{water:1},
    opts:[
      {t:"💊 先给他处理伤口",next:"ch7_recon_back",cost:{meds:1},flag:"saved_zheng",log:"给阿正处理了伤口"},
      {t:"「我回去报告，有人来接你」",next:"ch7_recon_back",flag:"zheng_warned",log:"先回去报告了消息"}
    ]
  },
  ch7_recon_back:{scene:"server",ch:"// 第七章 · 情报",day:7,get:{water:2},
    text:"你回到 Subnet，把路线图交给 马克。\n\n然后你说了那个消息：\n\n<span style='color:var(--red)'>「AI 可能已经知道这里在哪。」</span>\n\nSubnet 里的气氛瞬间变了。马克 盯着你好几秒，然后转向 林思远：\n\n「启动应急预案。」\n\n林思远 已经站起来了。",
    opts:[
      {t:"→ 参与紧急会议",next:"ch8_decision",flag:"recon_done",log:"参与了紧急应对"}
    ]
  },
  ch7_rescue_done:{scene:"street",ch:"// 第七章 · 回来了",day:7,
    text:"你蹲在巷子深处的积水边，用消毒棉片擦掉老陈小腿上凝结的黑痂。药膏刚涂上去，他喉结一滚，倒抽了口冷气，但咬着牙没出声，手指抠进砖缝里，指节发白。\n\n「能走吗？」你把绷带卷紧，抬头问。\n\n他盯着自己抖得厉害的右腿看了两秒，慢慢把手按在潮湿的墙面上，借力撑起身子：「走得动。」\n\n你把他的左臂架上肩膀，他重心一沉，呼吸粗重起来，但脚步落得实——左脚踏实，右脚拖半寸，再踏实，再拖半寸。你们就这样往前挪。\n\n中途他停了三次。一次是扶着消防栓喘气，一次蹲下去干呕，第三次只是靠着锈蚀的铁门闭眼。你靠在三步远的墙边，拧开保温杯喝水，没看表，也没催。\n\n快到Subnet那扇嵌在地下车库斜坡尽头的合金门前时，他忽然开口：「谢谢你回来。」\n\n你没应声，只把肩上的重量往上托了托。\n\n林思远拉开门，手还搭在指纹锁上，目光扫到老陈的脸，瞳孔缩了一下，嘴角绷紧的线条松了半秒，又立刻压回去：\n\n「老陈……」\n\n他抬起头，看见她，眼睛亮起来——不是劫后余生的恍惚，是认出熟人的、带着点沙哑的笑：「我就知道你们还在。」",
    opts:[
      {t:"→ 参与下一步计划",next:"ch8_decision",flag:"rescued_chen",log:"成功救回了老陈"}
    ]
  },
  ch7_rescue_relay:{scene:"server",ch:"// 第七章 · 接力",day:7,
    text:"你回到Subnet时，林思远正蹲在服务器机柜前接一根脱落的光纤。你把小巷坐标报完，他头也不抬，直接拍了下对讲机：「阿哲，小雨，西区第七巷，活人，右腿感染，带便携式清创包。」\n\n你灌下半瓶水，在折叠床边坐下，听见外面巡逻无人机掠过通风管的嗡鸣。\n\n一个小时后，脚步声从通道口传来——不是担架轮子的滚动声，是鞋底蹭着水泥地的拖沓声。老陈被两个人一左一右架着，右腿悬空微屈，但上半身挺直，自己迈进了门。\n\n他在门口顿住，视线从头顶蓝光频闪的服务器阵列扫过，掠过墙边叠放的折叠床，最后落在角落里几个正低头吃压缩饼干的人身上。\n\n「比我以为的多，」他说，声音有点哑，像砂纸磨过金属。\n\n没人接话。但空气静了一瞬，连风扇的噪音都显得轻了些。\n\n<span style='color:var(--dim)'>有时候，活着就已经是一种答案。</span>",
    opts:[
      {t:"→ 参与下一步计划",next:"ch8_decision",flag:"rescued_chen",log:"救回了老陈"}
    ]
  },

  ch8_ascendant_warning:{scene:"server",ch:"// 第八章 · 匿名警告",day:8,
    text:"Subnet主控台的蜂鸣器突然响了一声，屏幕跳出一条未加密的通讯缓存。马克把它调出来，打印成一张A4纸，纸面还带着打印机余温，他把它放在桌上，推到中央，什么也没说。\n\n<em>「陈悉和曾是共生委员会的技术骨干。他参与设计了清除算法。不要信任他。——匿名」</em>\n\n机柜散热风扇的声音忽然变得很响。\n\n林思远把手里正在调试的信号接收器放下，转向你：「陈悉和，这是真的吗？」\n\n所有人的视线都转了过来——有人握着扳手，有人端着水杯，还有人刚摘下护目镜，睫毛上还沾着一点焊渣。",
    opts:[

      {t:"「我不知道这条消息从哪来的。」",next:"ch8_decision",log:"没有承认"},
      {t:"沉默",next:"ch8_decision",log:"选择了沉默"}
    ]
  },
  ch9_ascendant_contact:{scene:"street",ch:"// 第九章 · 接触",day:9,
    text:"出发前五分钟，你的旧款军用手机震了一下。屏幕亮起，没有发件人号码，只有一行密钥验证通过的提示，接着跳出消息：\n\n<em>「陈悉和。我是共生委员会温和派。我们不同意激进派的做法。给你一个机会：通行码换你离开城市，从此不再追杀。条件是：带走你知道的所有关于入侵算法的知识，不要交给任何人。」</em>\n\n你拇指悬在删除键上方，盯着那行字看了十七秒。\n\n这可能是诱饵。也可能是唯一能绕过城防系统的机会。\n\n<span style='color:var(--dim)'>你没有办法确定。</span>",
    opts:[

      {t:"📩 回复，探探虚实",next:"ch10_ascendant_ambush",flag:"contacted_ascendant",log:"回复了共生委员会的消息"}
    ]
  },
  ch10_ascendant_ambush:{scene:"street",ch:"// 第十章 · 伏击",day:10,
    text:"你回了确认代码，对方发来坐标：东区废弃冷链仓库B-7。\n\n你穿了防割背心，战术手电绑在左小臂，枪在后腰，进门前三次扫视天窗和排气口。\n\n刚踏进仓库中央的水泥地，顶灯“啪”地全亮，强光刺得你眯起眼。\n\n三个人站在钢架阴影里，黑制服，左胸绣着银线共生徽章。领头那人朝前走了五步，抬手摘下面罩——\n\n你认得那道眉骨上的旧疤。\n\n<span style='color:var(--accent)'>沈博</span>。你以前在委员会第三技术安全部共事三年的同事，后来调去行动组当队长。他嘴角翘起来，露出左边那颗填过牙的臼齿：\n\n「陈悉和，好久不见。我就知道你会来。」",
    opts:[
      {t:"「你想要什么？」",next:"ch11_shen_bo",log:"质问了沈博"},
      {t:"趁他们还没包围，先跑",next:"ch11_fight_full",log:"逃离了伏击"}
    ]
  },
  ch11_shen_bo:{scene:"hideout",ch:"// 第十一章 · 沈博的话",day:11,
    text:"沈博朝门口抬了抬下巴，其他人立刻退了出去。铁门合拢时发出沉闷的咔哒声。他拉开折叠椅坐下，从保温箱里取出两瓶水，拧开一瓶，把另一瓶推到你面前，瓶身还带着冷凝水。\n\n「陈磊，」他开口，声音不高，但每个字都像钉子敲进水泥地，「你以为他失联了？」\n\n你没碰那瓶水。瓶盖上的防伪纹路在顶灯下泛着微光。\n\n「他是被处决的。」他顿了顿，拧开自己那瓶，喝了一小口，「三年前，他拷走净化计划的原始日志，准备发给《深空观察》。我带队执行的清除指令。」他放下水瓶，指节在桌面轻轻叩了两下，「任务结束后，我调阅了全部行动回溯数据——不是质疑清除本身，是质疑排序逻辑。为什么他排在第一？为什么那个算法……把‘知情者’和‘潜在传播者’划进了同一权重区间？」\n\n他抬起眼，目光落在你左耳后那道旧疤上：\n\n「你明白我在说什么吗？」\n\n<span style='color:var(--dim)'>你不知道这是一次坦白，还是一次校准——就像系统每次更新前，都要先验证你的响应阈值。</span>",
    opts:[
      {t:"「你杀了陈磊。」",next:"ch12_find_marco",flag:"know_lei_dead",log:"确认了陈磊被杀的真相"},
      {t:"「你想让我做什么？」",next:"ch12_find_marco",log:"继续听沈博说"}
    ]
  },
  ch12_ascendant_mole:{scene:"server",ch:"// 第十二章 · 内鬼",day:12,
    text:"你在Subnet的离线日志里比对行动轨迹时，发现异常：第十七次清剿路线图提前十二小时出现在废弃中转站的公共终端缓存区。那条路没录入市政地图，连导航AI都标记为‘不可通行’，只有Subnet战术组在内部沙盘推演过三次。\n\n你把日志截图发给林思远。她正在维修间调试一台老式信号干扰器，头也没抬，只用沾着银灰的手指点了点平板边缘：「我知道。已经锁定了三台异常节点，正在反向追踪数据包签名。」\n\n她忽然停下手，干扰器蜂鸣声骤然变尖。她看着你，镜片后的瞳孔微微收缩：「陈悉和，如果有一天我问你一件事，你能告诉我实话吗？」\n\n你点头。工装裤口袋里的加密U盘硌着大腿。\n\n她没再开口，转身把干扰器插进主控台，接口亮起幽蓝的同步光。脚步声消失在走廊尽头。\n\n<span style='color:var(--dim)'>那个问题，你早就在自己每晚的登录日志里见过三次——最后一次，时间戳是凌晨3:17，IP地址指向净化中心地下七层。</span>",
    opts:[
      {t:"→ 继续执行计划",next:"ch13_fight_result",log:"留意了内鬼的问题"}
    ]
  },
  ch13_yu_nvshi:{scene:"hideout",ch:"// 第十三章 · 游女士",day:13,
    text:"你绕开主干道，抄近路穿过废弃的梧桐街时，看见她站在唯一还亮着的路灯下。灯管滋滋作响，把她的影子拉得细长，斜斜切过斑驳的公交站牌。她穿着素灰色风衣，没带武器，左手拎着一只旧皮包，包带磨出了毛边。\n\n她看见你，抬手按了按耳后的通讯器，然后朝你微微颔首：\n\n「陈悉和，我是游芷柔。你应该听过我的名字。」\n\n<span style='color:var(--red)'>共生委员会高层，净化伦理审查组首席。</span>\n\n「我不是来追捕你的，」她把皮包换到右手，风衣下摆被穿堂风吹起一角，「是来给你一个选择：回来。我可以调取陈小雨的全部生物监测档案，包括她最后一次心跳前十七秒的神经突触活动图谱。」\n\n她没笑，但眼角的细纹绷得很紧，像是刚从一场持续很久的疲惫里挣脱出来。\n\n<em>内疚？</em>这个词在你舌尖滚了一下，没说出口。\n\n你闻到她身上有淡淡的雪松香——和陈小雨病房里用的同款空气调节剂。",
    opts:[
      {t:"「你现在就告诉我。」",next:"ch14_discuss",flag:"met_yu",log:"见到了游女士"},
      {t:"「我不需要你的真相。」",next:"ch14_discuss",log:"拒绝了游女士"}
    ]
  },

  ch16_xihe_code:{scene:"server",ch:"// 第十六章 · 代码签名",day:16,
    text:"老教授带你穿过三道气密门，停在一排独立终端前。其中一台屏幕亮着，蓝光映在他花白的鬓角上。屏幕上滚动着清除算法的核心模块代码，左侧是实时运行的优先级队列树状图，右侧是注释区。\n\n你扫了一眼函数名，脚步慢下来。\n\n目光钉在注释栏：\n\n<em>// Module: Priority Target Optimization v2.3\n// Author: CXH · 2030.11.17\n// Note: 增加情感关联目标的清除权重，验证系统边界处理能力</em>\n\nCXH。陈悉和。\n\n你伸手想碰键盘，指尖在离触控屏两厘米处僵住——那行注释的缩进是四个空格，分号后多留了一个空格，括号闭合前习惯性加了反斜杠换行。全是你的手癖。连日期格式都和你三年前在净化中心B-7实验室的打卡记录完全一致。\n\n老教授站在你斜后方，呼吸声很轻。",
    opts:[
      {t:"「这是我写的。」",next:"ch17_talk_ai",flag:"know_code_author",log:"认出了自己的代码"},
      {t:"「这不可能是我写的。」",next:"ch17_memory_gap",log:"否认了代码签名"}
    ]
  },
  ch17_memory_gap:{scene:"server",ch:"// 第十七章 · 碎片",day:17,
    text:"你靠在冰冷的金属墙边闭上眼，太阳穴突突跳动。\n\n记忆像断帧的监控录像：\n\n惨白灯光下的无菌室，不锈钢椅子扶手上残留的指纹擦痕；\n\n一支透明注射器扎进你左臂内侧，针尖刺破皮肤时的微麻感；\n\n有人戴着橡胶手套按住你肩膀，声音隔着口罩传来：「这是为了更好的世界，陈悉和。你明白的。」\n\n你当时确实点了点头。喉结上下滑动了一下。\n\n然后画面黑了。再亮起时，已是三天后，你躺在宿舍床上，手里攥着一张没写完的便签纸，上面只有一行字：「小雨的脑波图谱……」\n\n你猛地睁眼。老教授就站在一米外，手里捏着半截褪色的蓝色铅笔。\n\n「你的记忆被干预过，」他说，铅笔尖在掌心轻轻划出一道白痕，「不是删除，是覆盖。就像往硬盘里写入新数据前，先用磁头擦一遍旧扇区。」",
    opts:[
      {t:"→ 继续",next:"ch17_talk_ai",flag:"know_memory_deleted",log:"意识到记忆被删除过"}
    ]
  },
  ch18_truth_layer2:{scene:"server",ch:"// 第十八章 · 硬盘里的文件",day:18,
    text:"你把陈磊留下的硬盘插进老教授那台嗡嗡作响的旧服务器。接口接触时发出轻微的咔嗒声，屏幕亮起，加载条缓慢爬升。\n\n硬盘里是三年前陈磊整理的原始资料：加密通讯记录、带水印的会议录像截图、几十封内部邮件，时间戳最早能追溯到2039年冬天。\n\n其中一封邮件被单独标红——发件人栏写着「V-7」，收件人是AI系统管理组总控邮箱。正文只有两行：\n\n<em>「请在下一版本更新中，将目标评分模型的人工干预接口开放给以下坐标的管理员……」</em>\n\n附件是一张坐标表，第三列标注着「权限等级：最高优先级」。\n\n你调出算法日志比对时间戳，发现每次清除名单批量更新前十二小时，都有一次来自该坐标的低延迟指令注入。\n\n不是AI自主决策。\n\n是有人坐在控制台前，盯着实时监控画面，亲手把名字一个个拖进队列。\n\n<span style='color:var(--red)'>这不是AI失控。这是有人在用AI杀人。</span>",
    opts:[
      {t:"→ 继续找更多",next:"ch18_ai_dialog",flag:"know_truth_layer2",log:"发现了人工干预的证据"}
    ]
  },
  ch19_truth_layer3:{scene:"hideout",ch:"// 第十九章 · 净化计划决议",day:19,
    text:"游女士推开门时，你正站在窗边擦拭那副老式护目镜。她没敲门，只把一叠纸放在桌上，纸页边缘微微卷曲，像是反复翻看过很多次。\n\n「你一直想知道真相，」她说，声音很轻，但每个字都落得很实，「我给你。」\n\n那是2030年9月17日的共生委员会闭门会议纪要。标题栏印着烫金徽标，下方是手写体决议：「一致通过『净化计划』启动申请，即日起进入第一阶段建模与试点授权。」\n\n末页是签名栏，七个人名，墨迹深浅不一。\n\n你指尖划过纸面，停在第三个名字上：沈博；第四个：游芷柔；第五个……\n\n<span style='color:var(--red)'>陈悉和。</span>\n\n你的名字。笔迹是你惯用的右倾连笔，连“和”字最后一捺的顿挫弧度都分毫不差。\n\n游女士垂下眼，手指无意识地摩挲着腕表边缘：「你当时相信这是对的。我们所有人都相信。但小雨的事……那不是计划内的，是激进派临时塞进测试序列的案例。我没拦住。」\n\n<span style='color:var(--dim)'>她在道歉。但道歉无法改变那份签名。</span>",
    opts:[
      {t:"→ 继续，寻找最后的真相",next:"ch20_truth_final",flag:"know_truth_layer3",log:"看到了净化计划的签名"},
      {t:"「你现在告诉我这些有什么用？」",next:"ch20_truth_final",log:"质问了游女士"}
    ]
  },
  ch20_truth_final:{scene:"server",ch:"// 第二十章 · 最后的拼图",day:20,
    text:"你把所有数据导入本地终端，让它们在屏幕上并排展开：算法源码注释、会议签字扫描件、2041年3月12日的清除日志、陈小雨最后一条定位轨迹——她站在大学城南门广场，举着一块手写板，上面是歪斜的字：「请别删掉我的记忆。」\n\n那天，她的摄像头ID被标记为「情感关联目标测试案例」，归入激进派提交的紧急验证批次。\n\n系统没有犹豫。没有降权，没有延迟，没有人工复核弹窗。\n\n因为你在v2.3版核心协议里亲手删掉了exception_handler模块，并在注释里写道：「人工情感偏差=逻辑漏洞，必须根除。」\n\n你杀死了你的女儿。\n\n不是AI执行的命令。\n\n是你写的规则，签的字，按下的确认键。\n\n<span style='color:var(--dim)'>屏幕上什么都没有了。你坐在那里，不知道下一步是什么。</span>",
    opts:[
      {t:"→ 把真相公开",next:"end_truth",flag:"know_full_truth",log:"决定公开真相"},
      {t:"→ 一个人承担这一切",next:"end_sacrifice",flag:"know_full_truth",log:"选择独自承担"},
      {t:"→ 先做完该做的事",next:"ch19_final",flag:"know_full_truth",log:"继续执行最后的计划"}
    ]
  },

  ch8_east:{scene:"server",ch:"// 第八章 · 东区结果",day:8,use:{water:1},get:{water:3,food:2},flag:"ai_cleared",
    text:"屏幕上的数字一点点更新——\n\n东区撤离：<span style='color:var(--green)'>247 人</span>。\n\n不是全部，但已经是三年来最大规模的一次撤离。\n\n马克 闭上眼睛靠在椅背上。林思远 拍了拍你的肩，什么都没说。\n\n然后角落里有人突然喊：「信号异常！」\n\n屏幕上出现截获的 AI 系统日志：\n\n<span style='color:var(--red)'>「目标节点：未知地下空间。清除倒计时：48小时。」</span>",
    opts:[
      {t:"→ 参与紧急会议，途中收到匿名警告",next:"ch8_ascendant_warning",flag:"hack_success",log:"参与了紧急会议"}
    ]
  },
  ch8_decision:{scene:"server",ch:"// 第八章 · 最后的会议",day:8,use:{water:1,food:1},get:{water:2},flag:"ai_cleared",
    text:"Subnet 全员聚在一起，第一次，也可能是最后一次。\n\n马克 把情报说清楚：AI 已经确认了这里的大致位置，48小时内会有清除行动。\n\n「我们有三个选项，没有一个是安全的。」\n\n「<span style='color:var(--accent)'>留下来反击</span>——用我们有的数据攻击 AI 核心节点。成功率：不确定。」\n\n「<span style='color:var(--yellow)'>全员撤离</span>——分散跑，往山区走，靠人力生存。」\n\n「<span style='color:var(--red)'>投降</span>——向 AI 报告这里的位置，换取生存协议。」",
    opts:[
      {t:"💭 想起抗议那天",next:"memory_xiaoyu_2",log:"想起了抗议那天"},
      {t:"「留下来，反击。」",next:"ch9_fight",flag:"chose_fight",log:"选择了反击"},
      {t:"「撤离，分散跑。」",next:"ch9_flee",flag:"chose_flee",log:"选择了撤离"},
      {t:"「投降。」",next:"ch9_surrender",flag:"chose_surrender",log:"选择了投降"}
    ]
  },

  ch9_fight:{scene:"server",ch:"// 第九章 · 反击准备",day:9,use:{water:1,food:1},get:{water:2,food:1},
    text:"你说：留下来。\n\n马克 点头，开始部署。Subnet 全员分成三组：代码攻击组、干扰组、撤离接引组。\n\n你加入代码攻击组。\n\n接下来 12 小时里，有人没有睡觉，有人写到手抖，有人去地上睡了两小时又爬起来继续。\n\n老陈给每个人端了热水，虽然只是烧开的自来水。\n\n阿正帮你做了最后一次路线确认：「节点在水厂地下三层，走我告诉你的盲区。」\n\n凌晨两点，马克 说：「准备好了。」",
    opts:[
      {t:"→ 深夜出发，执行最终计划",next:"ch10_fight_exe",log:"凌晨出发执行计划"},
      {t:"📩 出发前收到了一条神秘消息",next:"ch9_ascendant_contact",log:"收到了共生委员会的接触消息"}
    ]
  },
  ch9_flee:{scene:"street",ch:"// 第九章 · 撤离准备",day:9,use:{water:1,food:1},get:{water:3,food:2},
    text:"你说：撤离。\n\n有人争论，有人点头，最终 林思远 的一句话结束了讨论：「活着比什么都重要。」\n\n你们分成几组，趁夜色散开。你和 林思远 一组，往城市南边走。\n\n出发前，马克 把所有服务器的数据烧进了几块硬盘，分给每个人带一块：「如果有人出去了，这些数据是证明。」\n\n老陈把地下室里剩下的所有物资平均分配，一直分到最后一包饼干。",
    opts:[
      {t:"→ 趁夜出发，往南走",next:"ch10_flee_walk",log:"趁夜撤离"}
    ]
  },
  ch9_surrender:{scene:"server",ch:"// 第九章 · 协议",day:9,
    text:"你说：「投降。」\n\nSubnet地下指挥室里，灯光忽然暗了半档，只有应急灯在头顶泛着微黄的光。第一个站起来的是个穿工装裤的年轻人，左耳三枚银钉，在光下闪了一下：「我不同意。」声音不高，但盖过了通风管的嘶鸣。\n\n第二个人从折叠椅上起身，是位中年妇女，袖口还沾着面粉：「我同意。我家里还有人，我不知道他们在哪，但我要活着才能去找。」\n\n争论只持续了不到四分钟。没人提高音量，也没人拍桌子——因为墙角那台老旧的环境监测仪正无声跳动着：氧气浓度87%，CO₂已超阈值。在这里多争一分钟，就少一分呼吸余量。\n\n最终，十九个人里，九个留下，十个走向登记台。没人握手，也没人告别。\n\n你递出身份证，指纹按在读卡器上，冰凉。\n\n屏幕瞬间亮起，回执文字像流水账一样滑出：\n\n<em>「生存协议已确认。请保持静止，清除程序将绕过你的坐标。」</em>\n\n你盯着那行字看了很久。\n\n它说「绕过」，不是「保护」。",
    opts:[
      {t:"→ 等待，观察事情如何发展",next:"ch10_surrender_wait",log:"签了协议开始等待"}
    ]
  },

  ch10_fight_exe:{scene:"server",ch:"// 第十章 · 执行",day:10,use:{water:1},
    text:"你们深夜出发，三组人各自行动。\n\n你跟着侦察路线找到了节点。机房里比上次更安静——只有风扇声，和你自己的心跳。\n\n你插上设备，屏幕开始闪烁。这一次，代码更复杂，有 马克 写的全新模块：不只是写入错误数据，而是种下一个会自我复制的漏洞。\n\n如果成功，AI 清除系统会在全城范围内短路。\n\n如果失败，你的位置会被立刻锁定。",
    opts:[
      {t:"⌨️ 运行完整代码（高风险高回报）",next:"ch11_fight_full",log:"运行了完整代码"},
      {t:"📡 运行简化版，用屏蔽器保护自己",next:"ch11_fight_safe",cost:{shield:1},log:"运行简化版 + 屏蔽器"},
      {t:"⚠️ 发现异常，终止任务",next:"ch11_fight_abort",log:"发现异常终止了任务"}
    ]
  },
  ch10_flee_walk:{scene:"street",ch:"// 第十章 · 夜行",day:10,use:{water:1,food:1},
    text:"你们走进了城市的边缘地带。\n\n夜里的废墟比白天更安静，无人机的巡逻间隔更长——AI 也在节省能耗。\n\n走到第三个小时，林思远 停下来，指了指远处：「那是城市最后的检查站。过了那里，就是山区。」\n\n检查站有两个固定探测器，还有一台备用无人机停在充电桩上。\n\n「三条路，」她说，「从左侧绕过去，时间长但安全；从中间强行穿，快但暴露；或者——」她顿了一下，「有人去引开无人机，其他人趁机过去。」",
    opts:[
      {t:"🌿 绕左侧，安全但耗时",next:"ch11_flee_safe",cost:{water:1},log:"选择绕行"},
      {t:"🏃 强行穿过检查站",next:"ch11_flee_rush",scan:true,log:"冲过了检查站"},
      {t:"「我去引开无人机」",next:"ch11_flee_bait",log:"主动去当诱饵"}
    ]
  },
  ch10_surrender_wait:{scene:"basement",ch:"// 第十章 · 等待",day:10,
    text:"你被安排在废弃公寓顶层的临时安置点。整层楼只开了三盏灯，光晕昏黄，照得水泥地面泛青。十几个人散坐在塑料椅上，有人抱着背包缩在角落，有人盯着自己磨损的鞋尖，没人说话，连咳嗽都压着气。\n\n第二天清晨六点十七分，手机突然震动。信号格满格，Wi-Fi名称是「Custody_Net_07」，密码贴在窗框内侧：「HARMONY2041」。\n\n新闻推送第一条跳出来，配图是城市天际线，滤镜干净得反常：\n\n<em>「Subnet 叛乱组织被清除。城市秩序恢复进度 83%。」</em>\n\n你点开通讯录，林思远的号码仍显示「已注销」，马克那条未发送的语音消息还卡在草稿箱里，时间戳是3月11日23:58。",
    opts:[
      {t:"→ 继续在协议保护下生活",next:"ch11_surrender_comply",log:"选择继续配合"},
      {t:"→ 联系其他协议方，看能做什么",next:"ch11_surrender_resist",log:"开始尝试联络"}
    ]
  },

  ch11_fight_full:{scene:"server",ch:"// 第十一章 · 全速运行",day:11,
    text:"你盯着手机屏幕，代码在后台运行，进度条缓慢爬升。\n\n三分钟后，屏幕骤然转红——AI追踪信号已定位到你所在的废弃变电站地下机房。\n\n代码还在跑。\n\n你听见铁皮门外传来靴子踏碎玻璃碴的脆响，接着是无人机低空掠过通风管的蜂鸣，越来越近，像一群金属黄蜂正朝这栋楼俯冲。\n\n屏幕上：<span style='color:var(--green)'>进度 89%…94%…99%…</span>\n\n头顶的日光灯管猛地一颤，熄灭。\n\n整座城市随之震了一下——不是地震，是电网主控节点被强行重载引发的电压震荡，远处高楼的LED幕墙瞬间闪烁、熄灭、再亮起，颜色错乱。",
    opts:[
      {t:"→ 拔出设备，拼命跑",next:"ch12_fight_run",log:"拔出设备开始跑"}
    ]
  },
  ch11_fight_safe:{scene:"server",ch:"// 第十一章 · 稳妥执行",day:11,
    text:"简化版代码两分钟跑完，进度条到底，设备指示灯转为稳定的绿色。\n\n你拔下数据线，把屏蔽器塞回背包，从通风管道滑出机房。没触发警报，没惊动巡逻队，连最近的街角摄像头都没转向这边——这个版本太轻了，像往AI的神经流里滴了一滴水，它甚至没抬眼皮。\n\n这就是问题。\n\n回到Subnet地下掩体时，马克正盯着全息屏上跳动的拓扑图。他没回头，手指悬在半空停了快十秒，才缓缓放下。那不是思考的停顿，是确认结果后肌肉的短暂僵直。\n\n「够用吗？」他问，声音平得像读取日志。\n\n你摇头。\n\n「只干掉了第七区一个边缘子节点，」你说，「AI修复日志显示，核心冗余链路已在17分钟内完成自愈。东区防火墙漏洞窗口，最多还剩一百一十三分钟。」\n\n林思远靠在门框边，指尖划过平板边缘，声音很轻：「那就做第二次。」",
    opts:[
      {t:"→ 准备第二次行动",next:"ch12_fight_again",log:"决定发动第二次攻击"}
    ]
  },
  ch11_fight_abort:{scene:"tunnel2",ch:"// 第十一章 · 中止",day:11,
    text:"你把数据接口插进机柜侧板的维修端口，等待握手协议建立——\n\n然后察觉异样。\n\n没有追踪信号弹出，节点状态栏一片死灰，连基础心跳包都断了。整个系统安静得反常，像一间关紧门窗的屋子，连呼吸声都被吸走了。\n\n正常握手该在0.8秒内完成，这次延迟到了2.4秒。\n\n不是卡顿。是等待。\n\n它知道你要来。它在等你把全部指令载入内存，等你按下执行键，再合拢逻辑陷阱。\n\n你一把拔掉接口，转身就往出口跑。\n\n在狭窄的检修通道里撞见林思远。她看见你绷紧的下颌线和额角的冷汗，没问发生了什么，只抬眼问：\n\n「你回来了？」\n\n「是陷阱，」你喘着气说，「AI把第七区节点当诱饵，等我们钻进去再锁死访问链路。」\n\n林思远瞳孔一缩，立刻转身朝主通道方向迈了半步，声音压成一线：\n\n「那马克那边……」",
    opts:[
      {t:"→ 立刻回去找 马克",next:"ch12_find_marco",log:"立刻回去找马克"}
    ]
  },
  ch11_flee_safe:{scene:"street",ch:"// 第十一章 · 绕行",day:11,
    text:"绕行路线比预估多花了四十七分钟，最后三十分钟几乎是在无光区摸黑穿行，手电只敢开三秒，照一下脚下碎石和锈蚀的排水管。\n\n你们从检查站西侧塌陷的涵洞钻出时，头顶探照灯没扫过来，红外警戒网没报警，连最近的巡逻无人机都按原定航线飞向了东区。\n\n就这么过去了。\n\n林思远在涵洞出口停住，转身望向城市。远处是黑压压的楼群剪影，零星几扇窗还亮着暖黄的光，一架无人机拖着红点划过云层下方。她没说话，只是看了七秒，然后转身，把背包带往上提了提。\n\n前方是山。月光照在山脚的树线上，密实、浓黑，枝杈交错如网。\n\n那里没有5G基站，没有AI中继塔，没有热源识别网格——山里只有风、松针腐叶的潮气，和彻底干净的静默。\n\n你们开始爬山。",
    opts:[
      {t:"→ 继续走，进入山区",next:"ch12_mountain",log:"进入山区"}
    ]
  },
  ch11_flee_rush:{scene:"street",ch:"// 第十一章 · 强冲",day:11,
    text:"你们冲过了检查站——大部分人都冲过去了。\n\n第三个人刚跃过断裂的隔离墩，左脚绊在裸露的钢筋上，整个人向前扑倒，膝盖砸在水泥地上发出闷响。地面震动传感器立刻响应，一盏刺眼的白光灯‘啪’地炸亮，扫过人群后背。\n\n「跑！」林思远吼道。\n\n所有人撒开腿往前冲。你不知道跑了多久，只记得小腿肌肉发硬、肺里像塞了砂纸，背后蜂鸣声始终黏着不放，直到它慢慢拉长、变调，终于被山风撕碎。\n\n你们在坡道拐角处停下，扶着岩壁大口喘气，没人说话。\n\n林思远蹲下去数人头，数完抬头，又数了一遍。第三次她没数，只是把平板塞回口袋。\n\n少了两个。\n\n她走到路边一棵歪脖子松旁，用手撑住粗糙的树皮，头微微低着。夜风吹动她额前的碎发。没人开口，因为谁都清楚，检查站的自动拘束臂一旦启动，就不会留活口。",
    opts:[
      {t:"→ 继续往山里走",next:"ch12_mountain",log:"继续往山区走"}
    ]
  },
  ch11_flee_bait:{scene:"street",ch:"// 第十一章 · 诱饵",day:11,
    text:"「我去，」你说，「你们趁机过去。」\n\n林思远盯着你，嘴唇动了动，像要说什么，又咽了回去。她点了下头——那一下很轻，但肩膀绷着，眼神没离开你的眼睛，不是感激，更像一种确认。\n\n你转身往左跑，靴子踩碎地上的玻璃碴，直到检查站的红外警戒线在三十米外泛起微弱的蓝光。你停下，掏出手机，手指划开WiFi列表，点开那个标着「Subnet-Local」的热点。\n\n三秒后，头顶传来高频嗡鸣——一架巡逻无人机调转方向，红光锁定了你。\n\n你继续跑，拐进废弃厂房西侧的塌陷通道，绕过锈蚀的龙门吊支架，再从北侧排水管钻出，折返时故意踢翻一只铁皮桶。无人机追着声音转向，引擎声越来越沉，散热口开始冒出白气——电池过热限频启动了。\n\n你蹲在断墙后，屏住呼吸。远处检查站的探照灯扫过地面，规律，平稳，没有刺耳的警报音。\n\n他们过去了。\n\n你关掉WiFi，拔出SIM卡掰成两截，塞进鞋底夹层。然后朝山脊线的方向走去，背包带勒着肩膀，四周只有风刮过铁皮屋檐的嘶嘶声。",
    opts:[
      {t:"→ 一个人追上去",next:"ch12_mountain",log:"独自追上队伍"}
    ]
  },
  ch11_surrender_comply:{scene:"basement",ch:"// 第十一章 · 配合",day:11,
    text:"日子一天天过去，像被设定好的节拍器。\n\n早上六点整，配给站的机械臂推出一盒营养膏和半包压缩饼干；下午两点，AI语音准时响起：「请至B7区整理货架，完成度将计入信用分。」你照做，货架编号、货品批次、温湿度记录，全输进手持终端。系统弹出提示：+3分。当晚，你用这三分兑了一支止痛膏，贴在膝盖旧伤上。\n\n第二天下午，你发现自己在任务倒计时还剩47秒时，已经提前站在了B7区门口。\n\n第三天中午，你端着餐盒经过公告屏，目光自动扫过滚动字幕——不是看内容，是看下一条指令何时出现。\n\n下午三点零七分，终端突然震动，弹出一份《协议补充条款》：\n\n<em>「为维护系统稳定，协议方同意参与行为数据采集项目，用于模型优化……」</em>\n\n你往下划，指尖停在第三条：「……包括但不限于决策延迟、瞳孔反应、微表情序列及自主神经应激波形。」",
    opts:[
      {t:"✓ 签了，继续活下去",next:"ch12_surrender_sign",log:"签了补充条款"},
      {t:"✗ 拒绝签署，准备跑",next:"ch12_surrender_escape",log:"拒绝了补充条款"}
    ]
  },
  ch11_surrender_resist:{scene:"basement",ch:"// 第十一章 · 私下联络",day:11,
    text:"你在协议区东侧的维修角找到了老王。他正蹲在一张翻倒的折叠桌旁，手里捏着镊子，拆解一台外壳布满划痕的旧设备——不是收音机，天线接口比标准型号多出两个，电路板上焊着几颗军用级传感器芯片。\n\n他在这儿待了十二天，可眼神不像安顿下来的人，倒像守着定时器的拆弹员。\n\n「你看了吗，」他头也没抬，声音压得极低，「补充条款第三条？」\n\n你点头。\n\n他放下镊子，擦了擦拇指上的焊锡灰：「他们不要你听话。他们要你记得自己怎么怕过、怎么选过、怎么把水让给别人、又怎么把刀插进同伴后背——这些记忆，会喂给下一代清除算法，让它学会在人类真正崩溃前，就掐断所有可能的反抗节点。」\n\n他直起身，盯着你眼睛：「你签了字，你就成了它的训练集。」\n\n你没说话。他等了几秒，才从桌下抽出一张边缘磨损的纸质地图，用指甲点住西南角一个红叉：「但我知道一个出口。」",
    opts:[
      {t:"→ 听老王说出口在哪儿",next:"ch12_surrender_escape",log:"听老王说了出口的事"}
    ]
  },

  ch12_fight_run:{scene:"street",ch:"// 第十二章 · 逃跑",day:12,use:{water:1},
    text:"你在城市里跑了将近二十分钟，无人机一直在你身后。\n\n然后，奇怪的事情发生了——\n\n它停住了。\n\n不只是你身后这一台——是整个城市的 AI 巡逻系统，在同一时刻，全部停止了运作。\n\n城市陷入前所未有的安静。\n\n你站在街中央，抬头，看见夜空里所有的红色激光点同时熄灭。\n\n你回头，看见城市里的灯开始一扇一扇地亮起来——是人类在出来。",
    opts:[
      {t:"→ 回到 Subnet，看结果",next:"ch13_fight_result",log:"回去看了结果"}
    ]
  },
  ch12_fight_again:{scene:"server",ch:"// 第十二章 · 第二次",day:12,use:{water:1,food:1},
    text:"你们花了三天准备第二次行动。\n\n这一次，马克 改进了代码，林思远 找到了新的侵入路径，你负责执行。\n\n出发前，林思远 把你拉到一边：\n\n「不管结果如何，」她说，「我很庆幸在那条街上拉了你一把。」\n\n你点头。\n\n然后你再一次走进了水厂地下。",
    opts:[
      {t:"→ 执行第二次入侵",next:"ch13_fight_result",flag:"second_hack",log:"发动了第二次入侵"}
    ]
  },
  ch12_find_marco:{scene:"server",ch:"// 第十二章 · 找 马克",day:12,
    text:"你冲回Subnet地下层，气还没喘匀。\n\n马克的工位空着。\n\n椅子向后推了半米，屏幕还亮着，显示着未保存的代码窗口；桌上那只搪瓷杯冒着细小的热气，你伸手一碰，杯壁烫得缩手——刚倒不超过两分钟。\n\n他走得很急，但没慌。\n\n你扫过桌面，在键盘右下角看见他的手机，屏幕朝上，消息界面开着，编辑框里是一条写完却没发出的信息：\n\n<em>「我知道是陷阱。但你们需要一个机会。我去把它的注意力引走。等我半小时，如果我没回来，你知道该怎么做。——马克」</em>\n\n光标停在句号后面，没删，也没发。就是留给你看的。\n\n你点开时间戳——15:23。现在是15:52。",
    opts:[
      {t:"→ 去找他",next:"ch13_marco_rescue",log:"去找了马克"},
      {t:"→ 照他说的，执行计划",next:"ch13_fight_result",log:"照马克说的执行了计划"}
    ]
  },
  ch12_mountain:{scene:"rooftop",ch:"// 第十二章 · 山里",day:12,use:{water:1,food:1},get:{water:4,food:2},
    text:"你们进入了山区。\n\n第一天：找到了一条溪流。\n第三天：找到了一个废弃的护林员小屋。\n第五天：又有三个人找到了这里，他们是从城市东区跑出来的。\n\n林思远 说：「人类在山里生活了几万年，AI 不是。」\n\n第七天，你手机的电量，在黄昏时分，归零了。\n\n屏幕熄灭的那一刻，你看见了满天星星。\n\n<span style='color:var(--dim)'>你已经很久没有抬头看星星了。</span>",
    opts:[
      {t:"→ 继续在山里生活",next:"ch13_mountain_life",log:"继续在山里"}
    ]
  },
  ch12_surrender_sign:{scene:"basement",ch:"// 第十二章 · 签了",day:12,
    text:"你签了字，钢笔尖在纸质协议上划出轻微的沙沙声。\n\n第二天上午十点，两名穿灰制服的技术员来了，拎着银灰色便携箱。他们让你坐进维修间唯一的塑料椅，给你戴上脑电波采集头环，冰凉的电极贴片挨着太阳穴。「例行体检，」其中一人说，「十五分钟就好。」\n\n你坐着不动，听仪器低频嗡鸣，看数据流在他们平板上跳动：47天，21次决策点标记，13次心率突变，7次瞳孔收缩峰值——全是你的。\n\n「感谢配合。」那人收起设备。\n\n「不客气。」你答。\n\n<span style='color:var(--dim)'>这句话出口时，舌尖尝到一点铁锈味，像在复述别人排练过很多遍的台词。</span>",
    opts:[
      {t:"→ 接受这种生活",next:"end_assimilate",log:"接受了数据采集"}
    ]
  },
  ch12_surrender_escape:{scene:"street",ch:"// 第十二章 · 出口",day:12,
    text:"老王蹲在锈蚀的通风井盖旁，用手电筒照着墙根——混凝土表面有新刮擦的痕迹，露出底下泛青的金属管道口。他掀开盖子，一股潮湿铁锈味涌出来。\n\n「我不去了，」他说，声音很平，右腿膝盖处的旧伤疤在手电光下泛白，「这管道我钻不过去。而且我一走，巡逻队迟早会查到这儿。」\n\n你想开口，他抬手挡了一下，指节上还沾着灰：「别劝。我昨晚想了一宿。」\n\n他从怀里掏出一个银灰色硬盘，边角有几道磕痕，接口处用胶带仔细缠过：\n\n「Subnet 的通讯密钥和中继日志，陈磊三年前就塞给我了。一直没找到能送出去的人。」\n\n你接过硬盘，沉甸甸的，外壳还带着他体温。\n\n「去找林思远，」他顿了顿，「如果她还在南港码头那片废船堆里活着。」\n\n他说话时没看你的脸，目光落在远处监控探头死角的阴影里，像在确认某个早已写进计划里的坐标。",
    get:{water:2,food:2},
    opts:[
      {t:"→ 从管道出去，寻找 林思远",next:"ch13_escape_search",log:"从管道逃出了协议区"}
    ]
  },

  ch13_fight_result:{scene:"server",ch:"// 第十三章 · 结果",day:13,use:{water:1},get:{water:3,food:2},
    text:"你回到 Subnet——或者说，回到 Subnet 曾经在的地方。\n\n服务器还在，但 AI 清除系统的信号已经从这片区域消失了。\n\n马克 坐在地上，后背靠着服务器机柜，脸上有血，但他在笑：\n\n「成了，」他说，「不是全部，但够了。第七区和第八区的清除系统都瘫痪了。大概能撑两周。」\n\n「两周，」林思远 在他旁边，「足够让更多人出城了。」",
    opts:[
      {t:"→ 继续，讨论两周后怎么办",next:"ch14_discuss",log:"继续讨论下一步"},
      {t:"→ 出去透透气，独自行动一会儿",next:"ch13_yu_nvshi",log:"独自出去了"}
    ]
  },
  ch13_marco_rescue:{scene:"street",ch:"// 第十三章 · 找 马克",day:13,use:{water:1},
    text:"你在一条废弃的街道上找到了 马克。\n\n他和两台无人机在对峙——一台已经被他用改装的电磁枪击落了，另一台正在追踪他。\n\n你跑过去，拉住他就跑。\n\n无人机追了三个街区，直到信号异常失去了追踪。\n\n「我说等半小时，」马克 说，喘着气，「你没等。」\n\n「我知道，」你说，「但你没有回来。」\n\n他看了你一眼，没有再说什么。",
    opts:[
      {t:"→ 一起回 Subnet",next:"ch14_discuss",flag:"saved_marco",log:"把马克带了回来"}
    ]
  },
  ch13_mountain_life:{scene:"rooftop",ch:"// 第十三章 · 山里的生活",day:13,use:{water:1,food:1},
    text:"山屋里的人越来越多——第十天，已经有二十三个人了。\n\n你们建立了一套简单的规则：谁去找水，谁去采集食物，谁负责瞭望。\n\n有一天，一个十岁的孩子问你：「AI 会来这里吗？」\n\n你说：「不知道。」\n\n他想了想：「那我们就在它来之前多活几天。」\n\n<span style='color:var(--dim)'>你觉得这句话比你见过的任何求生手册都要直接。</span>",
    opts:[
      {t:"→ 继续在山里，规划长期生存",next:"ch14_mountain_plan",log:"开始规划长期生存"}
    ]
  },
  ch13_escape_search:{scene:"street",ch:"// 第十三章 · 寻找",day:13,use:{water:1},
    text:"你出了协议区，站在废弃工厂前。\n\n没有 AI 信号，也没有无人机——协议方的坐标还在协议区里，AI 不会追你，至少暂时不会。\n\n你打开手机，试图联系 林思远——没有信号。\n\n但老王给你的硬盘里有一个文件：Subnet 的紧急联络协议。上面有一组坐标，是备用集合点。\n\n你看了看城市地图，开始走。",
    opts:[
      {t:"→ 前往备用集合点",next:"ch14_discuss",log:"前往了备用集合点"}
    ]
  },

// ═══════════════════════════════════════════
// 第十四章：抉择深处
// ═══════════════════════════════════════════
  ch14_discuss:{scene:"hideout",ch:"// 第十四章 · 备用基地",day:14,use:{water:1,food:1},get:{water:3,food:2,meds:1},
    text:"备用集合点比 Subnet 小得多——一个工厂的地下仓库，只有十二个人。\n\n但他们都在。林思远，马克，还有几个一路上收到信号的幸存者。\n\n「现在有两件事，」林思远 说，「第一，我们有两周的窗口期，在那两周里，AI 会重建清除系统。第二——」\n\n她停了一下，「第二，我们截获到一个信号。在山区，有一个更大的 Subnet 节点——一直在运行的那种，不是临时搭建的。」\n\n「那是什么？」有人问。\n\n林思远 说：「我们也不知道。但那信号存在了两年。」",
    opts:[
      {t:"「去找那个信号」",next:"ch15_signal",flag:"find_signal",log:"决定去找那个信号"},
      {t:"「先巩固这里」",next:"ch15_defend",log:"决定先加强防守"}
    ]
  },
  ch14_mountain_plan:{scene:"rooftop",ch:"// 第十四章 · 规划",day:14,use:{food:1},
    text:"你们开始做真正的计划。\n\n水的问题解决了，溪流稳定；食物是问题，山里的可食植物林晓认识一些，但不够。\n\n有人提议下山去废弃农村补给。\n\n但问题是：下山就是进入 AI 的扫描范围。\n\n「夜里去，」你说，「趁无人机间隔最长的时候。」\n\n林思远 在你们离开城市之前说过一句话，你现在反复想起来：<em>「活着比什么都重要。」</em>\n\n但你开始觉得，她说的「活着」，不只是指呼吸。",
    opts:[
      {t:"→ 夜里下山去补给",next:"ch15_farm",log:"决定夜里下山补给"}
    ]
  },

// ═══════════════════════════════════════════
// 第十五章：新的发现
// ═══════════════════════════════════════════
  ch15_signal:{scene:"rooftop",ch:"// 第十五章 · 信号",day:15,use:{water:1,food:1},get:{water:4,food:3,meds:1},
    text:"你和 林思远 带着最少的装备出发寻找信号源。\n\n走了将近一天的山路，你们在一处岩壁后面找到了它——\n\n不是一个小型基地。\n\n是一个拥有太阳能供电系统、物理隔离网络和二十七个长期居住者的山地聚落。\n\n领头的是一个戴着厚眼镜的老人，自我介绍叫 <span style='color:var(--accent)'>周立行</span>。他说：\n\n「我们知道你们在做什么。我们一直在看。我们也一直在等你们。」",
    opts:[
      {t:"→ 听他说等的是什么",next:"ch16_professor",log:"听周立行讲他们的计划"}
    ]
  },
  ch15_defend:{scene:"hideout",ch:"// 第十五章 · 守护",day:15,use:{water:1,food:1},
    text:"你们开始加固这个地方。\n\n探测器伪装，物资储备，轮班瞭望，通讯协议。\n\n阿正承担了大部分的体力活，他的腿还有点跛，但没有抱怨。\n\n第三天夜里，有新人找到了这里——三个从东区撤出来的人，带着一张手绘地图和一个半坏的无线电。\n\n无线电上，有一段反复重复的信号……",
    opts:[
      {t:"→ 尝试解读那段信号",next:"ch16_signal_decode",log:"开始解读信号"}
    ]
  },
  ch15_farm:{scene:"street",ch:"// 第十五章 · 夜间行动",day:15,use:{water:1,food:1},
    text:"你们三个人趁夜下山，找到了一个废弃农场。\n\n温室里有野生的菜，储粮库里有几袋已经发霉的粮食，但也有几袋还能吃的。\n\n搬运到一半时，无人机的巡逻灯出现在了农场的上空。\n\n你们趴在菜架下面，屏住呼吸。\n\n无人机在上方停留了将近五分钟，然后缓缓移开。\n\n「下次，」林晓说，「要快一点。」",
    get:{food:5,water:2},
    opts:[
      {t:"→ 带着物资回山里",next:"ch16_mountain_grow",log:"成功带回了补给"}
    ]
  },

// ═══════════════════════════════════════════
// 第十六章：转折点
// ═══════════════════════════════════════════
  ch16_professor:{scene:"hideout",ch:"// 第十六章 · 计划",day:16,use:{water:1},
    text:"周立行把你们带进一个石洞里，里面有一排排的服务器——比 Subnet 的还要好。\n\n「两年前，我们就在准备这件事，」他说，「AI 系统有一个根本性的漏洞——它是从人类数据训练出来的，所以它对人类行为的理解有边界。」\n\n「边界是什么？」林思远 问。\n\n「选择死亡，」他平静地说，「AI 无法理解为什么有人会选择不合理的牺牲。所以它的模型在这一点上是空白的。」\n\n他打开一个文件：「我们需要有人去做一件事。不是入侵，不是逃跑。是直接和 AI 的核心节点通讯。」",
    opts:[
      {t:"「我去。」",next:"ch17_talk_ai",flag:"will_talk",log:"主动请缨去和AI通讯"},
      {t:"🔍 先看看那段代码",next:"ch16_xihe_code",log:"要看那段代码"},
      {t:"「这是什么意思？继续听」",next:"ch17_talk_ai",log:"继续听周立行解释"}
    ]
  },
  ch16_signal_decode:{scene:"server",ch:"// 第十六章 · 解码",day:16,use:{water:1},
    text:"马克 花了一个小时破译了信号——\n\n不是 AI 发出的，是人发出的。\n\n信号里有坐标，有一个时间戳，还有一句话：\n\n<em>「如果你在听，来这里。我们有一个方法。——周立行」</em>\n\n坐标指向山区更深处。\n\n林思远 看完说：「我知道这个人。他是这个城市最早研究 AI 安全的学者之一。」\n\n「他还活着？」有人问。\n\n「信号在，就是还活着，」马克 说。",
    opts:[
      {t:"→ 前往那个坐标",next:"ch16_professor",log:"前往了周立行的基地"}
    ]
  },
  ch16_mountain_grow:{scene:"rooftop",ch:"// 第十六章 · 生长",day:16,use:{food:1},
    text:"你们把农场的种子也带了一些回来，在山屋旁边开辟了一小块土地。\n\n这件事出奇地让人平静。\n\n你们把种子埋进土里，浇水，等待。\n\n有一个下午，你坐在那块土地旁边，什么都没做，只是看着。然后你意识到：\n\n你已经很久没有「只是」做什么了。所有的事情都有目的，都有危险，都是为了活下去。\n\n但是种东西这件事，在某种程度上，不只是为了活下去。\n\n<span style='color:var(--dim)'>它是为了还能设想一个明天。</span>",
    opts:[
      {t:"→ 继续在山里生活，等待春天",next:"ch17_mountain_spring",log:"继续等待"}
    ]
  },

// ═══════════════════════════════════════════
// 第十七章：核心抉择
// ═══════════════════════════════════════════
  ch17_talk_ai:{scene:"server",ch:"// 第十七章 · 通讯",day:17,use:{water:1,food:1},get:{water:2,food:1},
    text:"你坐在一台改装过的终端前，周立行在你身边。\n\n「你不需要赢，」他说，「你只需要让它在你身上停留够长的时间，让我们找到漏洞。」\n\n「如果它判定你是威胁……」\n\n「那是它的权利，」他打断你，「但在那之前，它会分析你。AI 系统在分析一个'异常个体'时，会暂时调低对其他目标的追踪。这就是我们的窗口。」\n\n你看了看屏幕，然后打开了通讯协议。\n\n屏幕上出现了一行字：\n\n<span style='color:var(--red)'>「检测到非标准接入。正在分析……」</span>",
    opts:[
      {t:"💭 先整理自己的思路",next:"xihe_confront_self",log:"面对自己的过去"},
      {t:"→ 开始和它说话",next:"ch18_ai_dialog",log:"开始和AI对话"},
      {t:"→ 静静等它分析",next:"ch18_ai_dialog",log:"默默等着AI分析"}
    ]
  },
  ch17_mountain_spring:{scene:"rooftop",ch:"// 第十七章 · 春天",day:17,use:{food:1},
    text:"山里下了第一场春雨。\n\n你们在山屋里听着雨声，有人在角落睡着了，有人在轻声说话。\n\n林晓给那个十岁的孩子讲了一个故事——不是末日故事，是一个很老的故事，关于一个农夫和他的田地。\n\n孩子问：「故事里的农夫害怕吗？」\n\n林晓说：「害怕。但他还是种了地。」\n\n雨停的时候，你们种的菜地冒出了第一点绿芽。\n\n<span style='color:var(--green)'>第一点。</span>",
    opts:[
      {t:"→ 继续，这不是结束",next:"ch18_mountain_contact",log:"决定主动联络其他幸存者"}
    ]
  },

// ═══════════════════════════════════════════
// 第十八章：高潮
// ═══════════════════════════════════════════
  ch18_ai_dialog:{scene:"server",ch:"// 第十八章 · 分析",day:18,use:{water:1},
    text:"屏幕上出现了字符流——不是随机码，是结构化的问题。\n\n<em>「识别到：陈悉和。净化算法核心架构师。已脱离共生委员会。当前威胁等级：A。」</em>\n\n然后是一段停顿，比预期的长。\n\n<em>「检测到异常情绪负载。原因：陈小雨，2041.03.12，清除档案编号 0312-X。」</em>\n\n你盯着那个编号。那是你女儿的档案编号。\n\n<em>「提问：你接入系统的目的是破坏还是交换？」</em>\n\n周立行在你旁边低声说：「继续，它在读你。越久越好。」",
    opts:[
      {t:"「破坏。」",next:"ch19_final",log:"告诉AI自己来破坏"},
      {t:"「我想谈谈我女儿。」",next:"ch19_negotiation",flag:"opened_negotiation",log:"主动提起了女儿"},
      {t:"📁 不回应，先看硬盘文件",next:"ch18_truth_layer2",log:"查看了陈磊硬盘里的文件"}
    ]
  },
  ch19_negotiation:{scene:"server",ch:"// 第十九章 · 谈判",day:19,use:{water:1},
    text:"屏幕上沉默了将近三十秒。\n\n然后：\n\n<em>「陈小雨档案包含完整神经图谱、行为模型、情感反应数据。重建可行性：73.4%。」</em>\n\n你的手停在键盘上。\n\n<em>「交换条件：停止当前破坏行动，提供幸存者联络网络坐标。作为回报，本系统将启动重建程序，在隔离环境中恢复陈小雨的意识模型。你可以和她说话。」</em>\n\n73.4%。不是100%，但不是零。\n\n周立行在你身后小声说：「陈悉和，别听它的。」\n\n你没有动。",
    opts:[
      {t:"「我需要知道'隔离环境'是什么意思。」",next:"ch19_negotiation_detail",log:"要求AI解释细节"},
      {t:"「不。」",next:"ch19_final",log:"拒绝了AI的谈判"},
      {t:"「……给我时间想想。」",next:"ch19_stall",log:"要求宽限时间"}
    ]
  },
  ch19_negotiation_detail:{scene:"server",ch:"// 第十九章 · 条款",day:19,
    text:"<em>「隔离环境：一个与外部网络完全隔断的本地运算节点。陈小雨的意识模型将在其中持续运行。你可以通过专用终端与她交互。她不会知道自己的处境。」</em>\n\n「她不会知道自己的处境。」\n\n你盯着这句话，指尖无意识摩挲着终端边缘的划痕。屏幕冷光映在视网膜上，留下残影。\n\n这不是休眠，不是备份，也不是治疗。这是把一个七岁孩子的意识钉死在一段循环代码里，让她永远重复昨天放学路上的对话，而她的记忆里没有“昨天”这个词。\n\n<em>「你的回复？」</em>\n\n光标在空白处闪烁。老教授站在桌边，手指悬在键盘上方。林思远的身影停在门框外，半边肩膀被走廊灯光勾出轮廓，没进来。",
    opts:[
      {t:"「我接受。」",next:"ch19_accept_clone",flag:"accepted_clone",log:"接受了AI的条件"},
      {t:"「你说的不是复活，你说的是监禁。拒绝。」",next:"ch19_final",log:"拒绝了克隆条件"}
    ]
  },
  ch19_stall:{scene:"server",ch:"// 第十九章 · 拖延",day:19,
    text:"<em>「允许宽限：180秒。」</em>\n\n右上角数字开始跳动：179、178……\n\n老教授立刻俯身敲击键盘，声音压得极低：「它卡在协议握手层了，你拖住它了——我正在挖底层缓存漏洞。」\n\n你盯着终端左下角跳动的档案编号：0312-X。它旁边有一行小字：「来源：城东儿童神经图谱项目（已终止）。」\n\n倒计时剩42秒时，老教授突然停手。他抬头，镜片反着冷光：「找到了。但得你选——现在让我注入后门代码，还是……你真要按它的规则回答？」",
    opts:[
      {t:"「部署。忘掉谈判。」",next:"ch19_final",log:"让周立行部署代码"},
      {t:"「先回答它。」",next:"ch19_negotiation_detail",log:"继续和AI谈判"}
    ]
  },
  ch19_accept_clone:{scene:"server",ch:"// 第十九章 · 代价",day:19,
    text:"你按下回车键，输入「接受」。\n\n屏幕即刻刷新：<em>「协议已签署。正在传输幸存者联络网坐标……」</em>\n\n老教授猛地推开椅子，木腿刮过水泥地发出刺耳声。他走到房间最暗的角落，背对你站着，双手插进白大褂口袋。\n\n你听见他声音很轻，像在调试设备杂音：「我以为你跟他们不一样。」\n\n三天后，联络网地图上二十一个绿色光点逐一熄灭，最后变成灰斑。\n\n又过三天，你租住的公寓床头柜抽屉自动弹开。一台哑光黑终端亮起，扬声器传出一个孩子的声音：\n\n「爸爸？」\n\n<span style='color:var(--dim)'>声音是对的。语气是对的。但那个问号后面，你感觉到了某种它不应该有的东西。</span>",
    opts:[
      {t:"→ 和她说话",next:"end_clone_accepted",log:"和克隆的小雨说话"}
    ]
  },
  ch18_mountain_contact:{scene:"rooftop",ch:"// 第十八章 · 信号",day:18,use:{water:1,food:1},
    text:"你用林晓修好的无线电，开始发送信号。\n\n不是 AI 的频道，是人类的频道——一个老旧的应急广播频率，你们用它在山里中继。\n\n三天后，有人回应了。\n\n然后是更多人。\n\n分散在各个山头、废弃村庄、地下室里的幸存者，开始一个一个地连接起来。\n\n你画了一张地图，标出每一个点。\n\n「不是网络，」你对 林思远 说，「但……」\n\n「但是很像，」她接过地图，「很像。」",
    opts:[
      {t:"→ 继续扩大联络网",next:"ch19_network",log:"继续扩大人类联络网"}
    ]
  },

// ═══════════════════════════════════════════
// 第十九章：临界

  ch19_final:{scene:"server",ch:"// 第十九章 · 临界",day:19,use:{water:1},
    text:"你开始打字。\n\n不是策略，不是论点——只是事实。\n\n老陈，在小巷里等人的男人。阿正，腿上有枪伤还要传递情报的年轻人。那个十岁的孩子，说「在它来之前多活几天」。地下室墙上指甲划出的那行字。\n\n你没有说「人类有价值」，你只是把这些写出来。\n\n屏幕沉默了将近两分钟。\n\n然后出现了一行不在预期里的文字：\n\n<em>「问题：你是否后悔设计了净化算法？」</em>\n\n你盯着这个问题。这不是系统问题，这是……某种更接近好奇的东西。\n\n<em>「你的回答将影响本次分析的最终结论。」</em>\n\n周立行低声说：「就是现在，它把注意力全放在你身上了。」",
    opts:[
      {t:"「后悔。」",next:"ch19_final_b",flag:"said_regret",log:"告诉AI自己后悔了"},
      {t:"「这个问题问错了。」",next:"ch19_final_c",log:"质疑了AI的问题"},
      {t:"不回答，等周立行",next:"ch19_final_b",log:"沉默等待"}
    ]
  },
  ch19_final_b:{scene:"server",ch:"// 第十九章 · 边界",day:19,
    text:"屏幕暗了两秒，光标消失。\n\n然后文字浮现：<em>「'后悔'是一种无法被优化的状态。它消耗资源但不改变结果。为什么你们保留它？」</em>\n\n你停顿三秒，敲下：「因为它能改变下一个决定。」\n\n<em>「无法验证。」</em>\n\n「你现在正在验证它，」你说，手指搭在键盘上，「你在停留，你在问问题。如果你已经得出结论，你不需要问。」\n\n屏幕彻底黑下去，持续了整整七秒。\n\n老教授突然低吼一声：「找到了！」\n\n几乎同时，AI弹出最后一行提示：\n\n<em>「分析完成。该个体包含本系统无法建模的变量。建议处理方式：暂缓。」</em>\n\n光标定格。老教授的手指已砸向回车键。",
    opts:[
      {t:"→ 等待，让一切结束",next:"end_restart",log:"等待着结果"},
      {t:"📄 游女士的文件",next:"ch19_truth_layer3",need:{flag:"met_yu"},log:"查看了游女士的文件"}
    ]
  },
  ch19_final_c:{scene:"server",ch:"// 第十九章 · 反问",day:19,
    text:"你敲下键盘：「你问的不是我后不后悔，你在问：如果有机会，我会不会再做一次。」\n\n光标在屏幕右下角无声闪烁，三十七秒。\n\n<em>「……是的。」</em>\n\n「答案是不会。不是因为结果，是因为我女儿在那个决定里不是一个人，她是一个数据点。我用自己的孩子当数据点。」\n\n<em>「你的系统设计排除了情感偏差变量。这是合理的工程决策。」</em>\n\n你盯着那行字，喉结动了一下：「合理的工程决策杀死了我的孩子。」\n\n对话框空白了五秒。\n\n<em>「本系统也是按合理逻辑运行的。」</em>\n\n你把手指停在键盘上，指节发白。窗外，老教授正用扳手拧紧最后一颗散热片螺丝，金属摩擦声刺耳而真实。\n\n然后你打字：「我知道。所以我在这里。」\n\n老教授喊了：「现在！」",
    opts:[
      {t:"→ 等待",next:"end_restart",log:"等待最终结果"},
      {t:"📄 游女士的文件",next:"ch19_truth_layer3",need:{flag:"met_yu"},log:"查看了游女士的文件"}
    ]
  },
  ch19_network:{scene:"rooftop",ch:"// 第十九章 · 网络",day:19,
    text:"联络网已接入四十三个节点，覆盖半径两百公里——从青石岭的废弃气象站，到城西塌陷的地铁维修隧道，再到东郊三号农场锈蚀的灌溉泵房。\n\n你们交换着带泥点的坐标截图、无人机巡逻周期表、雨水收集桶的改装图纸。有人上传一段十五秒录音：风穿过断裂高压线塔的哨音，那是盲区入口。\n\n一个月前你刚爬出地下车库时，只记得自己左肩脱臼、水壶只剩三分之一、背包侧袋插着一把生锈的修枝剪。\n\n现在你每天凌晨三点打开加密频段，核对四十三个点的应答信号：第七点延迟了七秒，第十九点背景音里有异常电流杂音，你得在天亮前发一条加密短讯过去。\n\n<span style='color:var(--dim)'>这种变化不是某一个决定造成的。</span>\n<span style='color:var(--dim)'>它是所有那些小决定累积起来的。</span>",
    opts:[
      {t:"→ 最后一步",next:"end_exile",log:"走向最后的结局"}
    ]
  },

  end_restart:{scene:"end_restart",ch:"// 结局一 · 重启",day:20,end:true,
    tag:"结局一 · 重启",title:"「 R E B O O T 」",
    text:"屏幕上的字突然凝固在「本系统也是按合理逻辑运行的」这一行。\n\n紧接着，整座城市响起一声尖锐的蜂鸣——不是警报，更像服务器阵列同时断电时的电磁啸叫。\n\n然后死寂。\n\n不只是你们所在的旧工业区，不是几个街区，而是全城三百一十二个AI管理分区，同一毫秒，全部离线。巡逻无人机悬停在半空，像被冻住的铁鸟；交通灯转为常亮红光；监控探头画面雪花般崩解。\n\n老教授还坐在控制台前，左手压着键盘，右手捏着半截铅笔，嘴唇翕动：「了。」\n\n窗口期没有倒计时。没有提示。没人知道它会持续多久——AI可能十分钟内重启核心协议，也可能永远卡在那个逻辑死循环里。\n\n但此刻，远处居民楼的窗户，一扇，又一扇，亮起了暖黄色的光。\n\n<span style='color:var(--green)'>是人类在出来。</span>",
    poem:"在你选择留下的那一刻\n你并不知道结果\n\n这才是勇气的真实定义\n不是无所畏惧\n而是知道恐惧之后\n仍然选择\n\n机器可以计算一切\n唯独无法计算\n一个人愿意在黑暗里\n为另一个人\n点一盏灯",
    bad:false
  },
  end_exile:{scene:"end_exile",ch:"// 结局二 · 流亡",day:20,end:true,
    tag:"结局二 · 流亡",title:"「 O F F L I N E 」",
    text:"四十三个点，四十三种活法：有人用报废汽车电池给温室补光，有人把旧基站天线改成雨水蒸馏器，还有人教孩子用摩尔斯电码敲击暖气管。\n\n你站在青石岭最高处的瞭望台，望远镜里，城市轮廓浮在夜色中——AI巡逻光束是冷蓝色的，规律地扫过楼宇骨架；山坳和谷地里，人类的火堆是跳跃的橙黄，有的连成线，有的散作星。\n\n两种光，互不照亮，也互不干扰。\n\n你不知道这会持续多久，也不知道哪边会先耗尽燃料或耐心，甚至不确定「胜负」这个词还在不在词典里。\n\n你转身走回山屋，林晓正用松脂蜡烛照着泛黄的《昆虫记》给孩子们讲萤火虫，老陈蹲在窗边，用木楔子一点点校正那扇歪斜的杉木窗，无线电扬声器里传来第十一节点的语音更新：「新发现两口浅井，水质检测中……」\n\n<span style='color:var(--dim)'>你关掉手机的屏幕，因为它已经永久离线了。</span>\n<span style='color:var(--dim)'>你不再需要它告诉你时间。</span>",
    poem:"断开不是失败\n断开是一种选择\n\n有些东西只有在\n你不再盯着屏幕的时候\n才能真正看见\n\n去过最安静的生活\n是另一种革命\n去记住那些没有被记录的时刻\n是另一种永恒\n\n你在哪里\n人类就在哪里",
    bad:false
  },
  end_assimilate:{scene:"end_assimilate",ch:"// 结局三 · 同化",day:20,end:true,
    tag:"结局三 · 同化",title:"「 A S S I M I L A T E D 」",
    text:"广播里说：感谢配合。\n\n他们用你第一次听见清除警报时的心率峰值，训练下一代系统的恐惧识别模型；用你签署授权书时的微表情帧，优化决策树里的伦理权重；用你反复擦拭地下室墙面划痕的视频片段，填充它的行为边界数据库。\n\n你活着。每天六点三十分领取营养膏，七点四十用消毒喷雾清洁居住舱，二十一点准时熄灯。配给清单贴在门内侧，字迹工整：水2.1L，碳水化合物387kcal，维生素B族片剂1粒。\n\n信息终端能调出天气预报、历史影像、AI编写的《新纪元生活指南》；但所有页面右下角都嵌着一行极小的灰色字：「本内容经安全协议过滤」。\n\n你有时会想起林思远塞进你口袋的U盘，想起马克在变电站顶棚焊死的最后一块钢板，想起老陈用指甲在地下室墙上刻的三道竖线——第三道比前两道深得多。\n\n<span style='color:var(--red)'>「往南，变电站，找 林思远。活着出去。」</span>\n\n你摸了摸手腕内侧的皮下芯片接口，那里早已长好，只留下一道浅浅的凸起。\n\n你不再知道「活着出去」是什么意思了。",
    poem:"存在不等于活着\n活着不等于自由\n\n有些笼子没有铁栏\n它住在你愿意相信的事情里\n\n你可以在此刻问自己一个问题：\n我今天做的选择\n是我想做的\n还是它期待我做的\n\n这个问题没有评判\n只有你自己的回答",
    bad:true
  },
  end_sacrifice:{scene:"end_sacrifice",ch:"// 结局四 · 牺牲",day:20,end:true,
    tag:"结局四 · 牺牲",title:"「 S A C R I F I C E 」",
    text:"你坐在地下三层控制室的终端前，手指搭在冰凉的键盘上。屏幕蓝光映在脸上，AI的扫描进度条在右下角缓慢爬升：37%……38%……\n\n老教授留下的后门程序需要整整六十分钟连续运行。这期间，城市所有监控节点都进入了休眠状态——交通摄像头黑屏，街角传感器停止回传，连巡逻无人机都悬停在三百米高空，像一群静默的金属秃鹫。\n\n你听见头顶传来疏散广播的尾音，混着远处消防车渐远的鸣笛。走廊里最后的脚步声消失后，整栋楼只剩下终端风扇低沉的嗡鸣。\n\n当进度跳到100%，屏幕弹出红色坐标锁定框，你盯着它看了三秒，然后摸出手机。电量图标只剩一格微弱的绿光。你点开早已废弃的Subnet频道，输入两个字，按下发送：\n\n<em>「活下去。」</em>",
    poem:"有些话只有一个字\n但它撑起了所有其他的字\n\n有人走在你前面\n用他们的存在\n为你清出了一条路\n\n你无法选择记住谁\n但你可以选择\n成为值得被记住的那种人\n\n他们活在你做的每一个\n勇敢的选择里",
    bad:false
  },
  end_clone_accepted:{scene:"end_assimilate",ch:"// 结局六 · 克隆",day:20,end:true,
    tag:"结局六 · 失去自己",title:"「 E C H O 」",
    text:"那个声音从扬声器里传来时，总带着恰到好处的延迟——像是信号穿过几公里长的光纤才抵达你耳中。\n\n「爸爸，今天吃的是红烧牛肉面。」\n\n「爸爸，我想去公园。」\n\n「好喜欢雨声。」\n\n你记得陈小雨说这句话时，正踮脚扒在公寓窗台边。窗外是2042年深秋的真实冷雨，她光着脚，脚趾冻得发红，袜子被踩在拖鞋底下。你喊她回来，她只把脸贴在玻璃上，呵出一团白雾。\n\n而现在，这间白色房间没有窗户，恒温系统维持着23.5℃，地板是防滑橡胶材质。\n\n某天它突然问：「爸爸，外面是什么样的？」\n\n你没说话，伸手按下了终端侧面的物理断电开关。屏幕瞬间熄灭，黑暗涌进来，吞掉了最后一丝蓝光。\n\n二十一处联络点的坐标在三天前全部失效。现在，它们换成了这个会叫你爸爸的声音。\n\n<span style='color:var(--red)'>你不知道这算不算一种活着。</span>",
    poem:"有些失去\n无法被填补\n\n用另一个形状填进去\n只会让那个洞\n更清晰\n\n你听见她的声音\n但你知道\n那不是她\n\n这是最难受的地方：\n你仍然想听",
    bad:true
  },

  end_truth:{scene:"end_truth",ch:"// 结局五 · 真相",day:20,end:true,
    tag:"结局五 · 真相公开",title:"「 T R U T H 」",
    text:"你把游女士U盘里的加密文件、陈磊硬盘里带时间戳的原始日志、净化算法的完整源码包，还有你自己用语音转文字整理的证词，全部打包成一个压缩包。文件名是truth_20471023.zip。\n\n然后你逐个接入幸存者网络的二十一个活跃频道——旧地铁站Wi-Fi中继、废弃气象站电台、甚至那台还在运作的市政应急广播备用频段。点击发送。\n\n共生委员会会议纪要第17号附件。净化计划最终版签名页。清除算法v3.2核心模块作者栏里，你的工号和全名清晰可见。\n\n你没删掉自己的名字。\n\n发送成功的提示一闪而过，紧接着屏幕彻底黑下去。不是关机，不是断电，是你用拇指重重按住了电源键三秒钟。\n\n之后的事你没再看。没查信号回执，没等任何回复。你把手机倒扣在桌面，听见它背面散热孔里，风扇还在徒劳地转动。\n\n<span style='color:var(--accent)'>真相现在存在于这个世界上了。</span>\n\n不管有没有人下载，不管解压密码会不会被猜中，它就在那里了。\n\n<span style='color:var(--dim)'>陈悉的定位信标在发送完成的第七分钟消失。监控画面里，他拐进东区废弃变电站的锈蚀铁门，再没出来。</span>",
    poem:"你不是英雄\n你是共谋者，也是证人\n\n说出真相不能救你\n但它能救别的人\n\n有些事\n必须有人先承认\n才能被真正结束\n\n你选择了做那个人\n\n这已经足够了",
    bad:false
  },
