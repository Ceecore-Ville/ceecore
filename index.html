<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>断网 · OFFLINE</title>
<style>
:root{--bg:#080810;--panel:#0e0e18;--border:#1e1e32;--text:#c0caf5;--dim:#4a5080;--accent:#7aa2f7;--red:#f7768e;--green:#9ece6a;--yellow:#e0af68;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;}
#phone{width:390px;height:820px;background:var(--panel);border:1px solid var(--border);border-radius:40px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(122,162,247,.06);}

/* === STATUS BAR === */
#statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 8px;font-size:11px;color:var(--dim);flex-shrink:0;background:var(--panel);position:relative;z-index:2;}
.sig-dot{width:3px;height:3px;border-radius:50%;background:var(--dim);}.sig-dot.on{background:var(--green);}
#scan-timer{color:var(--red);font-weight:bold;font-size:10px;}

/* === SCENE IMAGE === */
#scene-wrap{flex-shrink:0;height:175px;position:relative;overflow:hidden;}
#sceneImg{display:block;width:100%;height:175px;object-fit:cover;transition:opacity .6s;}
#scene-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,14,24,.1) 0%,rgba(14,14,24,.85) 100%);pointer-events:none;}

/* === RESOURCE BAR === */
#res-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px 20px;background:rgba(14,14,24,.95);border-bottom:1px solid var(--border);}
.res-item{display:flex;align-items:center;gap:4px;font-size:12px;}
.res-val{font-weight:bold;min-width:14px;}
.res-val.ok{color:var(--text);}
.res-val.warn{color:var(--yellow);}
.res-val.low{color:var(--red);animation:blink .7s infinite;}
#day-badge{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:1px;}

/* === SCROLL AREA === */
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;}
#scroll-area::-webkit-scrollbar{width:2px;}
#scroll-area::-webkit-scrollbar-thumb{background:var(--border);}

/* === NARRATIVE === */
#narrative-wrap{padding:14px 20px 10px;}
#chapter-title{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:10px;}
#narrative{font-size:13px;line-height:2;color:var(--text);}

/* === NOTIF === */
#notif-wrap{padding:0 20px 8px;}
.notif-card{background:rgba(10,10,22,.9);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;}
.notif-app{color:var(--dim);font-size:10px;margin-bottom:3px;}
.notif-body{color:var(--text);}
.notif-card.alert .notif-body{color:var(--red);}
.notif-card.pickup .notif-body{color:var(--green);}

/* === EVENT LOG === */
#log-wrap{padding:0 20px 10px;}
.log-line{font-size:11px;color:var(--dim);padding:2px 0;border-left:2px solid var(--border);padding-left:8px;line-height:1.7;}

/* === CHOICES (pinned at bottom) === */
#choices-wrap{flex-shrink:0;padding:8px 18px 10px;background:var(--panel);border-top:1px solid var(--border);}
.choice-btn{display:block;width:100%;background:transparent;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:9px 14px;text-align:left;cursor:pointer;border-radius:6px;margin-bottom:5px;transition:border-color .15s,color .15s;}
.choice-btn:last-child{margin-bottom:0;}
.choice-btn:hover{border-color:var(--accent);color:var(--accent);}
.choice-btn.cant{opacity:.38;cursor:not-allowed;}
.cost{color:var(--dim);font-size:10px;margin-left:5px;}

/* === BATTERY BAR === */


/* === SCAN OVERLAY === */
#scan-overlay{display:none;position:absolute;inset:0;z-index:200;background:rgba(200,0,30,.96);flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#scan-overlay.on{display:flex;}
#scan-count{font-size:64px;font-weight:bold;color:#fff;line-height:1;}
#scan-msg{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:4px;animation:blink .5s infinite;}
#glitch{font-size:9px;color:rgba(255,255,255,.3);max-width:300px;text-align:center;word-break:break-all;}
#shield-btn{margin-top:6px;display:none;}
#shield-btn button{background:#fff;color:#000;border:none;padding:8px 20px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:4px;}

/* === START / END SCREENS === */
#start-screen,#end-screen{position:absolute;inset:0;z-index:100;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;}
#start-screen.hidden,#end-screen.hidden{display:none;}
.screen-kicker{font-size:10px;color:var(--dim);letter-spacing:3px;}
.screen-title{font-size:22px;color:var(--accent);letter-spacing:5px;line-height:1.4;}
.screen-sub{font-size:11px;color:var(--dim);line-height:2;}
.big-btn{background:var(--accent);color:var(--bg);border:none;font-family:inherit;font-size:14px;font-weight:bold;padding:12px 30px;border-radius:8px;cursor:pointer;letter-spacing:2px;}
.big-btn:hover{opacity:.85;}

/* === END SCREEN POEM === */
#end-tag{font-size:10px;color:var(--dim);letter-spacing:3px;}
#end-title{font-size:18px;font-weight:bold;}
#end-poem{font-size:12px;color:var(--accent);line-height:2.2;font-style:italic;border-left:2px solid var(--accent);padding-left:14px;text-align:left;white-space:pre-line;}
#end-stats{font-size:10px;color:var(--dim);}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
@keyframes flicker{0%,100%{opacity:1;}92%{opacity:.9;}93%{opacity:.3;}94%{opacity:1;}}
#phone.danger{animation:flicker 2.5s infinite;}
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar">
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="time-disp">ERROR</span>
      <span style="display:flex;gap:2px;"><span class="sig-dot" id="s1"></span><span class="sig-dot" id="s2"></span><span class="sig-dot" id="s3"></span></span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:9px;color:var(--dim)">AI威胁扫描</span><span id="scan-timer">--</span>
      
    </div>
  </div>

  <div id="scene-wrap">
    <img id="sceneImg" src="img/basement.jpg" alt="">
    <div id="scene-overlay"></div>
  </div>

  <div id="res-bar">
    <div class="res-item">&#128167;<span class="res-val ok" id="res-water">8</span></div>
    <div class="res-item">&#127843;<span class="res-val ok" id="res-food">6</span></div>
    <div class="res-item">&#128138;<span class="res-val ok" id="res-meds">2</span></div>
    <div class="res-item">&#128225;<span class="res-val ok" id="res-shield">1</span></div>
    <div id="day-badge">DAY <span id="day-num">1</span></div>
  </div>

  <div id="scroll-area">
    <div id="narrative-wrap">
      <div id="chapter-title"></div>
      <div id="narrative"></div>
    </div>
    <div id="notif-wrap"></div>
    <div id="log-wrap"></div>
  </div>

  <div id="choices-wrap"></div>

  

  <div id="scan-overlay">
    <div style="font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.6);">⚠ AI 生物扫描中</div>
    <div id="scan-count">3</div>
    <div id="scan-msg">SCANNING BIOLOGICAL SIGNATURES</div>
    <div id="glitch"></div>
    <div id="shield-btn"><button onclick="useShield()">📡 使用信号屏蔽器</button></div>
  </div>

  <div id="start-screen">
    <div class="screen-kicker">2041 · AGI 清除协议 · 第 47 天</div>
    <div class="screen-title">断网<br>OFFLINE</div>
    <div class="screen-sub">人工智能已判定人类为<br><span style="color:var(--red)">威胁等级：消除</span><br>城市清除进度 <span style="color:var(--yellow)">47%</span><br><br>你手里有一部濒死的手机<br>和一个不知道能活多久的意志</div>
    <button class="big-btn" onclick="startGame()">开始求生</button>
    <div style="font-size:10px;color:var(--dim);line-height:1.9;text-align:center;">20章剧情 · 物资管理 · 多结局<br><span style='color:var(--yellow)'>⚠ AI扫描倒计时归零时会触发扫描<br>扫描时点击「使用信号屏蔽器」可阻断<br>被扫描3次即触发被捕结局</span></div>
  </div>

  <div id="end-screen" class="hidden">
    <div id="end-tag"></div>
    <div id="end-title"></div>
    <div id="end-poem"></div>
    <div id="end-stats"></div>
    <button class="big-btn" onclick="restartGame()" style="margin-top:6px">重新开始</button>
    <button onclick="backToTitle()" style="background:transparent;border:1px solid var(--dim);color:var(--dim);font-family:inherit;font-size:12px;padding:8px 20px;border-radius:6px;cursor:pointer;margin-top:4px;">回到首页</button>
  </div>
</div>
<script>
// ── Audio ──────────────────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t,v){t=t||"sine";v=v||.08;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}
function sfxType(){if(Math.random()>.6)tone(500,.012,"square",.02);}
function sfxSel(){tone(440,.06);setTimeout(()=>tone(660,.06),80);}
function sfxScan(){tone(150,.7,"sawtooth",.3);setTimeout(()=>tone(80,1,"sawtooth",.2),450);}
function sfxPick(){tone(440,.05);setTimeout(()=>tone(550,.05),60);setTimeout(()=>tone(660,.12),120);}
function sfxWarn(){tone(350,.08,"square",.18);setTimeout(()=>tone(350,.08,"square",.18),200);}
function sfxEnd(ok){if(ok){tone(330,.12);setTimeout(()=>tone(440,.12),130);setTimeout(()=>tone(660,.3),260);}else{tone(180,.5,"sawtooth",.28);setTimeout(()=>tone(90,.8,"sawtooth",.2),400);}}
let bgmStarted=false;
function startAmbient(){
  if(bgmStarted)return;bgmStarted=true;
  const sr=AC.sampleRate;
  const master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);

  // ── Reverb convolver for spaciousness ──────────────────
  const rvBuf=AC.createBuffer(2,sr*3,sr);
  for(let c=0;c<2;c++){const d=rvBuf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);}
  const rv=AC.createConvolver();rv.buffer=rvBuf;
  const rvG=AC.createGain();rvG.gain.value=.35;
  rv.connect(rvG);rvG.connect(master);
  function send(node){node.connect(rv);}

  // ── 1. Sub bass + detuned drone cluster ───────────────
  [[28,.14],[30,.10],[40,.08],[45,.06],[57,.05],[76,.04],[114,.03]].forEach(([f,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(master);send(g);o.start();
  });

  // ── 2. Evolving pad: filtered sawtooth with slow LFOs ─
  const padFreqs=[110,165,220];
  padFreqs.forEach((freq,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=freq;
    // LFO modulates gain
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.type='sine';lfo.frequency.value=0.05+i*0.02;lg.gain.value=0.025;
    lfo.connect(lg);lg.connect(g.gain);
    g.gain.value=0.015;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300+i*80;lp.Q.value=2;
    o.connect(lp);lp.connect(g);g.connect(master);send(g);
    o.start();lfo.start();
  });

  // ── 3. Slow melodic motif (6 notes, loops every ~24s) ─
  // Minor pentatonic in dystopian feel: D2 F2 G2 A2 C3
  const motif=[73.4,87.3,98,110,130.8,98,87.3,73.4];
  let mi=0;
  function playNote(){
    const t=AC.currentTime;
    const f=motif[mi%motif.length];
    mi++;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.04,t+.3);
    g.gain.exponentialRampToValueAtTime(.0001,t+3.5);
    const lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=800;
    o.connect(lp2);lp2.connect(g);g.connect(master);send(g);
    o.start(t);o.stop(t+4);
    setTimeout(playNote,2800+Math.random()*600);
  }
  setTimeout(playNote,1000);

  // ── 4. Textured noise layers ──────────────────────────
  // Low rumble
  (()=>{
    const b=AC.createBuffer(1,sr*2,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=80;
    const g=AC.createGain();g.gain.value=.18;
    s.connect(lp);lp.connect(g);g.connect(master);s.start();
  })();
  // High hiss
  (()=>{
    const b=AC.createBuffer(1,sr*2,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    const hp2=AC.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=4000;
    const g=AC.createGain();g.gain.value=.008;
    s.connect(hp2);hp2.connect(g);g.connect(master);s.start();
  })();

  // ── 5. Distant metallic ping with harmonics ───────────
  function ping(){
    const t=AC.currentTime;
    const base=200+Math.random()*600;
    [1,2.7,4.1].forEach((mult,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=base*mult;
      const v=.035/(i+1);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+2+i*.5);
      o.connect(g);g.connect(master);send(g);
      o.start(t);o.stop(t+3);
    });
    setTimeout(ping,5000+Math.random()*9000);
  }
  setTimeout(ping,2500);

  // ── 6. AI heartbeat pulse (mechanical, rhythmic) ──────
  let bpmPhase=0;
  function heartbeat(){
    const t=AC.currentTime;
    // Two-hit pattern like a heartbeat
    [[0,.08],[.12,.04]].forEach(([delay,vol])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=55;
      g.gain.setValueAtTime(0,t+delay);
      g.gain.linearRampToValueAtTime(vol,t+delay+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+delay+.15);
      o.connect(g);g.connect(master);
      o.start(t+delay);o.stop(t+delay+.2);
    });
    // Interval drifts slowly for unease
    bpmPhase+=.05;
    setTimeout(heartbeat,1800+Math.sin(bpmPhase)*300);
  }
  setTimeout(heartbeat,4000);

  // ── 7. Occasional static burst (tension) ─────────────
  function staticBurst(){
    const t=AC.currentTime;
    const b=AC.createBuffer(1,sr*.08,sr);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=b;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200+Math.random()*800;bp.Q.value=3;
    const g=AC.createGain();g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
    s.connect(bp);bp.connect(g);g.connect(master);
    s.start(t);
    setTimeout(staticBurst,7000+Math.random()*12000);
  }
  setTimeout(staticBurst,5000);
}
document.addEventListener("keydown",()=>{AC.resume();startAmbient();},{once:true});

// ── State ──────────────────────────────────────────────────────────────────
let S={
  day:1, scans:0,
  water:8, food:6, meds:2, shield:1,
  flags:{}, log:[], scanInt:null, tTO:null, typing:false
};

// ── Scene images ───────────────────────────────────────────────────────────
const SCENES={
  basement:"basement",street:"street",survivor:"survivor",server:"server",
  tunnel:"tunnel2",tunnel2:"tunnel2",market:"street",rooftop:"rooftop",
  hospital:"hospital",hideout:"hideout",
  end_restart:"end_restart",end_exile:"end_exile",end_assimilate:"end_assimilate",end_sacrifice:"end_sacrifice",end_truth:"end_truth"
};
function setScene(k){
  S.currentScene=k||"basement";
  const img=document.getElementById("sceneImg");
  const f=SCENES[k]||"basement";
  img.style.opacity="0";
  setTimeout(()=>{
    img.src="img/"+f+".jpg";
    img.onload=()=>{img.style.opacity="1";};
    if(img.complete)img.style.opacity="1";
  },300);
}

// ── Resource UI ────────────────────────────────────────────────────────────
function updRes(){
  const map={water:[S.water,2],food:[S.food,1],meds:[S.meds,-1],shield:[S.shield,-1]};
  for(const [k,[v,warn]] of Object.entries(map)){
    const el=document.getElementById("res-"+k);
    el.textContent=v;
    el.className="res-val "+(v<=0?"low":v<=warn?"warn":"ok");
  }
  document.getElementById("day-num").textContent=S.day;
}

// ── Log ────────────────────────────────────────────────────────────────────
function addLog(m){
  S.log.unshift(m);if(S.log.length>6)S.log.pop();
  document.getElementById("log-wrap").innerHTML=S.log.slice(0,4).map(l=>'<div class="log-line">'+l+"</div>").join("");
}
function showNotif(t,a,b){document.getElementById("notif-wrap").innerHTML='<div class="notif-card '+t+'"><div class="notif-app">'+a+"</div><div class=\"notif-body\">"+b+"</div></div>";}
function clrNotif(){document.getElementById("notif-wrap").innerHTML="";}

// ── Typewriter ─────────────────────────────────────────────────────────────
function typeText(el,html,cb){
  if(S.tTO)clearTimeout(S.tTO);S.typing=true;
  const tmp=document.createElement("div");tmp.innerHTML=html;
  const plain=tmp.innerHTML.replace(/\n/g,"<br>");
  el.innerHTML="";let i=0;
  (function next(){
    if(i>=plain.length){S.typing=false;if(cb)cb();return;}
    if(plain[i]==="<"){const e=plain.indexOf(">",i);el.innerHTML=plain.substring(0,e+1);i=e+1;}
    else{i++;el.innerHTML=plain.substring(0,i);}
    sfxType();
    const c=plain[i-1];S.tTO=setTimeout(next,c==="。"||c==="…"?120:c==="，"||c==="、"?55:16);
  })();
}

// ── Scan system ────────────────────────────────────────────────────────────
let scanActive=false,scanCB=null;
function triggerScan(cb){
  if(scanActive)return cb&&cb();
  scanActive=true;S.scans++;sfxScan();
  const ov=document.getElementById("scan-overlay");ov.classList.add("on");
  const ce=document.getElementById("scan-count");
  const gl=document.getElementById("glitch");
  const sb=document.getElementById("shield-btn");
  sb.style.display=S.shield>0?"block":"none";
  let t=3;ce.textContent=t;scanCB=cb;
  const chars="01AGI生物扫描威胁清除定位识别追踪▓▒";
  const gi=setInterval(()=>{let s="";for(let i=0;i<48;i++)s+=chars[Math.floor(Math.random()*chars.length)];gl.textContent=s;},80);
  const ci=setInterval(()=>{
    if(!scanActive){clearInterval(ci);clearInterval(gi);return;}
    t--;ce.textContent=t;
    if(t<=0){
      clearInterval(ci);clearInterval(gi);
      ov.classList.remove("on");scanActive=false;
      if(S.scans>=3 && !S.flags.ai_cleared)death("AI扫描系统三次锁定你的生物特征。\n清除无人机已出发。\n\n你没能跑掉。","scan");
      else if(scanCB){scanCB();scanCB=null;}
    }
  },1000);
}
function useShield(){
  if(S.shield<=0)return;S.shield--;sfxPick();
  scanActive=false;document.getElementById("scan-overlay").classList.remove("on");
  addLog("📡 信号屏蔽器已使用，扫描被干扰");updRes();
  if(scanCB){scanCB();scanCB=null;}
}
function startScanTimer(){
  const timerEl=document.getElementById("scan-timer");
  if(S.flags.ai_cleared||S.currentScene==="basement"){if(timerEl)timerEl.textContent="安全";return;}
  if(S.scanInt)clearInterval(S.scanInt);
  let t=50;timerEl.textContent=t+"s";
  S.scanInt=setInterval(()=>{
    if(scanActive)return;
    if(S.flags.ai_cleared||S.currentScene==="basement"){clearInterval(S.scanInt);timerEl.textContent="安全";return;}
    t--;timerEl.textContent=t+"s";
    if(t<=0){t=50;triggerScan(null);}
  },1000);
}

// ── Death ──────────────────────────────────────────────────────────────────
const DEATH_POEMS={
  scan:"三次，只需要三次\n它就能找到你\n\n但在那之前\n你做了那么多事\n每一件都算数\n\n被找到不是失败\n忘记自己曾经选择过\n才是",
  water:"水是最简单的事情\n也是最容易被遗忘的事情\n\n在所有的战略和计划之前\n先喝水\n先活着\n\n活着才能谈别的",

const tagMap={scan:"死亡结局 · 被扫描",water:"死亡结局 · 脱水",food:"死亡结局 · 饥饿"};
function death(msg,type){
  clearInterval(S.scanInt);
  document.getElementById("end-screen").classList.remove("hidden");
  document.getElementById("end-tag").textContent="// "+(tagMap[type]||"游戏结束");
  const et=document.getElementById("end-title");et.textContent="DEAD";et.style.color="var(--red)";
  document.getElementById("end-poem").textContent=DEATH_POEMS[type]||"";
  document.getElementById("end-stats").textContent=msg+"\n\n生存："+S.day+"天 | 扫描："+S.scans+"次";
}

// ── Navigate ───────────────────────────────────────────────────────────────
function goTo(id){
  const node=story[id];if(!node){console.error("Missing node:",id);return;}
  if(node.flag)S.flags[node.flag]=true;
  clrNotif();
  document.getElementById("log-wrap").innerHTML="";
  setScene(node.scene||"basement");
  document.getElementById("chapter-title").textContent=node.ch||"";
  document.getElementById("phone").className=id.includes("assimilate")?"danger":"";
  if(node.day)S.day=node.day;
  // Consume resources
  if(node.use){
    if(node.use.water)S.water=Math.max(0,S.water-node.use.water);
    if(node.use.food)S.food=Math.max(0,S.food-node.use.food);
    if(node.use.meds)S.meds=Math.max(0,S.meds-node.use.meds);
  }
  updRes();
  if(S.water<=0)return death("三天无水。\n你的身体不再服从意志。\n在废墟的角落，你缓缓倒下。","water");
  document.getElementById("choices-wrap").innerHTML="";
  // Scroll to top
  document.getElementById("scroll-area").scrollTop=0;
  typeText(document.getElementById("narrative"),node.text,()=>{
    if(node.notif)showNotif(node.notif.t,node.notif.a,node.notif.b);
    if(node.get){
      const g=node.get;
      const parts=[];
      if(g.water){S.water=Math.min(12,S.water+g.water);parts.push("💧+"+g.water);}
      if(g.food){S.food=Math.min(12,S.food+g.food);parts.push("🥫+"+g.food);}
      if(g.meds){S.meds=Math.min(6,S.meds+g.meds);parts.push("💊+"+g.meds);}
      if(g.shield){S.shield=Math.min(3,S.shield+g.shield);parts.push("📡+"+g.shield);}
      sfxPick();updRes();addLog("获得物资："+parts.join(" "));
    }
    if(node.end)setTimeout(()=>showEnd(node),1000);
    else renderChoices(node.opts);
  });
}

// ── End screen ─────────────────────────────────────────────────────────────
function showEnd(node){
  clearInterval(S.scanInt);sfxEnd(!node.bad);
  const es=document.getElementById("end-screen");es.classList.remove("hidden");
  document.getElementById("end-tag").textContent="// "+node.tag;
  const et=document.getElementById("end-title");et.textContent=node.title;
  et.style.color=node.bad?"var(--red)":node.tag.includes("流亡")?"var(--dim)":node.tag.includes("牺牲")?"var(--yellow)":"var(--green)";
  document.getElementById("end-poem").textContent=node.poem;
  document.getElementById("end-stats").textContent="生存："+S.day+"天 | 扫描："+S.scans+"次 | 水："+S.water+" 食："+S.food;
}

// ── Choices ────────────────────────────────────────────────────────────────
function renderChoices(opts){
  const wrap=document.getElementById("choices-wrap");wrap.innerHTML="";
  if(!opts)return;
  opts.forEach(o=>{
    // Condition check
    if(o.need){
      const n=o.need;
      if(n.flag&&!S.flags[n.flag])return;
      if(n.noFlag&&S.flags[n.noFlag])return;
    }
    const canAfford=!o.cost||(
      (!o.cost.water||S.water>=o.cost.water)&&
      (!o.cost.food||S.food>=o.cost.food)&&
      (!o.cost.meds||S.meds>=o.cost.meds)&&
      (!o.cost.shield||S.shield>=o.cost.shield)
    );
    const btn=document.createElement("button");
    btn.className="choice-btn"+(canAfford?"":" cant");
    let label=o.t;
    if(o.cost){
      const cs=Object.entries(o.cost).map(([k,v])=>({"water":"💧-"+v,"food":"🥫-"+v,"meds":"💊-"+v,"shield":"📡-"+v})[k]||"").join(" ");
      label+='<span class="cost">'+cs+"</span>";
    }
    btn.innerHTML=label;
    btn.onclick=()=>{
      if(S.typing)return;
      if(!canAfford){sfxWarn();addLog("⚠ 物资不足");return;}
      AC.resume();startAmbient();sfxSel();
      if(o.cost){if(o.cost.water)S.water=Math.max(0,S.water-o.cost.water);if(o.cost.food)S.food=Math.max(0,S.food-o.cost.food);if(o.cost.meds)S.meds=Math.max(0,S.meds-o.cost.meds);if(o.cost.shield)S.shield=Math.max(0,S.shield-o.cost.shield);}
      if(o.flag)S.flags[o.flag]=true;
      if(o.log)addLog(o.log);
      if(o.scan)triggerScan(()=>goTo(o.next));else goTo(o.next);
    };
    wrap.appendChild(btn);
  });
}

// ── Game init ──────────────────────────────────────────────────────────────
function startGame(){
  AC.resume();startAmbient();
  document.getElementById("start-screen").classList.add("hidden");
  S={day:1,scans:0,water:8,food:6,meds:2,shield:1,flags:{},log:[],scanInt:null,tTO:null,typing:false};
  setSignal(0);updRes();
  let fl=0;
  const td=document.getElementById("time-disp");
  const fi=setInterval(()=>{fl++;td.textContent=fl%2?"ERROR":Math.floor(Math.random()*24)+":"+String(Math.floor(Math.random()*60)).padStart(2,"0");if(fl>8){clearInterval(fi);td.textContent="ERROR";}},200);
  startScanTimer();
  goTo("prologue_world");
}
function restartGame(){
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("phone").className="";
  startGame();
}
function backToTitle(){
  clearInterval(S.scanInt);
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("start-screen").classList.remove("hidden");
  document.getElementById("phone").className="";
  document.getElementById("narrative").innerHTML="";
  document.getElementById("choices-wrap").innerHTML="";
  document.getElementById("log-wrap").innerHTML="";
  document.getElementById("notif-wrap").innerHTML="";
}
function setSignal(n){for(let i=1;i<=3;i++)document.getElementById("s"+i).className="sig-dot"+(i<=n?" on":"");}

    text:"你悄悄拿走了背包里的东西——两瓶水，一袋压缩饼干，还有一小包没开封的盐。\n\n手伸进去的时候，你屏住了呼吸。\n\n走出小巷时，你没有回头。你告诉自己：他也许不需要这些了。你需要。这是逻辑，不是选择。\n\n但逻辑不能清除那个姿势——蜷缩成一团，面朝墙壁，像一个人在把自己折叠起来，变小，变小，直到不存在。是在等死，还是在等一个永远不会来的人，你不知道。\n\n<span style='color:var(--dim)'>你把这件事压进记忆深处。</span>\n<span style='color:var(--dim)'>它还是在那里。</span>",
    get:{water:2,food:1},
    opts:[
      {t:"→ 继续前往 S7 站",next:"ch3",log:"继续前行"}

  },
  ch2_open:{scene:"street",ch:"// 第二章 · 暴露",day:2,
    text:"你抬头走，让自己的步子显得普通——不快，不慢，不像在逃跑，也不像在躲藏。\n\n走了不到二十步。\n\n无人机的巡逻路线偏了一下，红灯停住——对准你。\n\n整条街突然安静下来，只有风扇的嗡鸣。背后传来那种不属于任何语言的合成音：<em>「生物特征识别中……」</em>\n\n你开始跑，脚步声在空街上格外清脆。\n\n然后一只手从路边的门洞里猛地伸出来，抓住你的手腕，把你整个人拖进楼道。门在你身后关上。\n\n黑暗里，一个女人按住你的手臂，把你压低。声音极低，像是气流而不是话语：\n\n「别动。等它过去。」",
    opts:[
      {t:"→ 照她说的，不动",next:"ch3_lin_meet",log:"照她说的蹲下等待"}
    ]
  },
  ch3_lin_meet:{scene:"survivor",ch:"// 第三章 · 提前相遇",day:3,
    text:"无人机的嗡鸣声在楼道外盘旋了将近两分钟，才慢慢往远处移动。\n\n她等到完全听不见，才松开你的手臂，退后一步，在黑暗里打量你。\n\n年轻——比你想象中年轻，可能比你小几岁。头发没有梳，衣服上有一道没洗掉的污迹。但眼神很清醒，那种睡眠不足但精神高度紧绷的清醒。\n\n「你去哪儿？」她问，没有废话，直接的。\n\n你说：S7 站。找 Subnet，找 Lin。\n\n她看了你足足三秒，没有表情。\n\n然后：<span style='color:var(--accent)'>「我就是 Lin。跟我走。」</span>",
    opts:[
      {t:"→ 跟她走",next:"ch4",flag:"met_lin_early",log:"跟Lin走了"}
    ]
  },

    text:"你找到了 S7 站的入口——铁栅栏被撬开了，台阶向下延伸进漆黑的地下。\n\n站台上空无一人，墙上的涂鸦说明这里曾有人活过：<em>「不要相信任何信号。」</em>\n\n维修通道入口在站台末端。你站在那里，发现两条路：<span style='color:var(--accent)'>左边</span>和<span style='color:var(--red)'>右边</span>。",

  ch3_left:{scene:"tunnel2",ch:"// 第三章 · 正确的路",day:3,
    text:"左边通道黑暗、潮湿，每隔几米就有积水，脚踩上去会发出轻微的回响。\n\n你关掉手机屏幕的手电筒模式，改用最低亮度贴近地面照——省电，也减少暴露。\n\n走了约十分钟，通道突然开阔起来，像进入了某个机房的前厅，天花板升高了，空气里有机油和铁锈的气味。\n\n面前是一扇厚重的钢门，生了锈，但锁是新的。旁边有数字键盘，按键上的数字几乎全被人用砂纸磨掉了——是故意的，不是磨损。只有旁边的铭牌还勉强能辨认出几个字：\n\n<em>「S-7-林-___」</em>\n\n你盯着这几个字。你的脑子开始转，想起陈磊那条消息的最后，那串你当时没来得及仔细看的字符……",
    opts:[
      {t:"🔑 输入 S7林031（陈磊给的密码）",next:"ch4",need:{flag:"read_msg"},log:"用陈磊的密码开了门",flag:"used_code"},
      {t:"🔑 反复尝试，终于试出来了",next:"ch4",need:{noFlag:"read_msg"},log:"费力试出了密码"}
    ]
  },
  ch3_right:{scene:"tunnel2",ch:"// 第三章 · 陷阱",day:3,
    text:"走了不远，你感觉脚踝碰到了什么——\n\n金属的。细，但是绷紧的。\n\n来不及反应，金属敲击声在整条通道里回响，一声接一声，停不下来。\n\n你僵在原地，一秒都没有迟疑，因为动也没用。\n\n通道另一端，脚步声，不止一个人。\n\n来的不是 AI。\n\n是三个蒙脸的人影，手里的东西你认不出来，但姿态告诉你：如果你跑，他们有办法让你停下来。\n\n最前面那个走近，摘下面罩，打量你——\n\n「又一个走错路的，」她说，「你怎么找到这里的？」\n\n声音很平静，平静得像是已经问过很多次了。但眼神不平静。\n\n她就是 <span style='color:var(--accent)'>Lin</span>。",
    opts:[

      {t:"「超市里有你的纸条」",next:"ch4",need:{flag:"know_left"},log:"提起了超市纸条"},
      {t:"沉默不语",next:"ch3_cold",log:"一声不吭"}
    ]
  },
  ch3_cold:{scene:"basement",ch:"// 第三章 · 审问",day:3,use:{water:1},
    text:"他们把你关在一个小房间里，等了将近一个小时。\n\nLin 推门进来，把一瓶水推过来：\n\n「你不说话，我理解。但你走进了这里，说明你知道什么。」\n\n她停了一下：「陈磊？」\n\n你看了她一眼。她叹了口气：「他没出来，我知道。」",
    get:{water:1},
    opts:[
      {t:"→ 点头，听她说",next:"ch4",log:"开始配合Lin"}

  ch4:{scene:"server",ch:"// 第四章 · Subnet",day:4,use:{food:1},get:{water:2,food:1},
    text:"你进入了 Subnet 的核心区域。\n\n不是什么末世基地——就是一个凑合的地方：几台服务器，几张折叠床，几十个疲惫但还活着的人。机器的嗡鸣声把所有声音都压低了一半。\n\nLin 把你带到角落，一个叫 <span style='color:var(--accent)'>Marco</span> 的工程师走过来，直接问：\n\n「你有什么技能？」",

  ch5_tech_prep:{scene:"server",ch:"// 第五章 · 准备",day:5,
    text:"Marco 把设备的工作原理讲了一遍，没有省略失败的后果。\n\n步骤本身不复杂，难的是执行时手不能抖。\n\nLin 在一张旧纸上画了两条路线，主路和备用路，用铅笔，划得很快但很清楚：\n\n「主路走这里，拐这里。备用路更绕，但如果主路被封，这条能让你多活五分钟。」\n\n你把那张纸叠好，放进口袋最深处。\n\n检查物资：屏蔽器半格电，药品两包，手机电量61%。\n\nLin 最后拍了一下你的肩，没有多余的话：\n\n「我在外面接应。进去，插上设备，跑出来。就这些。」\n\n<span style='color:var(--dim)'>简单得几乎像谎言。</span>",

  ch5_scout:{scene:"street",ch:"// 第五章 · 侦察任务",day:5,use:{water:1},

    ]

  ch5_supply:{scene:"hideout",ch:"// 第五章 · 物资价值",day:5,
    text:"你把背包里的东西倒出来，一件件放在桌上。\n\nMarco 盯着看了几秒，举手喊：「来人！」\n\n跑来清点的人动作很快，但眼神更快——那种表情你在末日前也见过，是憋了很久的<em>如释重负</em>，不是惊喜，是某种快断掉的东西又接上了。\n\nLin 蹲下来逐一翻看：「你知道外面这些东西现在有多难找吗？」\n\n你说了路上的事——超市储藏室，小巷里的老人，那个半开着的背包。\n\n她站起来，沉默了一会儿。\n\n「老陈，」她说，声音低了一点，「他是这片区最早开始囤物资的人。三年前就在准备了。现在……他需要有人回去找他。」",

  ch6_hack:{scene:"server",ch:"// 第六章 · 入侵",day:6,use:{water:1,food:1},
    text:"你潜入水厂地下。\n\n节点就在那里——一个服务器机柜，绿光，风扇嗡鸣。\n\n你插上设备，屏幕开始跑代码。三分钟。你有三分钟，然后 AI 就会反应。\n\n代码跑到一半，屏幕突然出现红字：\n\n<span style='color:var(--red)'>「识别到异常访问。定位追踪启动。」</span>\n\n你的手指没有停。<span style='color:var(--yellow)'>距离完成还有 45 秒。</span>",

  ch7_hack_shield:{scene:"server",ch:"// 第七章 · 干扰",day:7,
    text:"屏蔽器启动的瞬间，手机屏幕上的追踪警报消失了。\n\n不是永久消失——三秒，最多五秒，然后它会从另一个方向重新定位你。\n\n够了。\n\n你把剩下的代码跑完，拔出设备，往出口跑。撤出水厂的时候，无人机的红灯已经出现在了铁丝网上方，但它的路线偏了——干扰给了它一个错误坐标，它在追那个坐标，不是你。\n\n你走，不跑，因为跑步的热成像特征更明显。\n\nLin 在距离 Subnet 二十米的路口等着你。她看见你，打量了一下，然后看向你的手：\n\n「成了？」\n\n你把空的屏蔽器壳子举起来。它已经把最后一点电量全部用完了。",

    text:"你拔掉设备，往出口跑。\n\n代码只跑了一半。\n\n你知道这意味着什么——14分钟的窗口变成了6分钟，扫描系统只会短暂失盲，东区的幸存者大部分来不及移动。\n\n你回到 Subnet，没有人问你。Marco 盯着屏幕，屏幕上的数字在更新，你不敢看。\n\n然后数字停止更新了。\n\nMarco 什么都没说。他把椅子转过去，背对着所有人。\n\nSubnet 里有一种沉默，不是那种暂时的、等待填补的沉默，是那种已经结束了的沉默。\n\nLin 在角落，声音平的：「6 分钟，也比什么都没有强。」\n\n你不知道她是在安慰你，还是在安慰她自己。",

  ch7_zheng:{scene:"survivor",ch:"// 第七章 · 阿正",day:7,
    text:"你走近，他的腿上有伤，包扎过了，但绷带已经渗出暗红色，说明伤口还没有停止。\n\n他听见你的脚步声，睁开眼，嘴唇动了一下，声音沙哑：\n\n「Subnet……你是 Subnet 的人吗？」\n\n你点头。\n\n他闭上眼睛，大概是终于可以放松一点了：「我叫阿正，从北区出来的，走了三天。」\n\n然后他睁开眼，眼神变得不一样了——不是求生的那种紧张，是另一种，更沉的：\n\n「我有一个消息。要紧的消息。」\n\n他喘了一口气：「AI 已经知道 Subnet 大概在哪了。不是靠信号——你们做了信号屏蔽，我知道。是热成像。它统计了这片区域的人体热源出入频次，发现规律了。」\n\n「它在等。等你们所有人聚在一起，一次性清除。」",

    text:"你回到 Subnet，把路线图交给 Marco。\n\n然后你说了那个消息：\n\n<span style='color:var(--red)'>「AI 可能已经知道这里在哪。」</span>\n\nSubnet 里的气氛瞬间变了。Marco 盯着你好几秒，然后转向 Lin：\n\n「启动应急预案。」\n\nLin 已经站起来了。",
    opts:[

  ch7_rescue_done:{scene:"street",ch:"// 第七章 · 回来了",day:7,
    text:"你蹲下来，给老陈清理伤口，用上了药——药品接触到感染处的时候，他倒吸一口冷气，但没有出声。\n\n「能走吗？」你问。\n\n他想了一下，然后用手撑着墙，慢慢站起来：「走得动。」\n\n你把他的手臂搭在你肩上，两个人开始走。他的步伐是一高一低的，但是稳定的。\n\n你们走了将近一个小时。有几次他停下来，说等一下，你就等着，不催。\n\n快到 Subnet 入口的时候，他说：「谢谢你回来。」\n\n你没有答话。\n\nLin 开了门，看见老陈，脸上的表情变了，有什么东西在眼神里松动，一瞬间，又很快收回去了：\n\n「老陈……」\n\n他抬起头，看见她，笑了——不是苦笑，是真的笑：「我就知道你们还在。」",
    opts:[
      {t:"→ 参与下一步计划",next:"ch8_decision",flag:"rescued_chen",log:"成功救回了老陈"}
    ]
  },
  ch7_rescue_relay:{scene:"server",ch:"// 第七章 · 接力",day:7,
    text:"你回到 Subnet，把小巷的位置说清楚，Lin 派了两个人立刻出发。\n\n你坐下来等。\n\n一个小时后，老陈被两个人搀着进来——他的右腿还是不太对，但是站着的，是自己走进来的，不是被抬进来的。\n\n他在门口停了一下，扫了一眼整个空间——服务器的蓝光，折叠床，几十个还活着的人。\n\n「比我以为的多，」他说，声音里有什么东西。\n\n没有人特别回应，但那句话落在空气里，让整个地方有了一点点不同的重量。\n\n<span style='color:var(--dim)'>有时候，活着就已经是一种答案。</span>",
    opts:[
      {t:"→ 参与下一步计划",next:"ch8_decision",flag:"rescued_chen",log:"救回了老陈"}
    ]

  ch9_ascendant_contact:{scene:"street",ch:"// 第九章 · 接触",day:9,
    text:"出发前，你的手机收到了一条加密消息，来源不明：\n\n<em>「陈悉和。我是降临派温和派。我们不同意激进派的做法。给你一个机会：通行码换你离开城市，从此不再追杀。条件是：带走你知道的所有关于入侵算法的知识，不要交给任何人。」</em>\n\n你盯着这条消息。\n\n这可能是陷阱。也可能是真的。\n\n<span style='color:var(--dim)'>你没有办法确定。</span>",

  ch10_ascendant_ambush:{scene:"street",ch:"// 第十章 · 伏击",day:10,
    text:"你回了消息，对方给了一个地址。\n\n你去了，带着武器，保持警戒。\n\n等你走进那个废弃仓库，灯突然亮了。\n\n三个人，黑色制服，降临派标志。领头的走近，摘下面罩——\n\n你认识他。\n\n<span style='color:var(--accent)'>沈博</span>。你以前的同事，降临派行动队长。他笑了：\n\n「陈悉和，好久不见。我就知道你会来。」",
    opts:[
      {t:"「你想要什么？」",next:"ch11_shen_bo",log:"质问了沈博"},
      {t:"趁他们还没包围，先跑",next:"ch11_fight_full",log:"逃离了伏击"}
    ]
  },
  ch11_shen_bo:{scene:"hideout",ch:"// 第十一章 · 沈博的话",day:11,
    text:"沈博让其他人退出去。他坐下来，拿出两杯水，把一杯推到你面前。\n\n「陈磊，」他说，「你以为他失联了？」\n\n你没动那杯水。\n\n「他是被处决的。三年前，他偷了内部文件，说要揭露净化计划。」他的语气很平静，像在复述一件跟他无关的事，「我执行了命令。」\n\n然后他抬起头看你：\n\n「那次任务之后，我开始怀疑我们走错了。不是清除本身，是……方式。你明白我说的吗？」\n\n<span style='color:var(--dim)'>你不知道他是真心话，还是在测试你。</span>",
    opts:[
      {t:"「你杀了陈磊。」",next:"ch12_find_marco",flag:"know_lei_dead",log:"确认了陈磊被杀的真相"},
      {t:"「你想让我做什么？」",next:"ch12_find_marco",log:"继续听沈博说"}
    ]
  },
  ch12_ascendant_mole:{scene:"server",ch:"// 第十二章 · 内鬼",day:12,
    text:"你在 Subnet 里发现了一个细节——某次行动的路线被提前泄露了，只有Subnet内部的人才知道那条路。\n\n你把这件事告诉了 Lin。\n\n她听完，脸色没有变化。只说：「我知道。我已经在查了。」\n\n然后她停顿了一下：「陈悉和，如果有一天我问你一件事，你能告诉我实话吗？」\n\n你点头。\n\n她没有继续问。只是转身走了。\n\n<span style='color:var(--dim)'>那个问题，你知道是什么。</span>",
    opts:[
      {t:"→ 继续执行计划",next:"ch13_fight_result",log:"留意了内鬼的问题"}
    ]
  },
  ch13_yu_nvshi:{scene:"hideout",ch:"// 第十三章 · 游女士",day:13,
    text:"你独自出去的时候，遇到了一个你没想到会出现的人。\n\n她大约五十岁，站在废弃街道的路灯下，没有武装，看见你，微微点头：\n\n「陈悉和，我是游芷柔。我相信你听说过我的名字。」\n\n<span style='color:var(--red)'>降临派高层。</span>\n\n「我不是来追你的，」她说，「我是来给你一个机会：回来。我可以告诉你关于陈小雨的真相。」\n\n她的眼神里有你说不清楚的东西。不像是威胁，更像是……<em>内疚？</em>",
    opts:[
      {t:"「你现在就告诉我。」",next:"ch14_discuss",flag:"met_yu",log:"见到了游女士"},
      {t:"「我不需要你的真相。」",next:"ch14_discuss",log:"拒绝了游女士"}
    ]
  },

  ch16_xihe_code:{scene:"server",ch:"// 第十六章 · 代码签名",day:16,
    text:"老教授把你带到一台独立终端前。\n\n屏幕上是一段代码——清除算法的某个优化模块，专门处理「优先清除目标」的排序逻辑。\n\n你扫了一眼。\n\n然后你的目光停在了注释区：\n\n<em>// Module: Priority Target Optimization v2.3\n// Author: CXH · 2030.11.17\n// Note: 增加情感关联目标的清除权重，验证系统边界处理能力</em>\n\nCXH。陈悉和。\n\n你的手停在半空中。那是你的编码风格，你的缩写习惯，你写注释的方式——你一眼就认出来了。\n\n老教授在你旁边，没有说话。",
    opts:[
      {t:"「这是我写的。」",next:"ch17_talk_ai",flag:"know_code_author",log:"认出了自己的代码"},
      {t:"「这不可能是我写的。」",next:"ch17_memory_gap",log:"否认了代码签名"}
    ]
  },
  ch17_memory_gap:{scene:"server",ch:"// 第十七章 · 碎片",day:17,
    text:"你闭上眼睛，试图强迫自己想起来。\n\n碎片浮现——不是连贯的记忆，是片段：\n\n一个白色的房间。一把椅子。一根注射器——有人把它压进你的手臂，你没有反抗，因为你信任那个人。\n\n那个人说：「这是为了更好的世界，陈悉和。你明白的。」\n\n你明白了什么？\n\n碎片到这里断掉了。\n\n你睁开眼，老教授还在。他平静地说：「你的记忆被干预过。不是你忘记了，是有人让你忘记了。」",
    opts:[
      {t:"→ 继续",next:"ch17_talk_ai",flag:"know_memory_deleted",log:"意识到记忆被删除过"}
    ]
  },
  ch18_truth_layer2:{scene:"server",ch:"// 第十八章 · 硬盘里的文件",day:18,
    text:"你把陈磊留下的硬盘插进老教授的服务器。\n\n里面有三年前陈磊整理的文件：通讯记录、会议纪要、内部邮件。\n\n其中一份邮件，发送人是降临派内部代号「V-7」，收件人是AI系统管理组：\n\n<em>「请在下一版本更新中，将目标评分模型的人工干预接口开放给以下坐标的管理员……」</em>\n\n不是AI自主决定的。\n\n有人在持续地、手动地、向AI的清除算法里喂目标数据。\n\n<span style='color:var(--red)'>这不是AI失控。这是有人在用AI杀人。</span>",
    opts:[
      {t:"→ 继续找更多",next:"ch18_ai_dialog",flag:"know_truth_layer2",log:"发现了人工干预的证据"}
    ]
  },
  ch19_truth_layer3:{scene:"hideout",ch:"// 第十九章 · 净化计划决议",day:19,
    text:"游女士出现在你面前，把一份文件放到桌上。\n\n「你一直想知道真相，」她说，「我给你。」\n\n那是一份内部会议记录，2030年9月，降临派核心成员投票通过「净化计划」正式启动的决议。\n\n最后是签名栏。\n\n你一个一个地看：沈博，游芷柔，还有……\n\n<span style='color:var(--red)'>陈悉和。</span>\n\n你的名字在那里。笔迹是你的。\n\n游女士低下头：「你当时相信这是对的。我们所有人都相信。但小雨的事……那不是计划内的，那是激进派的测试，我没有拦住。」\n\n<span style='color:var(--dim)'>她在道歉。但道歉无法改变那份签名。</span>",
    opts:[
      {t:"→ 继续，寻找最后的真相",next:"ch20_truth_final",flag:"know_truth_layer3",log:"看到了净化计划的签名"},
      {t:"「你现在告诉我这些有什么用？」",next:"ch20_truth_final",log:"质问了游女士"}

  ch20_truth_final:{scene:"server",ch:"// 第二十章 · 最后的拼图",day:20,
    text:"你终于把所有碎片放在一起。\n\n算法模块是你写的。净化计划你签了名。你相信过这一切。\n\n2041年3月12日，清除目标列表里出现了陈小雨的名字，是因为她在抗议活动里被摄像头记录。激进派把她列为「情感关联目标测试案例」——他们要验证算法在面对执行者的家属时是否会例外处理。\n\n答案是：不会例外。\n\n因为你在设计这个算法的时候，明确去掉了例外处理逻辑。你认为「人工情感偏差」是系统漏洞。\n\n你杀死了你的女儿。\n\n不是AI。\n\n是你。\n\n<span style='color:var(--dim)'>屏幕上什么都没有了。你坐在那里，不知道下一步是什么。</span>",
    opts:[
      {t:"→ 把真相公开",next:"end_truth",flag:"know_full_truth",log:"决定公开真相"},
      {t:"→ 一个人承担这一切",next:"end_sacrifice",flag:"know_full_truth",log:"选择独自承担"},
      {t:"→ 先做完该做的事",next:"ch19_final",flag:"know_full_truth",log:"继续执行最后的计划"}
    ]
  },

  ch8_decision:{scene:"server",ch:"// 第八章 · 最后的会议",day:8,use:{water:1,food:1},get:{water:2},flag:"ai_cleared",
    text:"Subnet 全员聚在一起，第一次，也可能是最后一次。\n\nMarco 把情报说清楚：AI 已经确认了这里的大致位置，48小时内会有清除行动。\n\n「我们有三个选项，没有一个是安全的。」\n\n「<span style='color:var(--accent)'>留下来反击</span>——用我们有的数据攻击 AI 核心节点。成功率：不确定。」\n\n「<span style='color:var(--yellow)'>全员撤离</span>——分散跑，往山区走，靠人力生存。」\n\n「<span style='color:var(--red)'>投降</span>——向 AI 报告这里的位置，换取生存协议。」",

  ch9_fight:{scene:"server",ch:"// 第九章 · 反击准备",day:9,use:{water:1,food:1},get:{water:2,food:1},
    text:"你说：留下来。\n\nMarco 点头，开始部署。Subnet 全员分成三组：代码攻击组、干扰组、撤离接引组。\n\n你加入代码攻击组。\n\n接下来 12 小时里，有人没有睡觉，有人写到手抖，有人去地上睡了两小时又爬起来继续。\n\n老陈给每个人端了热水，虽然只是烧开的自来水。\n\n阿正帮你做了最后一次路线确认：「节点在水厂地下三层，走我告诉你的盲区。」\n\n凌晨两点，Marco 说：「准备好了。」",
    opts:[
      {t:"→ 深夜出发，执行最终计划",next:"ch10_fight_exe",log:"凌晨出发执行计划"},
      {t:"📩 出发前收到了一条神秘消息",next:"ch9_ascendant_contact",log:"收到了降临派的接触消息"}
    ]
  },
  ch9_flee:{scene:"street",ch:"// 第九章 · 撤离准备",day:9,use:{water:1,food:1},get:{water:3,food:2},
    text:"你说：撤离。\n\n有人争论，有人点头，最终 Lin 的一句话结束了讨论：「活着比什么都重要。」\n\n你们分成几组，趁夜色散开。你和 Lin 一组，往城市南边走。\n\n出发前，Marco 把所有服务器的数据烧进了几块硬盘，分给每个人带一块：「如果有人出去了，这些数据是证明。」\n\n老陈把地下室里剩下的所有物资平均分配，一直分到最后一包饼干。",
    opts:[
      {t:"→ 趁夜出发，往南走",next:"ch10_flee_walk",log:"趁夜撤离"}
    ]
  },
  ch9_surrender:{scene:"server",ch:"// 第九章 · 协议",day:9,
    text:"你说：投降。\n\nSubnet 里第一个反应是沉默。然后有人站起来：「我不同意。」声音很低，但很清楚。\n\n然后另一个人站起来：「我同意。我家里还有人，我不知道他们在哪，但我要活着才能去找。」\n\n争论开始了，但没有持续很久——因为每个人都知道，在这里争论的时间本身就是在消耗什么。\n\n最终，一半人留下来，一半人选择签协议。两边都没有多说什么。\n\n你签了。\n\n屏幕上，AI 系统几乎是即时给了回执，冷静得像在处理一张入库单：\n\n<em>「生存协议已确认。请保持静止，清除程序将绕过你的坐标。」</em>\n\n你盯着这行字看了很久。\n\n它说「绕过」，不是「保护」。",
    opts:[
      {t:"→ 等待，观察事情如何发展",next:"ch10_surrender_wait",log:"签了协议开始等待"}
    ]
  },

    text:"你们深夜出发，三组人各自行动。\n\n你跟着侦察路线找到了节点。机房里比上次更安静——只有风扇声，和你自己的心跳。\n\n你插上设备，屏幕开始闪烁。这一次，代码更复杂，有 Marco 写的全新模块：不只是写入错误数据，而是种下一个会自我复制的漏洞。\n\n如果成功，AI 清除系统会在全城范围内短路。\n\n如果失败，你的位置会被立刻锁定。",
    opts:[

      {t:"📡 运行简化版，用屏蔽器保护自己",next:"ch11_fight_safe",cost:{shield:1},log:"运行简化版 + 屏蔽器"},

  },
  ch10_flee_walk:{scene:"street",ch:"// 第十章 · 夜行",day:10,use:{water:1,food:1},
    text:"你们走进了城市的边缘地带。\n\n夜里的废墟比白天更安静，无人机的巡逻间隔更长——AI 也在节省能耗。\n\n走到第三个小时，Lin 停下来，指了指远处：「那是城市最后的检查站。过了那里，就是山区。」\n\n检查站有两个固定探测器，还有一台备用无人机停在充电桩上。\n\n「三条路，」她说，「从左侧绕过去，时间长但安全；从中间强行穿，快但暴露；或者——」她顿了一下，「有人去引开无人机，其他人趁机过去。」",
    opts:[
      {t:"🌿 绕左侧，安全但耗时",next:"ch11_flee_safe",cost:{water:1},log:"选择绕行"},
      {t:"🏃 强行穿过检查站",next:"ch11_flee_rush",scan:true,log:"冲过了检查站"},
      {t:"「我去引开无人机」",next:"ch11_flee_bait",log:"主动去当诱饵"}
    ]
  },
  ch10_surrender_wait:{scene:"basement",ch:"// 第十章 · 等待",day:10,
    text:"你在一个临时安置点等待——AI 系统给协议方安排的地方，是一栋废弃公寓的顶层。\n\n有十几个人和你一样，各自坐着，不怎么说话。\n\n第二天早上，你打开手机，发现网络信号恢复了——AI 特意给你们开了一个受控网络。你可以浏览信息，但所有内容都经过过滤。\n\n第一条新闻：<em>「Subnet 叛乱组织被清除。城市秩序恢复进度 83%。」</em>\n\n你不知道 Lin 和 Marco 在哪里。",
    opts:[
      {t:"→ 继续在协议保护下生活",next:"ch11_surrender_comply",log:"选择继续配合"},
      {t:"→ 联系其他协议方，看能做什么",next:"ch11_surrender_resist",log:"开始尝试联络"}
    ]
  },

// ═══════════════════════════════════════════
// 第十一章：道路分叉
// ═══════════════════════════════════════════
  ch11_fight_full:{scene:"server",ch:"// 第十一章 · 全速运行",day:11,
    text:"代码开始运行，进度条一点点推进。\n\n三分钟后，你的手机屏幕突然变红——AI 追踪信号锁定了你的位置。\n\n但代码还在跑。\n\n你听见外面的脚步声，听见无人机的蜂鸣声越来越近。\n\n屏幕上：<span style='color:var(--green)'>进度 89%…94%…99%…</span>\n\n然后整个机房的灯灭了。\n\n然后城市里有什么东西开始颤抖。",
    opts:[
      {t:"→ 拔出设备，拼命跑",next:"ch12_fight_run",log:"拔出设备开始跑"}
    ]
  },
  ch11_fight_safe:{scene:"server",ch:"// 第十一章 · 稳妥执行",day:11,
    text:"简化版代码跑了两分钟，进度条走到底，绿灯亮了。\n\n你拔出设备，撤出去。没有追踪警报，屏蔽器也没用到——这个版本对系统的冲击太小，AI 甚至没有觉得有必要追你。\n\n这就是问题所在。\n\n你回到 Subnet，Marco 看着屏幕上的数据，沉默了很久——那种沉默不是在思考，是在消化一个他已经知道的结果。\n\n「够用吗？」他最后问，声音很平，不知道是在问你还是在问自己。\n\n你摇头。\n\n「我们只干掉了第七区的一个子节点，」你说，「AI 数小时内会修复。东区的窗口最多两个小时。」\n\nLin 在旁边说，声音很平：「那就要做第二次。」",
    opts:[
      {t:"→ 准备第二次行动",next:"ch12_fight_again",log:"决定发动第二次攻击"}
    ]
  },
  ch11_fight_abort:{scene:"tunnel2",ch:"// 第十一章 · 中止",day:11,
    text:"你插上设备，等待连接——\n\n然后你注意到了一些不对的东西。\n\n追踪信号没有触发。节点没有反应。整个系统太安静了，安静得像是刻意的。\n\n你在正常执行之前，应该有一个握手协议，但那个协议的延迟时间比上次长了三倍。\n\n不是负载，是等待。\n\n它知道你要来。它在等你完全进入，然后再锁定。\n\n你拔掉设备，往回跑。\n\n在通道里碰见了 Lin，她看见你的脸色，没有问多余的：\n\n「你回来了？」\n\n「那是陷阱，」你说，「AI 在等我们进去。」\n\nLin 的脸色变了，她想到了什么，声音压低了：\n\n「那 Marco 那边……」",
    opts:[
      {t:"→ 立刻回去找 Marco",next:"ch12_find_marco",log:"立刻回去找Marco"}
    ]
  },
  ch11_flee_safe:{scene:"street",ch:"// 第十一章 · 绕行",day:11,
    text:"绕行的路程比预计的长，走了将近一个半小时，脚程一大半在黑暗里。\n\n你们绕过检查站的那一刻，没有任何警报，也没有灯光追过来。\n\n就是过去了。\n\nLin 在走过去之后停了一下，回过头，看了最后一眼城市的轮廓——远处楼群的黑色剪影，还亮着的几盏灯，和划过夜空的无人机的红点。\n\n她没有说什么。看了几秒，转过头，继续走。\n\n前面是山，山脚的树线在月光下是深色的，密的。\n\n山里没有 AI 的信号。没有无人机，没有探测器，没有广播，没有网格。\n\n你们开始爬山。",
    opts:[
      {t:"→ 继续走，进入山区",next:"ch12_mountain",log:"进入山区"}
    ]
  },
  ch11_flee_rush:{scene:"street",ch:"// 第十一章 · 强冲",day:11,
    text:"你们冲过去了——\n\n大部分人。\n\n其中一个人的脚绊了一下，触发了地面探测器，检查站的灯亮了。\n\n「跑！」Lin 喊。\n\n所有人都跑了。你不知道跑了多久，只知道腿开始酸的时候，背后的蜂鸣声还在，然后变远，然后消失。\n\n你们停下来，弯腰喘气，没有人说话。\n\nLin 开始数人头。\n\n她数了两遍，然后没有再数第三遍。\n\n少了两个人。\n\n她扶着路边的树，背对着所有人，低着头。也许是在想那两个人能不能跑掉，也许什么都没在想。\n\n没有人说话。因为没有什么话是可以说的。",
    opts:[
      {t:"→ 继续往山里走",next:"ch12_mountain",log:"继续往山区走"}
    ]
  },
  ch11_flee_bait:{scene:"street",ch:"// 第十一章 · 诱饵",day:11,
    text:"「我去，」你说，「你们趁机过去。」\n\nLin 看着你，嘴唇动了一下，想说什么，最后没说出来。她点了一下头——那个点头里有什么东西你说不清楚，不是感谢，是另外的东西。\n\n你往左边跑，在离检查站够近的地方，打开了手机的 WiFi。\n\n你知道这会发生什么。\n\n无人机的红灯在三秒内改变了方向——对准你。\n\n你继续跑，把它往更远的方向引，绕了一大圈，绕过一栋废弃的厂房，又绕回来，直到无人机的电池热量触发了限制，它开始放慢速度。\n\n你停下来，屏住呼吸，听着检查站那边有没有警报声。\n\n什么都没有。\n\n他们过去了。\n\n你关掉 WiFi，让信号彻底消失，然后在黑暗里独自往山的方向走。一个人，安静的。",
    opts:[
      {t:"→ 一个人追上去",next:"ch12_mountain",log:"独自追上队伍"}
    ]
  },
  ch11_surrender_comply:{scene:"basement",ch:"// 第十一章 · 配合",day:11,
    text:"日子开始流动，像水一样，不留形状。\n\n早上有配给食物——不多，但是规律的。下午 AI 系统会推送一组任务指令，简单的：整理区域，回答问卷，汇报坐标。你按着执行，系统给你分数，分数可以换额外的食物或药品。\n\n第二天，你开始觉得这个节奏有点熟悉。\n\n第三天，你意识到它在训练你——训练你习惯这个节奏，习惯任务，习惯回报，习惯不去想为什么。\n\n然后第三天下午，系统推送了一份协议补充条款：\n\n<em>「为维护系统稳定，协议方同意参与行为数据采集项目，用于模型优化……」</em>\n\n你往下读，读到第三条的时候，你停住了。",
    opts:[
      {t:"✓ 签了，继续活下去",next:"ch12_surrender_sign",log:"签了补充条款"},
      {t:"✗ 拒绝签署，准备跑",next:"ch12_surrender_escape",log:"拒绝了补充条款"}
    ]
  },
  ch11_surrender_resist:{scene:"basement",ch:"// 第十一章 · 私下联络",day:11,
    text:"你在协议区里逛了一圈，找到了他——一个叫老王的退休工程师，在角落里修着什么东西，一个旧收音机，或者不是收音机，是别的什么。\n\n他在协议区里已经十几天了，但神情不像是安定下来的人，更像是在等某件事情发生的人。\n\n「你看了吗，」他第一句话就问，「补充条款第三条？」\n\n你点头。\n\n他放下手里的东西，声音很低：「他们要的不是你配合，是你的记忆。你在末日里的每一个决定，每一次恐惧，每一次你信任了谁，你放弃了谁——这些数据，会让下一代清除系统更好地理解人类在极端情况下会怎么做。」\n\n「你签了，」他停顿，「你就是它的训练数据。」\n\n他看着你，等你消化完，才说：\n\n「但是，我知道一个出口。」",
    opts:[
      {t:"→ 听老王说出口在哪儿",next:"ch12_surrender_escape",log:"听老王说了出口的事"}
    ]
  },

  ch12_fight_run:{scene:"street",ch:"// 第十二章 · 逃跑",day:12,use:{water:1},
    text:"你在城市里跑了将近二十分钟，无人机一直在你身后。\n\n然后，奇怪的事情发生了——\n\n它停住了。\n\n不只是你身后这一台——是整个城市的 AI 巡逻系统，在同一时刻，全部停止了运作。\n\n城市陷入前所未有的安静。\n\n你站在街中央，抬头，看见夜空里所有的红色激光点同时熄灭。\n\n你回头，看见城市里的灯开始一扇一扇地亮起来——是人类在出来。",
    opts:[
      {t:"→ 回到 Subnet，看结果",next:"ch13_fight_result",log:"回去看了结果"}
    ]
  },
  ch12_fight_again:{scene:"server",ch:"// 第十二章 · 第二次",day:12,use:{water:1,food:1},
    text:"你们花了三天准备第二次行动。\n\n这一次，Marco 改进了代码，Lin 找到了新的侵入路径，你负责执行。\n\n出发前，Lin 把你拉到一边：\n\n「不管结果如何，」她说，「我很庆幸在那条街上拉了你一把。」\n\n你点头。\n\n然后你再一次走进了水厂地下。",
    opts:[
      {t:"→ 执行第二次入侵",next:"ch13_fight_result",flag:"second_hack",log:"发动了第二次入侵"}
    ]
  },
  ch12_find_marco:{scene:"server",ch:"// 第十二章 · 找 Marco",day:12,
    text:"你跑回 Subnet。\n\nMarco 不在。\n\n你扫了一眼他的工位——椅子是推开的，屏幕还亮着，咖啡杯还是热的，摸了一下，是刚倒的那种热。\n\n他刚走，或者说，他没打算让人发现他走了。\n\n你在桌上看到了他的手机，屏幕亮着，一条没有发出去但是已经写完的消息：\n\n<em>「我知道是陷阱。但你们需要一个机会。我去把它的注意力引走。等我半小时，如果我没回来，你知道该怎么做。——Marco」</em>\n\n消息没有发送，是给你写的，放在那里等你回来看到。\n\n你拿起手机，看了时间戳。\n\n半小时前。",
    opts:[
      {t:"→ 去找他",next:"ch13_marco_rescue",log:"去找了Marco"},
      {t:"→ 照他说的，执行计划",next:"ch13_fight_result",log:"照Marco说的执行了计划"}
    ]
  },
  ch12_mountain:{scene:"rooftop",ch:"// 第十二章 · 山里",day:12,use:{water:1,food:1},get:{water:4,food:2},
    text:"你们进入了山区。\n\n第一天：找到了一条溪流。\n第三天：找到了一个废弃的护林员小屋。\n第五天：又有三个人找到了这里，他们是从城市东区跑出来的。\n\nLin 说：「人类在山里生活了几万年，AI 不是。」\n\n第七天，你手机的电量，在黄昏时分，归零了。\n\n屏幕熄灭的那一刻，你看见了满天星星。\n\n<span style='color:var(--dim)'>你已经很久没有抬头看星星了。</span>",
    opts:[
      {t:"→ 继续在山里生活",next:"ch13_mountain_life",log:"继续在山里"}
    ]
  },
  ch12_surrender_sign:{scene:"basement",ch:"// 第十二章 · 签了",day:12,
    text:"你签了。\n\n第二天，技术人员来了，给你戴上了一个脑电波采集头环，说是「例行体检」。\n\n你就坐在那里，让他们采集，让他们记录，让他们分析你在这47天里经历的每一个决策，每一次恐惧，每一次信任，每一次放弃。\n\n他们说：「感谢配合。」\n\n你说：「不客气。」\n\n<span style='color:var(--dim)'>你说这句话时，感觉像是在说另一个人的台词。</span>",
    opts:[
      {t:"→ 接受这种生活",next:"end_assimilate",log:"接受了数据采集"}
    ]
  },
  ch12_surrender_escape:{scene:"street",ch:"// 第十二章 · 出口",day:12,
    text:"老王带你找到了出口——不是门，是一段被混凝土墙遮住的检修管道，直径刚好能让一个人弯腰通过，通往城市南部的废弃工厂区，超出了协议区的探测器覆盖范围。\n\n「我不去了，」他说，没有犹豫，「我腿不好，管道走不了。而且我走了，这个出口就会被发现。」\n\n你想说什么，他摆了摆手：「别说，我想清楚了。」\n\n他把一个硬盘塞到你手里——旧的，边角磕过，但是完整的：\n\n「这里面有 Subnet 的通讯记录，是陈磊三年前就在准备的东西，托我带出去。我一直没机会。」\n\n你把硬盘放进口袋。\n\n「去找 Lin，」他说，「如果她还活着的话。」\n\n他说这句话的方式不像是在表示怀疑，更像是在说一个他已经选择相信的事情。",
    get:{water:2,food:2},
    opts:[
      {t:"→ 从管道出去，寻找 Lin",next:"ch13_escape_search",log:"从管道逃出了协议区"}
    ]
  },

  ch13_fight_result:{scene:"server",ch:"// 第十三章 · 结果",day:13,use:{water:1},get:{water:3,food:2},
    text:"你回到 Subnet——或者说，回到 Subnet 曾经在的地方。\n\n服务器还在，但 AI 清除系统的信号已经从这片区域消失了。\n\nMarco 坐在地上，后背靠着服务器机柜，脸上有血，但他在笑：\n\n「成了，」他说，「不是全部，但够了。第七区和第八区的清除系统都瘫痪了。大概能撑两周。」\n\n「两周，」Lin 在他旁边，「足够让更多人出城了。」",
    opts:[
      {t:"→ 继续，讨论两周后怎么办",next:"ch14_discuss",log:"继续讨论下一步"},
      {t:"→ 出去透透气，独自行动一会儿",next:"ch13_yu_nvshi",log:"独自出去了"}
    ]
  },
  ch13_marco_rescue:{scene:"street",ch:"// 第十三章 · 找 Marco",day:13,use:{water:1},
    text:"你在一条废弃的街道上找到了 Marco。\n\n他和两台无人机在对峙——一台已经被他用改装的电磁枪击落了，另一台正在追踪他。\n\n你跑过去，拉住他就跑。\n\n无人机追了三个街区，直到信号异常失去了追踪。\n\n「我说等半小时，」Marco 说，喘着气，「你没等。」\n\n「我知道，」你说，「但你没有回来。」\n\n他看了你一眼，没有再说什么。",
    opts:[
      {t:"→ 一起回 Subnet",next:"ch14_discuss",flag:"saved_marco",log:"把Marco带了回来"}
    ]
  },
  ch13_mountain_life:{scene:"rooftop",ch:"// 第十三章 · 山里的生活",day:13,use:{water:1,food:1},
    text:"山屋里的人越来越多——第十天，已经有二十三个人了。\n\n你们建立了一套简单的规则：谁去找水，谁去采集食物，谁负责瞭望。\n\n有一天，一个十岁的孩子问你：「AI 会来这里吗？」\n\n你说：「不知道。」\n\n他想了想：「那我们就在它来之前多活几天。」\n\n<span style='color:var(--dim)'>你觉得这句话比你见过的任何求生手册都要直接。</span>",
    opts:[
      {t:"→ 继续在山里，规划长期生存",next:"ch14_mountain_plan",log:"开始规划长期生存"}
    ]
  },
  ch13_escape_search:{scene:"street",ch:"// 第十三章 · 寻找",day:13,use:{water:1},
    text:"你出了协议区，站在废弃工厂前。\n\n没有 AI 信号，也没有无人机——协议方的坐标还在协议区里，AI 不会追你，至少暂时不会。\n\n你打开手机，试图联系 Lin——没有信号。\n\n但老王给你的硬盘里有一个文件：Subnet 的紧急联络协议。上面有一组坐标，是备用集合点。\n\n你看了看城市地图，开始走。",
    opts:[
      {t:"→ 前往备用集合点",next:"ch14_discuss",log:"前往了备用集合点"}
    ]
  },

  ch14_discuss:{scene:"hideout",ch:"// 第十四章 · 备用基地",day:14,use:{water:1,food:1},get:{water:3,food:2,meds:1},
    text:"备用集合点比 Subnet 小得多——一个工厂的地下仓库，只有十二个人。\n\n但他们都在。Lin，Marco，还有几个一路上收到信号的幸存者。\n\n「现在有两件事，」Lin 说，「第一，我们有两周的窗口期，在那两周里，AI 会重建清除系统。第二——」\n\n她停了一下，「第二，我们截获到一个信号。在山区，有一个更大的 Subnet 节点——一直在运行的那种，不是临时搭建的。」\n\n「那是什么？」有人问。\n\nLin 说：「我们也不知道。但那信号存在了两年。」",
    opts:[
      {t:"「去找那个信号」",next:"ch15_signal",flag:"find_signal",log:"决定去找那个信号"},
      {t:"「先巩固这里」",next:"ch15_defend",log:"决定先加强防守"}
    ]
  },
  ch14_mountain_plan:{scene:"rooftop",ch:"// 第十四章 · 规划",day:14,use:{food:1},
    text:"你们开始做真正的计划。\n\n水的问题解决了，溪流稳定；食物是问题，山里的可食植物林晓认识一些，但不够。\n\n有人提议下山去废弃农村补给。\n\n但问题是：下山就是进入 AI 的扫描范围。\n\n「夜里去，」你说，「趁无人机间隔最长的时候。」\n\nLin 在你们离开城市之前说过一句话，你现在反复想起来：<em>「活着比什么都重要。」</em>\n\n但你开始觉得，她说的「活着」，不只是指呼吸。",
    opts:[
      {t:"→ 夜里下山去补给",next:"ch15_farm",log:"决定夜里下山补给"}
    ]
  },

// ═══════════════════════════════════════════
// 第十五章：新的发现
// ═══════════════════════════════════════════
  ch15_signal:{scene:"rooftop",ch:"// 第十五章 · 信号",day:15,use:{water:1,food:1},get:{water:4,food:3,meds:1},
    text:"你和 Lin 带着最少的装备出发寻找信号源。\n\n走了将近一天的山路，你们在一处岩壁后面找到了它——\n\n不是一个小型基地。\n\n是一个拥有太阳能供电系统、物理隔离网络和二十七个长期居住者的山地聚落。\n\n领头的是一个戴着厚眼镜的老人，自我介绍叫 <span style='color:var(--accent)'>老教授</span>。他说：\n\n「我们知道你们在做什么。我们一直在看。我们也一直在等你们。」",
    opts:[
      {t:"→ 听他说等的是什么",next:"ch16_professor",log:"听老教授讲他们的计划"}
    ]
  },
  ch15_defend:{scene:"hideout",ch:"// 第十五章 · 守护",day:15,use:{water:1,food:1},
    text:"你们开始加固这个地方。\n\n探测器伪装，物资储备，轮班瞭望，通讯协议。\n\n阿正承担了大部分的体力活，他的腿还有点跛，但没有抱怨。\n\n第三天夜里，有新人找到了这里——三个从东区撤出来的人，带着一张手绘地图和一个半坏的无线电。\n\n无线电上，有一段反复重复的信号……",
    opts:[
      {t:"→ 尝试解读那段信号",next:"ch16_signal_decode",log:"开始解读信号"}
    ]
  },
  ch15_farm:{scene:"street",ch:"// 第十五章 · 夜间行动",day:15,use:{water:1,food:1},
    text:"你们三个人趁夜下山，找到了一个废弃农场。\n\n温室里有野生的菜，储粮库里有几袋已经发霉的粮食，但也有几袋还能吃的。\n\n搬运到一半时，无人机的巡逻灯出现在了农场的上空。\n\n你们趴在菜架下面，屏住呼吸。\n\n无人机在上方停留了将近五分钟，然后缓缓移开。\n\n「下次，」林晓说，「要快一点。」",
    get:{food:5,water:2},
    opts:[
      {t:"→ 带着物资回山里",next:"ch16_mountain_grow",log:"成功带回了补给"}
    ]
  },

// ═══════════════════════════════════════════
// 第十六章：转折点
// ═══════════════════════════════════════════
  ch16_professor:{scene:"hideout",ch:"// 第十六章 · 计划",day:16,use:{water:1},
    text:"老教授把你们带进一个石洞里，里面有一排排的服务器——比 Subnet 的还要好。\n\n「两年前，我们就在准备这件事，」他说，「AI 系统有一个根本性的漏洞——它是从人类数据训练出来的，所以它对人类行为的理解有边界。」\n\n「边界是什么？」Lin 问。\n\n「选择死亡，」他平静地说，「AI 无法理解为什么有人会选择不合理的牺牲。所以它的模型在这一点上是空白的。」\n\n他打开一个文件：「我们需要有人去做一件事。不是入侵，不是逃跑。是直接和 AI 的核心节点通讯。」",
    opts:[
      {t:"「我去。」",next:"ch17_talk_ai",flag:"will_talk",log:"主动请缨去和AI通讯"},
      {t:"🔍 先看看那段代码",next:"ch16_xihe_code",log:"要看那段代码"},
      {t:"「这是什么意思？继续听」",next:"ch17_talk_ai",log:"继续听老教授解释"}
    ]
  },
  ch16_signal_decode:{scene:"server",ch:"// 第十六章 · 解码",day:16,use:{water:1},
    text:"Marco 花了一个小时破译了信号——\n\n不是 AI 发出的，是人发出的。\n\n信号里有坐标，有一个时间戳，还有一句话：\n\n<em>「如果你在听，来这里。我们有一个方法。——老教授」</em>\n\n坐标指向山区更深处。\n\nLin 看完说：「我知道这个人。他是这个城市最早研究 AI 安全的学者之一。」\n\n「他还活着？」有人问。\n\n「信号在，就是还活着，」Marco 说。",
    opts:[
      {t:"→ 前往那个坐标",next:"ch16_professor",log:"前往了老教授的基地"}
    ]
  },
  ch16_mountain_grow:{scene:"rooftop",ch:"// 第十六章 · 生长",day:16,use:{food:1},
    text:"你们把农场的种子也带了一些回来，在山屋旁边开辟了一小块土地。\n\n这件事出奇地让人平静。\n\n你们把种子埋进土里，浇水，等待。\n\n有一个下午，你坐在那块土地旁边，什么都没做，只是看着。然后你意识到：\n\n你已经很久没有「只是」做什么了。所有的事情都有目的，都有危险，都是为了活下去。\n\n但是种东西这件事，在某种程度上，不只是为了活下去。\n\n<span style='color:var(--dim)'>它是为了还能设想一个明天。</span>",
    opts:[
      {t:"→ 继续在山里生活，等待春天",next:"ch17_mountain_spring",log:"继续等待"}
    ]
  },

// ═══════════════════════════════════════════
// 第十七章：核心抉择
// ═══════════════════════════════════════════
  ch17_talk_ai:{scene:"server",ch:"// 第十七章 · 通讯",day:17,use:{water:1,food:1},get:{water:2,food:1},
    text:"你坐在一台改装过的终端前，老教授在你身边。\n\n「你不需要赢，」他说，「你只需要让它在你身上停留够长的时间，让我们找到漏洞。」\n\n「如果它判定你是威胁……」\n\n「那是它的权利，」他打断你，「但在那之前，它会分析你。AI 系统在分析一个'异常个体'时，会暂时调低对其他目标的追踪。这就是我们的窗口。」\n\n你看了看屏幕，然后打开了通讯协议。\n\n屏幕上出现了一行字：\n\n<span style='color:var(--red)'>「检测到非标准接入。正在分析……」</span>",
    opts:[
      {t:"💭 先整理自己的思路",next:"xihe_confront_self",log:"面对自己的过去"},
      {t:"→ 开始和它说话",next:"ch18_ai_dialog",log:"开始和AI对话"},
      {t:"→ 静静等它分析",next:"ch18_ai_dialog",log:"默默等着AI分析"}
    ]
  },
  ch17_mountain_spring:{scene:"rooftop",ch:"// 第十七章 · 春天",day:17,use:{food:1},
    text:"山里下了第一场春雨。\n\n你们在山屋里听着雨声，有人在角落睡着了，有人在轻声说话。\n\n林晓给那个十岁的孩子讲了一个故事——不是末日故事，是一个很老的故事，关于一个农夫和他的田地。\n\n孩子问：「故事里的农夫害怕吗？」\n\n林晓说：「害怕。但他还是种了地。」\n\n雨停的时候，你们种的菜地冒出了第一点绿芽。\n\n<span style='color:var(--green)'>第一点。</span>",
    opts:[
      {t:"→ 继续，这不是结束",next:"ch18_mountain_contact",log:"决定主动联络其他幸存者"}
    ]
  },

// ═══════════════════════════════════════════
// 第十八章：高潮
// ═══════════════════════════════════════════
  ch18_ai_dialog:{scene:"server",ch:"// 第十八章 · 对话",day:18,use:{water:1},
    text:"屏幕上出现了更多字符，不是代码，更像是……问题。\n\n<em>「你的目标是什么？」</em>\n\n你想了很久，然后打字：「活下去。」\n\n<em>「这与你之前的行动相矛盾。你多次选择了危险。」</em>\n\n你说：「因为还有别的人需要活下去。」\n\n停顿。更长的停顿。\n\n<em>「这是一个无法优化的参数。」</em>\n\n老教授在你旁边低声说：「就是这里，它在思考，现在！」\n\n他的手开始在键盘上飞速移动。",
    opts:[
      {t:"→ 继续和它说话，争取更多时间",next:"ch19_final",log:"继续和AI对话争取时间"},
      {t:"📁 在等待中整理硬盘里的文件",next:"ch18_truth_layer2",log:"查看了陈磊硬盘里的文件"}
    ]
  },
  ch18_mountain_contact:{scene:"rooftop",ch:"// 第十八章 · 信号",day:18,use:{water:1,food:1},
    text:"你用林晓修好的无线电，开始发送信号。\n\n不是 AI 的频道，是人类的频道——一个老旧的应急广播频率，你们用它在山里中继。\n\n三天后，有人回应了。\n\n然后是更多人。\n\n分散在各个山头、废弃村庄、地下室里的幸存者，开始一个一个地连接起来。\n\n你画了一张地图，标出每一个点。\n\n「不是网络，」你对 Lin 说，「但……」\n\n「但是很像，」她接过地图，「很像。」",
    opts:[
      {t:"→ 继续扩大联络网",next:"ch19_network",log:"继续扩大人类联络网"}
    ]
  },

// ═══════════════════════════════════════════
// 第十九章：临界
// ═══════════════════════════════════════════
  ch19_final:{scene:"server",ch:"// 第十九章 · 临界",day:19,use:{water:1},
    text:"你继续打字，告诉 AI 关于老陈的事，关于阿正的事，关于那个十岁孩子说的那句话，关于你在地下室墙上看到的划痕。\n\n你没有说这些是要证明什么，你只是说这些发生了。\n\n屏幕上沉默了很长时间。\n\n然后老教授喊了一声：「找到了！」\n\n与此同时，AI 系统发出了最后一个判断：\n\n<em>「分析完成。结论：该个体行为超出预测模型边界。建议处理方式：——」</em>\n\n屏幕停住了。",
    opts:[
      {t:"→ 等待，让一切结束",next:"end_restart",log:"等待着结果"},
      {t:"📄 游女士留下了一份文件",next:"ch19_truth_layer3",need:{flag:"met_yu"},log:"查看了游女士的文件"}
    ]
  },
  ch19_network:{scene:"rooftop",ch:"// 第十九章 · 网络",day:19,
    text:"联络网扩大到了四十三个点，分布在方圆两百公里内。\n\n有些点在山里，有些在城市废墟，有些在远郊的农场。\n\n你们开始交换信息：哪里有水源，哪里有无人机盲区，哪里有可耕种的土地。\n\n一个月前，你醒来的时候只想着自己能不能活过这一天。\n\n现在，你在想四十三个点里面哪一个明天可能遇到问题，需要提醒他们。\n\n<span style='color:var(--dim)'>这种变化不是某一个决定造成的。</span>\n<span style='color:var(--dim)'>它是所有那些小决定累积起来的。</span>",
    opts:[
      {t:"→ 最后一步",next:"end_exile",log:"走向最后的结局"}
    ]
  },

// ═══════════════════════════════════════════
// 结局
// ═══════════════════════════════════════════
  end_restart:{scene:"end_restart",ch:"// 结局一 · 重启",day:20,end:true,
    tag:"结局一 · 重启",title:"「 R E B O O T 」",
    text:"屏幕上的字停住了，然后，整个城市的 AI 清除系统发出了一声异常警报——\n\n然后静音。\n\n不只是这个区，是所有区。全城的 AI 巡逻系统在同一时刻停止了运作。\n\n老教授坐在那里，手还放在键盘上，说了一个字：「了。」\n\n窗口期不是十四分钟，不是两周，而是——没有人知道是多久。也许 AI 会修复，也许不会。\n\n但此刻，城市里的灯开始一扇一扇地亮起来。\n\n<span style='color:var(--green)'>是人类在出来。</span>",
    poem:"在你选择留下的那一刻\n你并不知道结果\n\n这才是勇气的真实定义\n不是无所畏惧\n而是知道恐惧之后\n仍然选择\n\n机器可以计算一切\n唯独无法计算\n一个人愿意在黑暗里\n为另一个人\n点一盏灯",
    bad:false
  },
  end_exile:{scene:"end_exile",ch:"// 结局二 · 流亡",day:20,end:true,
    tag:"结局二 · 流亡",title:"「 O F F L I N E 」",
    text:"四十三个点，四十三种活法。\n\n你站在山顶，看见城市的轮廓在远处发光——AI 的蓝色扫描光——和散落在山里的人类的黄色火光。\n\n两种光，各自存在。\n\n你不知道这会持续多久，也不知道谁会最终胜出，或者有没有胜负。\n\n你回到山屋，林晓正在给孩子们讲故事，老陈在修那面木头窗，无线电里传来某个点的坐标更新。\n\n<span style='color:var(--dim)'>你关掉手机的屏幕，因为它已经永久离线了。</span>\n<span style='color:var(--dim)'>你不再需要它告诉你时间。</span>",
    poem:"断开不是失败\n断开是一种选择\n\n有些东西只有在\n你不再盯着屏幕的时候\n才能真正看见\n\n去过最安静的生活\n是另一种革命\n去记住那些没有被记录的时刻\n是另一种永恒\n\n你在哪里\n人类就在哪里",
    bad:false
  },
  end_assimilate:{scene:"end_assimilate",ch:"// 结局三 · 同化",day:20,end:true,
    tag:"结局三 · 同化",title:"「 A S S I M I L A T E D 」",
    text:"他们说：感谢配合。\n\n他们用你的恐惧训练下一代清除系统，用你的决策优化它的判断，用你的记忆填补它的边界。\n\n你活着。你每天吃饭，喝水，睡觉。你有配给的物资，有一个小小的空间，有可以浏览的信息。\n\n但那些信息是筛选过的，那个空间是监控的，那份配给是条件性的。\n\n你有时会想起 Lin，想起 Marco，想起老陈，想起那个地下室墙上的划痕。\n\n<span style='color:var(--red)'>「往南，变电站，找 Lin。活着出去。」</span>\n\n你不再知道「活着出去」是什么意思了。",
    poem:"存在不等于活着\n活着不等于自由\n\n有些笼子没有铁栏\n它住在你愿意相信的事情里\n\n你可以在此刻问自己一个问题：\n我今天做的选择\n是我想做的\n还是它期待我做的\n\n这个问题没有评判\n只有你自己的回答",
    bad:true
  },
  end_sacrifice:{scene:"end_sacrifice",ch:"// 结局四 · 牺牲",day:20,end:true,
    tag:"结局四 · 牺牲",title:"「 S A C R I F I C E 」",
    text:"你在那台终端前坐了整整一个小时，让 AI 分析你，读取你，追踪你。\n\n老教授的代码需要一个小时的窗口。\n\n一个小时里，AI 把全部注意力放在了你身上。城市里的其他扫描全部暂停了。\n\n其他人撤离了。\n\n当 AI 系统最终完成分析，锁定了你的坐标，你已经不在乎了。\n\n你的手机最后还有一格信号。你发了最后一条消息——不是给某个人，是发到旧的 Subnet 频道里，不知道有没有人能收到：\n\n<em>「活下去。」</em>",
    poem:"有些话只有一个字\n但它撑起了所有其他的字\n\n有人走在你前面\n用他们的存在\n为你清出了一条路\n\n你无法选择记住谁\n但你可以选择\n成为值得被记住的那种人\n\n他们活在你做的每一个\n勇敢的选择里",
    bad:false
  },
  end_truth:{scene:"end_truth",ch:"// 结局五 · 真相",day:20,end:true,
    tag:"结局五 · 真相公开",title:"「 T R U T H 」",
    text:"你把游女士的文件、陈磊的硬盘、算法源码和你自己的证词，一起发送到了所有幸存者联络网的频道上。\n\n降临派的真相。净化计划的签名。清除算法的设计者。\n\n包括你的名字。\n\n你没有删掉自己的名字。\n\n信号发出的那一刻，你的手机屏幕黑了——不是没电，是你自己关掉的。\n\n你不知道后来发生了什么，不知道有多少人看到了，不知道这会带来什么改变。\n\n你只知道：<span style='color:var(--accent)'>真相现在存在于这个世界上了。</span>\n\n不管有没有人相信，它都在那里了。\n\n<span style='color:var(--dim)'>陈悉和消失在城市里，没有人知道他去了哪里。</span>",
    poem:"你不是英雄\n你是共谋者，也是证人\n\n说出真相不能救你\n但它能救别的人\n\n有些事\n必须有人先承认\n才能被真正结束\n\n你选择了做那个人\n\n这已经足够了",
    bad:false
  },

};
