<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>断网 · OFFLINE</title>
<style>
:root{--bg:#0a0a0f;--panel:#111118;--border:#1e1e2e;--text:#c0caf5;--dim:#565f89;--accent:#7aa2f7;--red:#f7768e;--green:#9ece6a;--yellow:#e0af68;--warn:#ff0033;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
#phone{width:390px;min-height:700px;background:var(--panel);border:1px solid var(--border);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(122,162,247,0.08);}
/* Status bar */
#statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:var(--panel);font-size:11px;color:var(--dim);flex-shrink:0;}
#sb-left{display:flex;gap:8px;align-items:center;}
#sb-right{display:flex;gap:10px;align-items:center;}
.sig-dot{width:4px;height:4px;border-radius:50%;background:var(--dim);}
.sig-dot.on{background:var(--green);}
#battery-val{color:var(--yellow);}
#scan-timer{color:var(--red);font-weight:bold;}
/* Canvas scene */
#scene-wrap{flex-shrink:0;position:relative;}
#sceneImg{display:block;width:390px;height:180px;object-fit:cover;transition:opacity .4s;}
/* Main content */
#content{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
#chapter-title{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
#narrative{font-size:14px;line-height:2;color:var(--text);min-height:80px;white-space:pre-line;word-break:break-all;}
/* Choices */
#choices{display:flex;flex-direction:column;gap:8px;padding:0 20px 16px;}
.choice-btn{background:transparent;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;padding:12px 16px;text-align:left;cursor:pointer;border-radius:8px;transition:all .2s;position:relative;overflow:hidden;}
.choice-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(122,162,247,0.06);}
.choice-btn:hover::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(122,162,247,0.05),transparent);animation:glitch-scan .4s linear;}
/* Battery bar */
#batt-bar-wrap{padding:10px 20px 20px;flex-shrink:0;}
#batt-label{font-size:10px;color:var(--dim);margin-bottom:5px;}
#batt-bar{height:3px;background:var(--border);border-radius:2px;}
#batt-fill{height:100%;background:var(--green);border-radius:2px;transition:width .5s;}
/* Scan overlay */
#scan-overlay{display:none;position:absolute;inset:0;background:rgba(255,0,51,0.92);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#scan-overlay.active{display:flex;}
#scan-count{font-size:48px;font-weight:bold;color:#fff;}
#scan-msg{font-size:12px;color:rgba(255,255,255,0.8);letter-spacing:3px;animation:blink .5s infinite;}
#glitch-chars{font-size:11px;color:rgba(255,255,255,0.5);font-family:monospace;max-width:320px;text-align:center;word-break:break-all;}
/* Start / End screens */
#start-screen,#end-screen{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;z-index:50;}
#start-screen.hidden,#end-screen.hidden{display:none;}
.screen-title{font-size:22px;color:var(--accent);letter-spacing:4px;text-align:center;}
.screen-sub{font-size:11px;color:var(--dim);text-align:center;line-height:1.8;}
.big-btn{background:var(--accent);color:var(--bg);border:none;font-family:inherit;font-size:14px;font-weight:bold;padding:14px 32px;border-radius:8px;cursor:pointer;letter-spacing:2px;}
.big-btn:hover{opacity:.85;}
#end-title{font-size:18px;font-weight:bold;text-align:center;}
#end-body{font-size:12px;color:var(--dim);text-align:center;line-height:1.9;}
/* Animations */
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes glitch-scan{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
@keyframes flicker{0%,100%{opacity:1;}92%{opacity:.95;}93%{opacity:.5;}94%{opacity:1;}}
#phone.danger{animation:flicker 2s infinite;}
/* Scrollbar */
#content::-webkit-scrollbar{width:3px;}
#content::-webkit-scrollbar-thumb{background:var(--border);}
/* Notification card */
.notif-card{background:rgba(30,30,46,0.9);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;}
.notif-card .notif-app{color:var(--dim);font-size:10px;margin-bottom:4px;}
.notif-card .notif-body{color:var(--text);}
.notif-card.alert .notif-body{color:var(--red);}
</style>
</head>
<body>
<div id="phone">

<script>
// ── Audio ─────────────────────────────────────────────────────────
const AC = new (window.AudioContext||window.webkitAudioContext)();
function resume(){AC.resume();}
function tone(f,d,t='sine',v=0.1){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.start();o.stop(AC.currentTime+d);
}
function sfxType(){tone(800,0.02,'square',0.04);}
function sfxSelect(){tone(440,0.08);setTimeout(()=>tone(660,0.08),90);}
function sfxScan(){
  tone(200,0.5,'sawtooth',0.3);
  setTimeout(()=>tone(400,0.4,'sawtooth',0.25),200);
  setTimeout(()=>tone(150,0.8,'sawtooth',0.2),400);
}
function sfxEnd(good){
  if(good){tone(330,0.15);setTimeout(()=>tone(440,0.15),160);setTimeout(()=>tone(660,0.3),320);}
  else{tone(220,0.3,'sawtooth',0.3);setTimeout(()=>tone(110,0.6,'sawtooth',0.2),300);}
}
let ambientNode=null;
function startAmbient(){
  if(ambientNode)return;
  const buf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.015;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const g=AC.createGain();g.gain.value=0.3;
  src.connect(g);g.connect(AC.destination);
  src.start();ambientNode=src;
}

// ── Canvas scenes ────────────────────────────────────────────────
const sceneImg=document.getElementById('sceneImg');

const sceneMap={basement:'basement',street:'street',survivor:'survivor',server:'server',choice:'server',end_restart:'server',end_exile:'exile',end_assimilate:'assimilate'};
function drawScene(name){
  const file=sceneMap[name]||'basement';
  sceneImg.style.opacity='0';
  sceneImg.onload=()=>sceneImg.style.opacity='1';
  sceneImg.src='img/'+file+'.jpg';
  if(sceneImg.complete)sceneImg.style.opacity='1';
}

  const rl=cx.createRadialGradient(195,90,0,195,90,80);
  rl.addColorStop(0,'rgba(247,118,142,0.3)');rl.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=rl;cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(247,118,142,0.6)';cx.font='11px Courier New';cx.fillText('// 自我消融中...',12,170);
}

let gameStarted=false;

const story={
  ch1:{

    choices:[

    scene:'basement',

<em>「03:17 — 地铁 S 线还没封，往南走，找到废弃变电站，地下有人。信号关了，别用 4G。我不知道我还能不能出来。」</em>

消息时间：47天前。

你的手指停在屏幕上。陈磊。他知道有什么。

<span style="color:var(--yellow)">电量 -8%</span>`,

    text:`你在地下室里摸索。

找到：<span style="color:var(--green)">破旧背包 × 1</span>，<span style="color:var(--green)">矿泉水 × 2</span>，<span style="color:var(--yellow)">打火机（没气）</span>。

墙上用指甲刻着密密麻麻的字，有人在这里藏了很久。其中一行：

<em>「往南，变电站，找 Lin。信号关了才能活。」</em>

<span style="color:var(--yellow)">电量 -8%</span>`,

连上之前，你想起了某件事：听说只要连上任何网络，AI 定位系统会在 <span style="color:var(--red)">30 秒内</span>锁定你。

有人说这是谣言。

<span style="color:var(--red)">有人说那些人都死了。</span>

<span style="color:var(--yellow)">电量 -8%</span>`,

<span style="color:var(--yellow)">电量 -8%</span>`,

    ]
  },
  ch3_street:{
    scene:'street',
    chapter:'// 第二章 · 静默区',
    text:`街道比你想象的更空。

偶尔能看到痕迹——翻倒的自行车，地上一只落单的鞋，玻璃上用红色喷漆写着：<span style="color:var(--red)">「别出声」</span>。

南边，你能隐约看到一座锈迹斑斑的变电站铁塔。

但就在你踏出第二步时，头顶传来低沉的嗡鸣。

无人机。

<span style="color:var(--yellow)">电量 -8%</span>`,
    choices:[
      {text:'🏃 冲进最近建筑',next:'ch4'},
      {text:'🧱 原地蹲下不动',next:'ch4_stealth'}
    ]
  },
  ch4:{
    scene:'survivor',
    chapter:'// 第三章 · 陌生人',
    text:`你冲进商店，跌倒在货架残骸里。

黑暗中，<span style="color:var(--accent)">一束手电筒光</span>打在你脸上。

沉默。五秒。

光稍微低了一点，你看见了光源后的人：一个二十多岁的女人，头发乱，眼睛里有一种你认识的东西——<em>疲惫但还没死</em>。

她说：<span style="color:var(--accent)">「你有信号吗？」</span>

<span style="color:var(--yellow)">电量 -8%</span>`,

  ch4_stealth:{
    scene:'survivor',

    text:`你贴着墙，一动不动，屏住呼吸。

无人机的红灯扫过去，停顿——然后继续前进。

你长呼一口气。

「做得好。」

你几乎跳起来。声音来自右边的门洞里——一个女人，用极小的声音说话，眼神锐利地扫了你一眼，又扫了无人机离去的方向。

<span style="color:var(--accent)">「你是第一次出来？跟我来，别开手机。」</span>

<span style="color:var(--yellow)">电量 -8%</span>`,

三秒后，无人机的红灯改变了扫描方向——<span style="color:var(--red)">对准你</span>。

背后传来警报声：<em>「生物特征识别中...」</em>

<span style="color:var(--yellow)">电量 -8%</span>`,

<span style="color:var(--accent)">「找 Lin，她有一半，你有一半。」</span>

<span style="color:var(--yellow)">电量 -8%</span>`,

// ── Typewriter ────────────────────────────────────────────────────
let typing=false;
function typeText(el,html,cb){
  if(typeTimeout)clearTimeout(typeTimeout);
  typing=true;
  // Split by tags to preserve HTML
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const plain=tmp.innerHTML.replace(/\n/g,'<br>');
  el.innerHTML='';
  let i=0;
  let inTag=false;
  function next(){
    if(i>=plain.length){typing=false;if(cb)cb();return;}
    if(plain[i]==='<')inTag=true;
    if(inTag){
      // find end of tag
      const end=plain.indexOf('>',i);
      el.innerHTML=plain.substring(0,end+1);
      i=end+1;inTag=false;
    } else {
      i++;
      el.innerHTML=plain.substring(0,i);
    }
    sfxType();
    typeTimeout=setTimeout(next,plain[i-1]==='\n'?80:18);
  }
  next();
}

// ── UI helpers ────────────────────────────────────────────────────
function setBattery(v){
  battery=Math.max(0,v);
  document.getElementById('battery-val').textContent=battery+'%';
  document.getElementById('batt-fill').style.width=battery+'%';
  document.getElementById('batt-fill').style.background=battery>30?'var(--green)':battery>15?'var(--yellow)':'var(--red)';
  if(battery<=0) triggerGameOver();
}

function setSignal(n){
  for(let i=1;i<=3;i++)document.getElementById('s'+i).className='sig-dot'+(i<=n?' on':'');
}

function showNotif(type,app,body){
  const na=document.getElementById('notif-area');
  na.innerHTML=`<div class="notif-card ${type}"><div class="notif-app">${app}</div><div class="notif-body">${body}</div></div>`;
}

function renderChoices(choices){
  const div=document.getElementById('choices');
  div.innerHTML='';
  if(!choices)return;
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';btn.textContent=c.text;
    btn.onclick=()=>{
      if(typing){return;}
      resume();sfxSelect();
      setBattery(battery-8);
      if(c.scanNow)triggerScan(()=>goTo(c.next));
      else goTo(c.next);
    };
    div.appendChild(btn);
  });
}

// ── Navigation ────────────────────────────────────────────────────
function goTo(id){
  const node=story[id];
  if(!node)return;
  document.getElementById('chapter-title').textContent=node.chapter;
  document.getElementById('notif-area').innerHTML='';
  drawScene(node.scene||'basement');
  renderChoices(null);
  const narr=document.getElementById('narrative');
  typeText(narr,node.text,()=>{
    if(node.notif)showNotif(node.notif.type,node.notif.app,node.notif.body);
    if(node.isEnd){
      setTimeout(()=>showEnd(node),1200);
    } else {
      renderChoices(node.choices);
    }
  });
  // Danger mode on end_assimilate
  document.getElementById('phone').className=id==='end_assimilate'?'danger':'';
}

function showEnd(node){
  sfxEnd(!node.bad);
  const es=document.getElementById('end-screen');
  document.getElementById('end-tag').textContent='// '+node.endTag;
  document.getElementById('end-title').textContent=node.endTitle;
  document.getElementById('end-title').style.color=node.bad?'var(--red)':node.endTag.includes('流亡')?'var(--dim)':'var(--green)';
  document.getElementById('end-body').textContent=node.endBody;
  es.classList.remove('hidden');
  clearInterval(scanInterval);
}

// ── Scan system ───────────────────────────────────────────────────
let scanCooldown=false;
function triggerScan(cb){
  if(scanCooldown)return cb&&cb();
  scanCooldown=true;
  setTimeout(()=>scanCooldown=false,5000);
  scanCount++;
  sfxScan();
  const ov=document.getElementById('scan-overlay');
  ov.classList.add('active');
  const countEl=document.getElementById('scan-count');
  const glitch=document.getElementById('glitch-chars');
  const chars='▓▒░█▄▌▐▀0101AGI SCAN消除定位人类威胁生物识别';
  let t=3;
  countEl.textContent=t;
  const gi=setInterval(()=>{
    let s='';for(let i=0;i<60;i++)s+=chars[Math.floor(Math.random()*chars.length)];
    glitch.textContent=s;
  },80);
  const ci=setInterval(()=>{
    t--;countEl.textContent=t;
    if(t<=0){
      clearInterval(ci);clearInterval(gi);
      ov.classList.remove('active');
      if(scanCount>=3){triggerGameOver();}
      else{if(cb)cb();}
    }
  },1000);
}

function startScanTimer(){
  let t=30;
  document.getElementById('scan-timer').textContent='SCAN: '+t+'s';
  scanInterval=setInterval(()=>{
    t--;
    document.getElementById('scan-timer').textContent='SCAN: '+t+'s';
    if(t<=0){
      t=30;
      triggerScan(null);
    }
  },1000);
}

// ── Game over ─────────────────────────────────────────────────────
function triggerGameOver(){
  clearInterval(scanInterval);
  const es=document.getElementById('end-screen');
  document.getElementById('end-tag').textContent='// 游戏结束';
  document.getElementById('end-title').textContent=battery<=0?'「BATTERY DEAD」':'「CAPTURED」';
  document.getElementById('end-title').style.color='var(--red)';
  document.getElementById('end-body').textContent=battery<=0?'手机电量耗尽。\n在这个世界，断电意味着消失。\n你的坐标从所有人的记忆中抹去。':'AI 扫描 3 次，已锁定你的生物特征。\n清除无人机已出发。\n你没能逃脱。';
  es.classList.remove('hidden');
  sfxEnd(false);
}

// ── Start / Restart ───────────────────────────────────────────────
function startGame(){
  resume();startAmbient();
  document.getElementById('start-screen').classList.add('hidden');
  battery=73;scanCount=0;
  setBattery(73);setSignal(0);
  // clock flicker
  const tc=document.getElementById('time-disp');
  tc.textContent='ERROR';
  let flicks=0;
  const fi=setInterval(()=>{
    flicks++;
    tc.textContent=flicks%2===0?'ERROR':Math.floor(Math.random()*24)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0');
    if(flicks>8){clearInterval(fi);tc.textContent='ERROR';}
  },200);
  gameStarted=true;
  startScanTimer();
  goTo('ch1');
}

function restartGame(){
  document.getElementById('end-screen').classList.add('hidden');
  document.getElementById('phone').className='';
  clearInterval(scanInterval);
  battery=73;scanCount=0;
  setBattery(73);setSignal(0);
  startScanTimer();
  goTo('ch1');
}

// Init
drawScene('basement');
</script>
