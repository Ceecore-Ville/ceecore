<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PULSE · 脉冲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #080810;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  #wrapper {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
  }
  #gameCanvas {
    display: block;
    image-rendering: pixelated;
  }
  /* Scanline overlay */
  #scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 10;
  }
  /* Mobile controls */
  #mobile-controls {
    display: none;
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
  }
  .dpad { position: relative; width: 120px; height: 120px; }
  .dpad-btn {
    position: absolute;
    width: 36px; height: 36px;
    background: rgba(122,162,247,0.15);
    border: 1px solid rgba(122,162,247,0.3);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: #7aa2f7; font-size: 14px;
    cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active { background: rgba(122,162,247,0.35); }
  #btn-up    { top: 0;   left: 42px; }
  #btn-down  { bottom: 0; left: 42px; }
  #btn-left  { top: 42px; left: 0; }
  #btn-right { top: 42px; right: 0; }

  @media (max-width: 600px), (pointer: coarse) {
    #mobile-controls { display: block; }
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="scanlines"></div>
  <div id="mobile-controls">
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn" id="btn-down">▼</div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const CFG = {
  tileSize: 24,
  cols: 21,
  rows: 21,
  playerSpeed: 1,       // tiles per move
  baseInterval: 220,    // ms between enemy spawns
  minInterval: 60,
  speedUp: 3,           // ms faster per second
  nodeCount: 5,
  nodeScore: 10,
  survivalScore: 1,     // per 0.5s
  // colors
  bg: '#080810',
  gridLine: '#13132a',
  playerColor: '#c0d8ff',
  playerGlow: '#7aa2f7',
  enemyColor: '#ff6b7a',
  enemyGlow: '#f7768e',
  nodeColor: '#9ece6a',
  nodeGlow: '#c3e88d',
  trailColor: 'rgba(122,162,247,0.18)',
  textColor: '#c0caf5',
  dimColor: '#4a5080',
  accentColor: '#7aa2f7',
};

// ── CANVAS SETUP ─────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight - (isMobile() ? 140 : 0);
  const tileW = Math.floor(Math.min(maxW, maxH) / CFG.cols);
  const tileH = tileW;
  const W = tileW * CFG.cols;
  const H = tileH * CFG.rows;
  canvas.width = W;
  canvas.height = H;
  CFG._tile = tileW;
  CFG._W = W;
  CFG._H = H;
  document.getElementById('wrapper').style.width = W + 'px';
  document.getElementById('wrapper').style.height = (H + (isMobile() ? 140 : 0)) + 'px';
}
function isMobile() {
  return window.innerWidth <= 600 || window.matchMedia('(pointer: coarse)').matches;
}
window.addEventListener('resize', () => { resize(); if (state) draw(); });
resize();

// ── GAME STATE ────────────────────────────────────────────────────────────
let state = null;
let animId = null;
let lastTime = 0;
let spawnTimer = 0;
let scoreTimer = 0;
let currentInterval = CFG.baseInterval;
let keys = {};

function createState() {
  currentInterval = CFG.baseInterval;
  const cx = Math.floor(CFG.cols / 2);
  const cy = Math.floor(CFG.rows / 2);
  return {
    phase: 'title',   // title | playing | dead
    player: { x: cx, y: cy },
    trail: [],
    enemies: [],
    nodes: [],
    score: 0,
    best: parseInt(localStorage.getItem('pulse_best') || '0'),
    deadTimer: 0,
    flashAlpha: 0,
  };
}

// ── NODE SPAWNING ─────────────────────────────────────────────────────────
function spawnNodes(s) {
  s.nodes = [];
  while (s.nodes.length < CFG.nodeCount) {
    const x = 1 + Math.floor(Math.random() * (CFG.cols - 2));
    const y = 1 + Math.floor(Math.random() * (CFG.rows - 2));
    if (Math.abs(x - s.player.x) < 3 && Math.abs(y - s.player.y) < 3) continue;
    if (s.nodes.find(n => n.x === x && n.y === y)) continue;
    s.nodes.push({ x, y, pulse: Math.random() * Math.PI * 2 });
  }
}

// ── ENEMY TYPES ───────────────────────────────────────────────────────────
// Enemies move tile-by-tile toward player with slight randomness
function spawnEnemy(s) {
  // Spawn from edge
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.floor(Math.random() * CFG.cols); y = 0; }
  else if (side === 1) { x = CFG.cols - 1; y = Math.floor(Math.random() * CFG.rows); }
  else if (side === 2) { x = Math.floor(Math.random() * CFG.cols); y = CFG.rows - 1; }
  else { x = 0; y = Math.floor(Math.random() * CFG.rows); }
  s.enemies.push({ x, y, moveTimer: 0, moveInterval: 180 + Math.floor(Math.random() * 120) });
}

function moveEnemies(s, dt) {
  for (const e of s.enemies) {
    e.moveTimer += dt;
    if (e.moveTimer >= e.moveInterval) {
      e.moveTimer = 0;
      // Move toward player with 80% chance, random 20%
      let dx = s.player.x - e.x;
      let dy = s.player.y - e.y;
      let mx = 0, my = 0;
      if (Math.random() < 0.8) {
        if (Math.abs(dx) >= Math.abs(dy)) { mx = dx > 0 ? 1 : -1; }
        else { my = dy > 0 ? 1 : -1; }
      } else {
        // random cardinal
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        const d = dirs[Math.floor(Math.random() * 4)];
        mx = d[0]; my = d[1];
      }
      const nx = Math.max(0, Math.min(CFG.cols - 1, e.x + mx));
      const ny = Math.max(0, Math.min(CFG.rows - 1, e.y + my));
      e.x = nx; e.y = ny;
    }
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.key] = true;
  handleKey(e.key);
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Mobile dpad
['up','down','left','right'].forEach(dir => {
  const btn = document.getElementById('btn-' + dir);
  if (!btn) return;
  const keyMap = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
  btn.addEventListener('touchstart', e => { e.preventDefault(); handleKey(keyMap[dir]); }, { passive: false });
  btn.addEventListener('mousedown', e => { e.preventDefault(); handleKey(keyMap[dir]); });
});

// Touch swipe
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    handleKey(' ');
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) {
    handleKey(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
  } else {
    handleKey(dy > 0 ? 'ArrowDown' : 'ArrowUp');
  }
});

function handleKey(k) {
  if (!state) return;
  if (state.phase === 'title') {
    state.phase = 'playing';
    spawnNodes(state);
    lastTime = performance.now();
    return;
  }
  if (state.phase === 'dead') {
    if (state.deadTimer > 600) {
      if (k === 'r' || k === 'R' || k === ' ' || k === 'Enter' ||
          k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
        state = createState();
        state.phase = 'playing';
        spawnNodes(state);
        lastTime = performance.now();
        spawnTimer = 0;
        scoreTimer = 0;
      }
    }
    return;
  }
  if (state.phase !== 'playing') return;

  const p = state.player;
  let nx = p.x, ny = p.y;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') ny--;
  else if (k === 'ArrowDown'  || k === 's' || k === 'S') ny++;
  else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') nx--;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') nx++;
  else return;

  nx = Math.max(0, Math.min(CFG.cols - 1, nx));
  ny = Math.max(0, Math.min(CFG.rows - 1, ny));

  // Trail
  state.trail.unshift({ x: p.x, y: p.y, alpha: 1 });
  if (state.trail.length > 8) state.trail.pop();

  p.x = nx; p.y = ny;

  // Collect node
  const ni = state.nodes.findIndex(n => n.x === nx && n.y === ny);
  if (ni !== -1) {
    state.score += CFG.nodeScore;
    state.nodes.splice(ni, 1);
    if (state.nodes.length === 0) spawnNodes(state);
    else {
      // spawn one replacement
      let attempts = 0;
      while (attempts++ < 20) {
        const x = 1 + Math.floor(Math.random() * (CFG.cols - 2));
        const y = 1 + Math.floor(Math.random() * (CFG.rows - 2));
        if (Math.abs(x - p.x) < 2 && Math.abs(y - p.y) < 2) continue;
        if (state.nodes.find(n => n.x === x && n.y === y)) continue;
        state.nodes.push({ x, y, pulse: Math.random() * Math.PI * 2 });
        break;
      }
    }
  }
}

// ── COLLISION ─────────────────────────────────────────────────────────────
function checkCollision(s) {
  const p = s.player;
  for (const e of s.enemies) {
    if (e.x === p.x && e.y === p.y) return true;
  }
  return false;
}

// ── GAME LOOP ─────────────────────────────────────────────────────────────
function loop(ts) {
  animId = requestAnimationFrame(loop);
  const dt = Math.min(ts - lastTime, 100);
  lastTime = ts;

  if (!state) { draw(); return; }

  if (state.phase === 'playing') {
    // Survival score
    scoreTimer += dt;
    if (scoreTimer >= 500) {
      state.score += CFG.survivalScore;
      scoreTimer -= 500;
    }

    // Speed up
    currentInterval = Math.max(CFG.minInterval, CFG.baseInterval - (ts / 1000) * CFG.speedUp * 3);

    // Spawn enemies
    spawnTimer += dt;
    if (spawnTimer >= currentInterval) {
      spawnTimer -= currentInterval;
      spawnEnemy(state);
    }

    // Move enemies
    moveEnemies(state, dt);

    // Collision check
    if (checkCollision(state)) {
      state.phase = 'dead';
      state.deadTimer = 0;
      state.flashAlpha = 1;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem('pulse_best', state.score);
      }
    }

    // Update trail alpha
    for (const t of state.trail) t.alpha *= 0.85;

    // Update node pulse
    for (const n of state.nodes) n.pulse += 0.05;
  }

  if (state.phase === 'dead') {
    state.deadTimer += dt;
    state.flashAlpha = Math.max(0, state.flashAlpha - 0.04);
  }

  draw();
}

// ── DRAW ──────────────────────────────────────────────────────────────────
function draw() {
  const T = CFG._tile || 24;
  const W = CFG._W || canvas.width;
  const H = CFG._H || canvas.height;

  // Background
  ctx.fillStyle = CFG.bg;
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = CFG.gridLine;
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= CFG.cols; c++) {
    ctx.beginPath(); ctx.moveTo(c * T, 0); ctx.lineTo(c * T, H); ctx.stroke();
  }
  for (let r = 0; r <= CFG.rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * T); ctx.lineTo(W, r * T); ctx.stroke();
  }

  if (!state) return;

  if (state.phase === 'title') {
    drawTitle(T, W, H);
    return;
  }

  // Trail
  for (let i = 0; i < state.trail.length; i++) {
    const t = state.trail[i];
    const a = t.alpha * (1 - i * 0.1);
    ctx.fillStyle = `rgba(122,162,247,${a * 0.4})`;
    const pad = T * 0.25;
    ctx.fillRect(t.x * T + pad, t.y * T + pad, T - pad * 2, T - pad * 2);
  }

  // Energy nodes
  for (const n of state.nodes) {
    const cx2 = n.x * T + T / 2;
    const cy2 = n.y * T + T / 2;
    const pulse = 0.5 + 0.5 * Math.sin(n.pulse);
    const r = T * 0.18 + pulse * T * 0.06;

    ctx.shadowBlur = 10 + pulse * 6;
    ctx.shadowColor = CFG.nodeGlow;
    ctx.fillStyle = CFG.nodeColor;
    ctx.beginPath(); ctx.arc(cx2, cy2, r, 0, Math.PI * 2); ctx.fill();

    // Outer ring
    ctx.strokeStyle = `rgba(156,206,106,${0.3 + pulse * 0.3})`;
    ctx.lineWidth = 0.5;
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(cx2, cy2, T * 0.38, 0, Math.PI * 2); ctx.stroke();
  }

  // Enemies
  ctx.shadowBlur = 0;
  for (const e of state.enemies) {
    const ex = e.x * T + T * 0.15;
    const ey = e.y * T + T * 0.15;
    const es = T * 0.7;
    ctx.shadowBlur = 8;
    ctx.shadowColor = CFG.enemyGlow;
    ctx.fillStyle = CFG.enemyColor;
    ctx.fillRect(ex, ey, es, es);
    // Inner darker square
    ctx.fillStyle = '#cc3344';
    const p2 = T * 0.28;
    ctx.fillRect(e.x * T + p2, e.y * T + p2, T - p2 * 2, T - p2 * 2);
  }

  // Player
  ctx.shadowBlur = 0;
  const px = state.player.x * T;
  const py = state.player.y * T;
  // Glow layers
  const glowSizes = [20, 12, 6];
  const glowAlphas = [0.2, 0.35, 0.6];
  for (let i = 0; i < glowSizes.length; i++) {
    ctx.shadowBlur = glowSizes[i];
    ctx.shadowColor = CFG.playerGlow;
    const inset = T * (0.05 + i * 0.04);
    ctx.fillStyle = `rgba(192,216,255,${glowAlphas[i]})`;
    ctx.fillRect(px + inset, py + inset, T - inset * 2, T - inset * 2);
  }
  ctx.shadowBlur = 0;
  // Solid core
  const pad = T * 0.2;
  ctx.fillStyle = CFG.playerColor;
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ffffff';
  ctx.fillRect(px + pad, py + pad, T - pad * 2, T - pad * 2);
  ctx.shadowBlur = 0;

  // HUD
  drawHUD(T, W, H);

  // Death flash
  if (state.flashAlpha > 0) {
    ctx.fillStyle = `rgba(247,118,142,${state.flashAlpha * 0.4})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Game over
  if (state.phase === 'dead' && state.deadTimer > 300) {
    drawGameOver(T, W, H);
  }
}

function drawTitle(T, W, H) {
  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,8,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  const titleSize = Math.floor(T * 2.2);
  ctx.textAlign = 'center';

  // PULSE title
  ctx.shadowBlur = 30;
  ctx.shadowColor = CFG.playerGlow;
  ctx.fillStyle = CFG.playerColor;
  ctx.font = `bold ${titleSize}px 'Courier New', monospace`;
  ctx.fillText('PULSE', W / 2, H * 0.38);

  // Subtitle
  ctx.shadowBlur = 0;
  ctx.fillStyle = CFG.dimColor;
  ctx.font = `${Math.floor(T * 0.55)}px 'Courier New', monospace`;
  ctx.fillText('· 脉冲 ·', W / 2, H * 0.38 + titleSize * 0.7);

  // Blink prompt
  const blink = Math.floor(performance.now() / 600) % 2 === 0;
  if (blink) {
    ctx.fillStyle = CFG.accentColor;
    ctx.font = `${Math.floor(T * 0.52)}px 'Courier New', monospace`;
    ctx.fillText('PRESS ANY KEY TO START', W / 2, H * 0.6);
  }

  // Controls hint
  ctx.fillStyle = CFG.dimColor;
  ctx.font = `${Math.floor(T * 0.42)}px 'Courier New', monospace`;
  ctx.fillText('WASD / ARROW KEYS · AVOID RED · COLLECT GREEN', W / 2, H * 0.72);

  ctx.shadowBlur = 0;
}

function drawHUD(T, W, H) {
  const fontSize = Math.floor(T * 0.5);
  ctx.font = `${fontSize}px 'Courier New', monospace`;
  ctx.shadowBlur = 0;

  // Score (left)
  ctx.textAlign = 'left';
  ctx.fillStyle = CFG.dimColor;
  ctx.fillText('SCORE', T * 0.4, T * 0.75);
  ctx.fillStyle = CFG.textColor;
  ctx.font = `bold ${Math.floor(T * 0.6)}px 'Courier New', monospace`;
  ctx.fillText(String(state.score).padStart(6, '0'), T * 0.4, T * 1.35);

  // Best (right)
  ctx.textAlign = 'right';
  ctx.font = `${fontSize}px 'Courier New', monospace`;
  ctx.fillStyle = CFG.dimColor;
  ctx.fillText('BEST', W - T * 0.4, T * 0.75);
  ctx.fillStyle = '#e0af68';
  ctx.font = `bold ${Math.floor(T * 0.6)}px 'Courier New', monospace`;
  ctx.fillText(String(state.best).padStart(6, '0'), W - T * 0.4, T * 1.35);

  ctx.textAlign = 'center';
}

function drawGameOver(T, W, H) {
  // Overlay
  ctx.fillStyle = 'rgba(8,8,16,0.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  const titleSize = Math.floor(T * 1.6);

  ctx.shadowBlur = 20;
  ctx.shadowColor = CFG.enemyGlow;
  ctx.fillStyle = CFG.enemyColor;
  ctx.font = `bold ${titleSize}px 'Courier New', monospace`;
  ctx.fillText('GAME OVER', W / 2, H * 0.36);
  ctx.shadowBlur = 0;

  // Score
  ctx.fillStyle = CFG.textColor;
  ctx.font = `${Math.floor(T * 0.65)}px 'Courier New', monospace`;
  ctx.fillText(`SCORE  ${String(state.score).padStart(6, '0')}`, W / 2, H * 0.50);

  if (state.score >= state.best) {
    ctx.fillStyle = '#e0af68';
    ctx.font = `${Math.floor(T * 0.5)}px 'Courier New', monospace`;
    ctx.fillText('✦ NEW BEST ✦', W / 2, H * 0.58);
  } else {
    ctx.fillStyle = CFG.dimColor;
    ctx.font = `${Math.floor(T * 0.5)}px 'Courier New', monospace`;
    ctx.fillText(`BEST  ${String(state.best).padStart(6, '0')}`, W / 2, H * 0.58);
  }

  // Restart prompt
  const blink = Math.floor(performance.now() / 600) % 2 === 0;
  if (blink) {
    ctx.fillStyle = CFG.accentColor;
    ctx.font = `${Math.floor(T * 0.52)}px 'Courier New', monospace`;
    ctx.fillText('[ R ] RESTART', W / 2, H * 0.72);
  }

  ctx.shadowBlur = 0;
}

// ── INIT ──────────────────────────────────────────────────────────────────
state = createState();
animId = requestAnimationFrame(loop);
</script>
</body>
</html>
