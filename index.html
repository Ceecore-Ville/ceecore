<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>高考模拟器</title>
<style>
:root{
  --paper:#f0e8d2;--paper-alt:#e8dcc0;--paper-inner:rgba(255,255,255,.55);
  --ink:#1a1008;--ink-soft:#3a2a14;--ink-dim:#786244;
  --red:#c01818;--red-bg:rgba(192,24,24,.06);--red-border:#e8c0c0;
  --green:#1a3820;--green-bg:rgba(26,56,32,.06);--green-text:#d4ecd8;
  --gold:#8a6610;--gold-border:#c8a840;
  --border:#c4a870;--border-light:rgba(196,168,112,.4);
  --shadow:rgba(80,50,10,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;min-height:100svh;
  background:radial-gradient(ellipse 80% 80% at 50% 60%,#2e2010 0%,#0e0804 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","Heiti SC",sans-serif;
}
#app{
  width:min(460px,100vw);min-height:min(780px,100svh);
  background:var(--paper);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  box-shadow:0 2px 4px var(--shadow),0 16px 48px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.15);
}
/* Left margin red line (like Chinese exam paper) */
#app::before{
  content:'';position:absolute;top:0;bottom:0;left:22px;
  width:1px;background:rgba(192,24,24,.25);z-index:0;pointer-events:none;
}
/* Horizontal lines */
#app::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    180deg,transparent 0px,transparent 27px,
    rgba(100,130,200,.1) 27px,rgba(100,130,200,.1) 28px
  );
  pointer-events:none;z-index:0;
}

.screen{
  flex:1;display:flex;flex-direction:column;
  padding:24px 20px 24px 30px;
  position:relative;z-index:2;overflow-y:auto;
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen::-webkit-scrollbar{width:3px}
.screen::-webkit-scrollbar-thumb{background:var(--border-light)}

/* ─── TITLE SCREEN SPECIFIC ─── */
.title-cover{
  background:var(--green);margin:-24px -20px 0 -30px;
  padding:20px 24px 18px 32px;
  border-bottom:3px solid var(--gold-border);
  flex-shrink:0;
}
.cover-top{font-size:10px;letter-spacing:3px;color:rgba(212,236,216,.6);margin-bottom:6px}
.cover-main{
  font-size:44px;font-weight:900;color:#fff;
  letter-spacing:10px;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}
.cover-sub{font-size:12px;letter-spacing:4px;color:rgba(212,236,216,.7);margin-top:6px}
.title-seal{
  width:70px;height:70px;border-radius:50%;
  border:3px solid var(--red);position:relative;
  display:flex;align-items:center;justify-content:center;
  margin:20px auto 16px;flex-shrink:0;
  background:var(--red-bg);
}
.title-seal::before{
  content:'';position:absolute;inset:4px;border-radius:50%;
  border:1px solid rgba(192,24,24,.3);
}
.title-seal-text{
  font-size:18px;font-weight:900;color:var(--red);letter-spacing:3px;
  font-family:"STSong","SimSun","Songti SC",serif;
}

/* ─── TYPOGRAPHY ─── */
.kicker{font-size:10px;letter-spacing:3px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase}
h1{font-size:42px;color:var(--ink);letter-spacing:6px;line-height:1;margin-bottom:4px;font-weight:900;
  font-family:"STSong","SimSun","Songti SC",serif;}
h2{font-size:21px;color:var(--ink);letter-spacing:2px;margin-bottom:14px;font-weight:700;
  font-family:"STSong","SimSun","Songti SC",serif;}
p{font-size:13.5px;color:var(--ink-soft);line-height:2.1;margin-bottom:10px}
.dim{color:var(--ink-dim);font-size:11px}
.red{color:var(--red)}.green{color:var(--green)}.center{text-align:center}.bold{font-weight:700}

/* ─── STAMP ─── */
.stamp{
  display:inline-flex;align-items:center;padding:4px 12px;
  border:2px solid var(--red);color:var(--red);
  font-size:12px;letter-spacing:2px;transform:rotate(-2deg);
  background:var(--red-bg);font-weight:700;white-space:nowrap;
  font-family:"STSong","SimSun",serif;position:relative;
}
.stamp::before,.stamp::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:var(--red);opacity:.5;
}
.stamp::before{top:-3px;left:-3px}.stamp::after{bottom:-3px;right:-3px}
.stamp-ok{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.stamp-ok::before,.stamp-ok::after{background:var(--green)}

/* ─── BUTTONS ─── */
.btn{
  display:block;width:100%;padding:12px 18px;
  background:transparent;border:1px solid var(--border);
  color:var(--ink);font-size:13.5px;font-family:inherit;
  cursor:pointer;text-align:left;transition:all .15s;border-radius:1px;line-height:1.7;
}
.btn:hover,.btn:active{background:var(--paper-alt);border-color:var(--ink)}
.btn-primary{
  background:var(--green);border-color:var(--green);color:var(--green-text);
  text-align:center;letter-spacing:3px;font-size:14px;font-weight:500;padding:14px;
}
.btn-primary:hover{background:#264830}
.btn-primary:disabled{opacity:.3;pointer-events:none}

/* ─── ANSWER CHOICE BUTTONS ─── */
.btn-list{display:flex;flex-direction:column;gap:8px;width:100%}
.btn-opt{
  display:flex;align-items:flex-start;gap:0;
  background:rgba(255,255,255,.5);border:1px solid var(--border-light);
  color:var(--ink-soft);font-size:13px;font-family:inherit;
  cursor:pointer;text-align:left;transition:all .15s;
  border-radius:1px;line-height:1.75;width:100%;overflow:hidden;
}
.btn-opt:hover,.btn-opt:active{background:rgba(255,255,255,.9);border-color:var(--border)}
.opt-letter{
  width:38px;min-width:38px;align-self:stretch;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  border-right:1px solid var(--border-light);
  color:var(--ink-dim);background:rgba(0,0,0,.03);
  transition:all .15s;flex-shrink:0;
}
.btn-opt:hover .opt-letter{background:var(--green);color:#fff;border-color:var(--green)}
.opt-text{padding:11px 14px;flex:1}

/* ─── CARDS ─── */
.card{
  background:rgba(255,255,255,.4);
  border:1px solid var(--border-light);border-radius:1px;
  padding:15px 18px;margin-bottom:14px;
}
.card-sm{
  background:rgba(255,255,255,.3);border:1px solid var(--border-light);
  padding:10px 14px;margin-bottom:10px;border-radius:1px;
}

/* ─── STATS ─── */
.stats-row{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border-light)}
.stat-box{flex:1;text-align:center;padding:10px 8px;border-right:1px solid var(--border-light)}
.stat-box:last-child{border-right:none}
.stat-label{font-size:10px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:900;font-family:"STSong","SimSun",serif}
.stat-bar-wrap{height:3px;background:var(--paper-alt);margin-top:5px;overflow:hidden}
.stat-bar-fill{height:100%;transition:width .5s}

/* ─── TIMELINE ─── */
.timeline{display:flex;align-items:center;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--border-light);flex-shrink:0}
.tl-dot.done{background:var(--gold)}
.tl-dot.current{background:var(--red);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--red)}
.progress-text{font-size:10px;color:var(--ink-dim);margin-left:5px;white-space:nowrap}

/* ─── EXAM PAPER ─── */
.exam-header{
  border-top:2.5px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:7px 0;margin-bottom:16px;
}
.exam-title{
  font-size:12px;color:var(--ink);text-align:center;letter-spacing:2px;font-weight:700;
  font-family:"STSong","SimSun",serif;
}
.exam-sub{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:3px;letter-spacing:.5px}
.q-block{
  border-left:3px solid var(--ink);padding:12px 16px;margin-bottom:14px;
  background:rgba(255,255,255,.35);
}
.q-num{font-size:10px;color:var(--ink-dim);letter-spacing:1.5px;margin-bottom:6px}
.q-text{font-size:14px;color:var(--ink);line-height:2.1;font-family:"STSong","SimSun",serif}

/* ─── PROVINCE/YEAR GRIDS ─── */
.province-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:16px;
  border:1px solid var(--border)}
.prov-btn{
  padding:14px 8px;background:transparent;
  border-right:1px solid var(--border);color:var(--ink);
  font-size:14px;font-family:"STSong","SimSun",serif;cursor:pointer;
  text-align:center;transition:all .15s;border-radius:0;font-weight:700;
  border-bottom:none;border-top:none;border-left:none;
}
.prov-btn:last-child{border-right:none}
.prov-btn:hover,.prov-btn.sel{background:var(--green);color:var(--green-text)}
.prov-sub{font-size:10px;margin-top:3px;font-weight:400;opacity:.8;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;
  border:1px solid var(--border)}
.year-btn{
  padding:13px;background:transparent;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  color:var(--ink);font-size:16px;font-family:"STSong","SimSun",serif;
  cursor:pointer;text-align:center;transition:all .15s;font-weight:700;
}
.year-btn:nth-child(2n){border-right:none}
.year-btn:nth-last-child(-n+2){border-bottom:none}
.year-btn:hover,.year-btn.sel{background:var(--red);color:#fff;border-color:var(--red)}
.year-btn.locked{opacity:.3;cursor:not-allowed}

/* ─── HOME MAP SCREEN ─── */
.home-screen{
  flex:1;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:var(--paper);
}
.home-header{
  background:var(--green);padding:16px 24px 14px 28px;
  border-bottom:3px solid var(--gold-border);flex-shrink:0;
}
.home-header .cover-top{font-size:10px;letter-spacing:3px;color:rgba(212,236,216,.6);margin-bottom:4px}
.home-header .cover-main{font-size:38px;font-weight:900;color:#fff;letter-spacing:8px;line-height:1}
.home-header .cover-sub{font-size:11px;letter-spacing:3px;color:rgba(212,236,216,.65);margin-top:5px}
.map-section{
  position:relative;flex-shrink:0;
  width:100%;overflow:hidden;
}
.map-section svg{
  display:block;width:100%;height:auto;
}
/* real svg map styles */
.china-svg{display:block;width:100%;height:auto}
.mp-dim{
  fill:rgba(26,56,32,.06);stroke:rgba(26,56,32,.22);stroke-width:0.4;
  pointer-events:none;
}
.mp-hi{
  fill:rgba(26,56,32,.12);stroke:rgba(26,56,32,.5);stroke-width:0.7;
  cursor:pointer;transition:fill .18s,stroke .18s;
}
.mp-hi:hover{fill:rgba(26,56,32,.28);stroke:rgba(26,56,32,.8)}
.mp-hi.sel{fill:rgba(192,24,24,.28);stroke:var(--red);stroke-width:1.1}
.mp-lbl{
  font-size:13px;fill:var(--ink-dim);pointer-events:none;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  text-anchor:middle;dominant-baseline:middle;font-weight:600;
}
.mp-lbl.sel{fill:var(--red)}
.home-bottom{
  flex:1;display:flex;flex-direction:column;
  padding:14px 20px 18px 28px;overflow-y:auto;
  position:relative;z-index:2;
}
.home-bottom::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0px,transparent 27px,rgba(100,130,200,.08) 27px,rgba(100,130,200,.08) 28px);
  pointer-events:none;
}
.home-bottom::after{
  content:'';position:absolute;top:0;bottom:0;left:22px;
  width:1px;background:rgba(192,24,24,.2);pointer-events:none;
}
.sel-prompt{
  font-size:11px;letter-spacing:2px;color:var(--ink-dim);
  margin-bottom:10px;position:relative;z-index:1;
}
.sel-prompt strong{color:var(--red)}
.year-row{
  display:flex;gap:0;flex-wrap:nowrap;
  border:1px solid var(--border);margin-bottom:12px;
  position:relative;z-index:1;
}
.year-chip{
  flex:1;padding:10px 4px;background:transparent;
  border-right:1px solid var(--border);
  color:var(--ink);font-size:13px;font-family:"STSong","SimSun",serif;
  cursor:pointer;text-align:center;transition:all .15s;font-weight:700;
  line-height:1.3;
}
.year-chip:last-child{border-right:none}
.year-chip:hover{background:rgba(192,24,24,.08);color:var(--red)}
.year-chip.sel{background:var(--red);color:#fff}
.year-chip.locked{opacity:.28;cursor:not-allowed;pointer-events:none}
.year-chip .yr-tag{font-size:8px;display:block;opacity:.7;font-family:"PingFang SC",sans-serif;margin-top:2px}
.home-actions{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.home-dim{font-size:10px;color:var(--ink-dim);text-align:center;letter-spacing:1px;margin-top:auto;padding-top:10px;position:relative;z-index:1}

/* ─── SCORE ─── */
.score-big{
  font-size:90px;font-weight:900;color:var(--ink);text-align:center;
  margin:12px 0 4px;letter-spacing:-4px;
  font-family:"STSong","SimSun",serif;
  text-shadow:2px 3px 0 rgba(0,0,0,.05);
}
.score-sub-row{display:flex;justify-content:center;gap:0;margin-bottom:18px;
  border:1px solid var(--border)}
.score-sub-item{flex:1;text-align:center;padding:10px 4px;border-right:1px solid var(--border)}
.score-sub-item:last-child{border-right:none}
.score-sub-val{font-size:18px;font-weight:700;font-family:"STSong","SimSun",serif}
.score-sub-label{font-size:10px;color:var(--ink-dim);margin-top:2px}

/* ─── SCHOOL LIST ─── */
.school-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;background:rgba(255,255,255,.4);
  border:1px solid var(--border-light);margin-bottom:6px;
  cursor:pointer;transition:all .15s;
}
.school-item:hover,.school-item.sel{background:rgba(255,255,255,.75);border-color:var(--border)}
.school-item.sel{border-left:3px solid var(--green)}
.school-name{font-size:14px;font-weight:700;color:var(--ink);font-family:"STSong","SimSun",serif}
.school-cut{font-size:11px;color:var(--ink-dim);margin-top:2px}
.school-tier-badge{font-size:10px;padding:2px 8px;border-radius:1px;color:#fff;flex-shrink:0;margin-left:8px}

/* ─── ENDING ─── */
.ending-name{
  font-size:34px;font-weight:900;color:var(--ink);
  letter-spacing:5px;margin:16px 0 12px;text-align:center;
  font-family:"STSong","SimSun","Songti SC",serif;
}
.ending-tagline{
  font-size:14px;color:var(--ink-soft);line-height:2.4;
  text-align:center;padding:0 6px;
  font-family:"STSong","SimSun","Songti SC",serif;
}
.divider{border:none;border-top:1px solid var(--border-light);margin:16px 0}

/* ─── MISC ─── */
.section-title{
  font-size:10px;letter-spacing:2px;color:var(--ink-dim);
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border-light);
}
.atmo-box{
  font-style:italic;color:var(--ink-dim);font-size:13px;line-height:1.9;
  padding:10px 14px;margin-bottom:12px;border-left:2px solid var(--border-light);
  background:rgba(255,255,255,.2);
}
.spacer{flex:1}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

/* ─── STRATEGY CARDS ─── */
.strat-list{display:flex;flex-direction:column;gap:7px;width:100%}
.strat-card{
  display:grid;grid-template-columns:36px 1fr auto;
  gap:10px;align-items:center;
  background:rgba(255,255,255,.45);border:1px solid var(--border-light);
  padding:10px 12px;cursor:pointer;text-align:left;
  font-family:inherit;transition:all .18s;
  position:relative;overflow:hidden;
}
.strat-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--green);opacity:.5;transition:opacity .18s;
}
.strat-card:hover{background:rgba(255,255,255,.8);border-color:var(--border);}
.strat-card:hover::before{opacity:1;}
.strat-card:active{transform:scale(.99);}
.sc-icon{font-size:1.4em;text-align:center;line-height:1}
.sc-label{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.sc-desc{font-size:11px;color:var(--ink-dim);line-height:1.4;margin-bottom:4px}
.sc-effects{font-size:11px;display:flex;gap:8px;flex-wrap:wrap}
.sc-tag{
  font-size:10px;padding:2px 7px;border:1px solid;
  white-space:nowrap;letter-spacing:1px;
  font-weight:600;
}
/* Animate result feedback */
.strat-result-flash{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(240,232,210,.97);border:2px solid var(--border);
  padding:16px 24px;text-align:center;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  animation:flash-in .2s ease;min-width:200px;
}
@keyframes flash-in{from{opacity:0;transform:translate(-50%,-55%)}to{opacity:1;transform:translate(-50%,-50%)}}
.sfr-title{font-size:11px;color:var(--ink-dim);letter-spacing:2px;margin-bottom:8px}
.sfr-delta{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.sfr-item{font-size:15px;font-weight:700;font-family:"STSong","SimSun",serif}
.sfr-up{color:#1a6830}.sfr-down{color:#8b1a1a}.sfr-neutral{color:var(--ink-dim)}
.sfr-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.sfr-bar-row{display:flex;flex-direction:column;gap:2px}
.sfr-bar-lbl{font-size:9px;color:var(--ink-dim);letter-spacing:1px}
.sfr-bar-wrap{height:5px;background:var(--paper-alt);border:1px solid var(--border-light);overflow:hidden}
.sfr-bar-fill{height:100%;transition:width .6s ease;background:var(--green)}
.sfr-bar-fill.warn{background:#c8a840}.sfr-bar-fill.bad{background:var(--red)}

/* ─── SCENE IMAGES ─── */
.scene-img{
  width:100%;height:160px;object-fit:cover;
  margin:-24px -20px 14px -30px;width:calc(100% + 50px);
  filter:sepia(40%) brightness(0.85) contrast(1.1);
  display:block;
}
.scene-img-sm{
  width:calc(100% + 50px);height:120px;object-fit:cover;
  margin:-24px -20px 14px -30px;
  filter:sepia(50%) brightness(0.8) contrast(1.1);
  display:block;
}
.era-img{
  width:calc(100% + 50px);height:140px;object-fit:cover;
  margin:-24px -20px 16px -30px;
  filter:sepia(60%) brightness(0.75) contrast(1.15);
  display:block;
}
</style>
</head>
<body>
<div id="app"><div id="root"></div></div>
<script>
// ─────────────────────────────────────────────────────────────
// 1. CONTENT DATA
// ─────────────────────────────────────────────────────────────

fect":{"mood":1,"score_modifier":3}}]}]},"randomEvents":[{"id":"r01","name":"初恋复合","category":"人际关系","scene":"一条消息发进来，是你以为已经结束的那段关系的另一个人。说了一些话，大意是，想重新开始。","text":"你把手机屏幕朝下放。窗外有人在打篮球，球撞到篮板的声音隔三差五传进来。","options":[{"label":"回复说现在不是时候，等考完说","effect":{"mood":-4,"score_modifier":2}},{"label":"回复说好，再说说","effect":{"mood":5,"score_modifier":-8}},{"label":"不回，当没看见","effect":{"mood":-7,"score_modifier":5}}]},{"id":"r02","name":"父母要求报师范","category":"家庭压力","scene":"饭桌上，妈妈说了一个学校的名字，然后说工作稳定、以后有寒暑假、离家近。爸爸低着头吃饭，没有反对，也没有支持。","text":"你夹了一筷子菜，没有放进嘴里。","options":[{"label":"说好，把那个学校加进志愿考虑范围","effect":{"mood":-3,"score_modifier":0},"special":"family_comply"},{"label":"说你有自己的想法，饭后再谈","effect":{"mood":-5,"score_modifier":3},"special":"family_resist"},{"label":"答应了，但没有真的去查那个学校","effect":{"mood":-2,"score_modifier":-2}}]},{"id":"r03","name":"发现邻座有小抄","category":"道德选择","scene":"考前一周，在教室里做模拟，你看见邻桌同学把一张纸叠成了很小一块，压在橡皮下面。那张纸上密密麻麻是字。","text":"那张纸离你的视线不超过三十厘米。","options":[{"label":"假装没有看见","effect":{"mood":-5,"score_modifier":0}},{"label":"课后找那个同学说一下","effect":{"mood":-3,"score_modifier":0}},{"label":"报告监考老师","effect":{"mood":-8,"score_modifier":2}},{"label":"也想用这种方式备考","effect":{"mood":0,"score_modifier":0},"special":"cheat_route"}]},{"id":"r04","name":"语文老师押中作文","category":"意外惊喜","scene":"语文老师在最后一次作文课上押了一个题：「时间与选择」。考前三天，她说今年很可能考这个方向，让大家提前写一篇。","text":"你写了大概五百字，交上去。老师在右上角画了一个圈。","options":[{"label":"把那篇作文背下来","effect":{"mood":3,"score_modifier":10}},{"label":"研究那个圈的思路，扩写成完整范文","effect":{"mood":0,"score_modifier":6}},{"label":"押题这种事不可信，照常备考","effect":{"mood":2,"score_modifier":0}}]},{"id":"r05","name":"突然生病","category":"外部干扰","scene":"凌晨三点，你发现自己发烧了。体温计显示 38.7。家里只有退烧药，没有其他东西。","text":"你把退烧药吃下去，在床上躺着，看着天花板想，明天还有一次模拟考。","options":[{"label":"吃药休息，明天缓过来再说","effect":{"mood":5,"score_modifier":-5}},{"label":"吃完药继续复习","effect":{"mood":-8,"score_modifier":0}},{"label":"让父母明天请假在家休息一天","effect":{"mood":8,"score_modifier":-3}}]},{"id":"r06","name":"彻夜做出了一道大题","category":"意外惊喜","scene":"夜里十一点，你在做一道你之前卡了两周的数列证明题。用了一个之前没试过的角度，草稿纸写了半张。","text":"最后那行等号落下去的时候，你停了大约十秒。","options":[{"label":"把思路整理成笔记，第二天再验证","effect":{"mood":8,"score_modifier":8}},{"label":"继续做下一道","effect":{"mood":3,"score_modifier":5}},{"label":"太累了，睡觉，明天再看","effect":{"mood":5,"score_modifier":2}}]},{"id":"r07","name":"好友崩了","category":"人际关系","scene":"你最好的朋友发来一条消息：我不想考了。下面没有补充。你拨了过去，通了，那边没有说话，过了三秒挂掉了。","text":"你看着那个已断开的通话界面。","options":[{"label":"再打一次，约出来谈","effect":{"mood":5,"score_modifier":-5},"special":"help_others"},{"label":"发消息说等有时间再聊，继续复习","effect":{"mood":-4,"score_modifier":3}},{"label":"去他家待了一个下午","effect":{"mood":8,"score_modifier":-8},"special":"help_others"}]},{"id":"r08","name":"班主任的约谈","category":"意外惊喜","scene":"放学后班主任留下你。她翻出你最近三次月考的成绩，把它们摆在桌上，说：你有希望冲一本线以上。然后她停下来，等你说话。","text":"那三个数字你都认识，但并排放在一起的时候，有些不一样。","options":[{"label":"说你知道，会努力的","effect":{"mood":5,"score_modifier":3}},{"label":"问她具体差哪里，能冲到哪","effect":{"mood":3,"score_modifier":6}},{"label":"说谢谢，然后走了","effect":{"mood":2,"score_modifier":0}}]},{"id":"r09","name":"家里出了事","category":"家庭压力","scene":"父亲打电话来，说了一件事。你听完，挂断，坐在那里没有动。那件事和高考没有关系，但它发生了，而且发生在这个时候。","text":"你不知道要跟谁说。","options":[{"label":"回家待了两天，再回来继续","effect":{"mood":-5,"score_modifier":-5}},{"label":"没有回家，继续在学校，但什么都没做进去","effect":{"mood":-10,"score_modifier":-8}},{"label":"告诉班主任，请了一天假","effect":{"mood":-3,"score_modifier":-3}}]},{"id":"r10","name":"模拟考失常","category":"自我怀疑","scene":"这次模拟比你预估的低了四十分。卷子发下来，你找不到一个说得过去的原因——不是题难，不是发挥差，就是每道题都差了一点点。","text":"你把卷子从上到下翻了一遍，合上，放进抽屉里。","options":[{"label":"今晚把所有失分点整理出来","effect":{"mood":-6,"score_modifier":7}},{"label":"出去跑了三圈，回来再想","effect":{"mood":4,"score_modifier":0}},{"label":"告诉自己这次就当没考","effect":{"mood":3,"score_modifier":-2}}]},{"id":"r11","name":"想放弃","category":"自我怀疑","scene":"第七十三天。你坐在书桌前，把当天的计划表看了五分钟，什么都没有写。窗外有人在街上说话，声音听不清，但知道是在笑。","text":"你想不起来你上一次觉得这件事有意思是什么时候了。","options":[{"label":"强迫自己开始做第一道题","effect":{"mood":-4,"score_modifier":3}},{"label":"出去走一走，半小时后回来","effect":{"mood":5,"score_modifier":0}},{"label":"给自己放半天假","effect":{"mood":8,"score_modifier":-3}}]},{"id":"r12","name":"和父母大吵","category":"家庭压力","scene":"关于你要报的那个专业，你们谈了将近一个小时，最后变成了互相不说话。父亲走进他的房间，带上了门。","text":"那扇门的声音不大，但你听见了。","options":[{"label":"先去道歉，不管谁对谁错","effect":{"mood":5,"score_modifier":0}},{"label":"回自己房间，今晚不提这件事","effect":{"mood":-5,"score_modifier":2}},{"label":"发消息说你明白他的想法，但你要再想想","effect":{"mood":2,"score_modifier":0},"special":"family_resist"}]},{"id":"r13","name":"收到大学宣传册","category":"意外惊喜","scene":"班主任收到一批高校宣传材料，让同学们自取。你顺手拿了一本，翻到某一页，是个你有一点兴趣的专业介绍。","text":"你把那一页折了一个角。","options":[{"label":"把那所学校加进志愿候选里","effect":{"mood":3,"score_modifier":0},"special":"wish_school"},{"label":"查了一下它今年的录取分数线","effect":{"mood":2,"score_modifier":2}},{"label":"把宣传册放进书包，以后再说","effect":{"mood":1,"score_modifier":0}}]},{"id":"r14","name":"誓师大会","category":"人际关系","scene":"学校组织了一次高考誓师大会，在操场上，全年级站成一排，班主任念了一段话，然后让大家喊口号。","text":"那个口号你知道，喊出来的时候你想起你是在哪里第一次听到它的。","options":[{"label":"认真参加，喊得很大声","effect":{"mood":6,"score_modifier":0}},{"label":"参加了，但嘴皮子动了动","effect":{"mood":2,"score_modifier":0}},{"label":"找理由没去","effect":{"mood":-2,"score_modifier":1}}]},{"id":"r15","name":"成绩外泄","category":"人际关系","scene":"班里某个人把全班的模拟考排名截图发到了外面一个群。你不知道是谁，但你的名字和分数就在那张图上，已经传出去了。","text":"你看见那张图是在午饭时间，从同学的手机屏幕上。","options":[{"label":"不管它，继续","effect":{"mood":-3,"score_modifier":2}},{"label":"找班主任说这件事","effect":{"mood":-5,"score_modifier":0}},{"label":"和几个朋友去查是谁发的","effect":{"mood":-6,"score_modifier":-3}}]},{"id":"r16","name":"亲戚的比较","category":"家庭压力","scene":"周末在亲戚家吃饭，一个长辈提起了你表哥当年的成绩，然后看向你，问你有没有把握。","text":"你把那个分数和自己最近的模拟分在心里对了一下。","options":[{"label":"说有，然后换个话题","effect":{"mood":-2,"score_modifier":0}},{"label":"说会努力，没有给出数字","effect":{"mood":2,"score_modifier":0}},{"label":"把你自己的想法说出来","effect":{"mood":4,"score_modifier":2},"special":"family_resist"}]},{"id":"r17","name":"睡前刷手机","category":"外部干扰","scene":"本来打算刷五分钟，结果一个小时过去了。你放下手机，桌灯还亮着，课本摊开在那里。","text":"你知道你今晚的计划没有完成。","options":[{"label":"强撑着再看半小时课本","effect":{"mood":-4,"score_modifier":2}},{"label":"关灯睡觉，明天补","effect":{"mood":3,"score_modifier":-2}},{"label":"把手机放到另一个房间，继续学习","effect":{"mood":-2,"score_modifier":4}}]},{"id":"r18","name":"好题做出来了","category":"意外惊喜","scene":"有一道卷子上的题，你想了三天没有思路，今天在等公共汽车的时候突然想到了一个角度，回家试了一下，推出来了。","text":"你把过程写下来，把那道题圈了起来。","options":[{"label":"整理成笔记模板，找类似的题练","effect":{"mood":7,"score_modifier":8}},{"label":"发给同学，说你做出来了","effect":{"mood":8,"score_modifier":3}},{"label":"把那个想法记下来，继续做别的题","effect":{"mood":4,"score_modifier":5}}]},{"id":"r19","name":"考前一天晚上","category":"外部干扰","scene":"考试前一天。你把所有的准备工作都做完了：证件、铅笔、橡皮、水。然后你坐在那里，不知道还应该做什么。","text":"你没有打开课本。","options":[{"label":"看半小时错题本，然后睡觉","effect":{"mood":-2,"score_modifier":2}},{"label":"看了一部不用动脑子的视频，然后睡觉","effect":{"mood":5,"score_modifier":0}},{"label":"很早就睡了，但睡不着，翻了很久","effect":{"mood":-4,"score_modifier":0}}]},{"id":"r20","name":"被老师夸了","category":"意外惊喜","scene":"一个你尊重的老师在办公室门口叫住你，说上次那道作文写得很好，想用你的作文当范文给其他班看。","text":"你说好，然后走了。走到楼梯口，你停了一下。","options":[{"label":"继续向前走，去上下一节课","effect":{"mood":8,"score_modifier":3}},{"label":"回去问老师具体哪里写得好","effect":{"mood":6,"score_modifier":6}},{"label":"当天下午把那篇作文又改了一遍","effect":{"mood":4,"score_modifier":5}}]}],"examMicroDecisions":[{"id":"e01","subject":"语文","scene":"作文题出来了。题目你见过类似的，但不完全一样。你在草稿纸上列了两个写法：一个稳，一个有点意思。","text":"你看了一下时间，还剩五十分钟写作文。","options":[{"label":"选稳妥的角度，确保基本分","effect":{"base_delta":5,"variance":3}},{"label":"选有意思的角度，赌一把高分","effect":{"base_delta":12,"variance":15}},{"label":"两个方向合并，折中着写","effect":{"base_delta":7,"variance":6}}]},{"id":"e02","subject":"语文","scene":"有一道阅读理解，两个答案在脑子里打架，读了三遍还是没有结论。","text":"边上那道题你会，但这道题还没有答案。","options":[{"label":"先选一个，继续做后面，有时间再回来","effect":{"base_delta":4,"variance":4}},{"label":"在这道题上再花五分钟","effect":{"base_delta":6,"variance":8}},{"label":"选看起来更像答案的那个，直接下一题","effect":{"base_delta":2,"variance":6}}]},{"id":"e03","subject":"数学","scene":"选择题第八题，算了一遍算出来 C，总觉得不对，算第二遍算出来 B。","text":"时间走了两分钟，你还在这道题上。","options":[{"label":"相信第一遍，选 C，继续","effect":{"base_delta":3,"variance":5}},{"label":"再算第三遍","effect":{"base_delta":5,"variance":3}},{"label":"选 B，两种算法里选有把握的那个","effect":{"base_delta":4,"variance":4}}]},{"id":"e04","subject":"数学","scene":"压轴大题第二问，你做出了结论，但中间有一行推导不够严谨，可以过得去但不确定老师会不会扣分。","text":"还有二十分钟，大题还有最后一问。","options":[{"label":"就这样交，先去做最后一问","effect":{"base_delta":4,"variance":5}},{"label":"把那一行擦掉重写，补一行推导","effect":{"base_delta":7,"variance":4}},{"label":"跳过最后一问，把这道题写完整","effect":{"base_delta":5,"variance":6}}]},{"id":"e05","subject":"数学","scene":"最后一道大题第一问，你看了五分钟，完全没有入口。还有三十分钟，你已经做完了前面所有能做的题。","text":"笔尖在草稿纸上划了一个角，没有落下去。","options":[{"label":"继续盯着，再想五分钟","effect":{"base_delta":3,"variance":8}},{"label":"先把会的题目检查一遍，回来再看","effect":{"base_delta":5,"variance":3}},{"label":"写下能想到的任何步骤，拿步骤分","effect":{"base_delta":4,"variance":4}}]},{"id":"e06","subject":"英语","scene":"完形填空有一道，两个选项都说得通，语法没有问题，区别只在语感。","text":"你在两个选项上来回划了三次，没有决定。","options":[{"label":"选第一感觉选的那个","effect":{"base_delta":3,"variance":4}},{"label":"把前后文再通读一遍，再选","effect":{"base_delta":5,"variance":3}},{"label":"跳过，最后再决定","effect":{"base_delta":4,"variance":5}}]},{"id":"e07","subject":"英语","scene":"英语作文你起了个开头，发现和背的那个模板不太一样。改回模板的话，前面两行要擦掉。","text":"还有二十五分钟写作文。","options":[{"label":"改回模板，稳一点","effect":{"base_delta":4,"variance":3}},{"label":"继续按自己起的开头写","effect":{"base_delta":6,"variance":7}},{"label":"把两者结合，接着写","effect":{"base_delta":5,"variance":4}}]},{"id":"e08","subject":"综合","scene":"综合卷，最后一道大题，你对一个知识点的记忆模糊。大题配分很高，但那个知识点是关键。","text":"你手里的笔停在那一行上，不知道该怎么开始。","options":[{"label":"写你记得的，把框架搭出来再填","effect":{"base_delta":6,"variance":5}},{"label":"先跳过这道，把前面的整理一遍","effect":{"base_delta":4,"variance":3}},{"label":"把那个模糊知识点周围所有能写的都写上","effect":{"base_delta":5,"variance":6}}]}],"endings":{"01":{"name":"鲤鱼跃龙门","tagline":"你把命运之绳握得太紧，紧到手心留了疤，却也紧到它没能跑掉。那一百天里每一个不情愿的早晨，它们都算数了。"},"02":{"name":"折翅的鸟","tagline":"你飞得不够高，但你知道你曾经用力扇过翅膀。那个努力过的人是真实的，不因为结果而失去重量。"},"03":{"name":"顺水行舟","tagline":"你从未真正想去哪里，所以河流带你去哪里你就去了哪里。船还在，岸也在，只是那个目的地从来不是你选的。"},"04":{"name":"此路是我开","tagline":"他们说要走的路你没走，你说要走的路他们不懂。多年后你们都沉默了——不是谁赢了，是那个问题终于没有意义了。"},"05":{"name":"乖孩子的代价","tagline":"你给了他们一个满意的答案，而你自己的那道题，留到了以后。以后很长，也许够用，也许不够。"},"06":{"name":"兵败如山倒","tagline":"那一百天里有一天你放弃了，后来你发现那一天之后的所有天都变了。不是惩罚，是因果，它就是这样运作的。"},"07":{"name":"慢热的火","tagline":"你不是没有努力，只是比别人慢了半拍——而那一年，半拍就是一个学校的距离。差这么一点点，不是悲剧，是精确。"},"08":{"name":"旁观者清","tagline":"你帮了太多人，忘了自己也在考试。那些你陪过的人后来都记得你——只是高考成绩单上，那些不算分。"},"09":{"name":"纸牌屋","tagline":"那张小抄没有救你，它只是让你看清楚了你真正害怕的是什么。那个答案比高考的答案更难处理。"},"10":{"name":"另一种自由","tagline":"没有录取通知书的那个夏天，你反而第一次知道了自己想要什么。那个发现是真的，代价也是真的。"}}};

// 3. STATE
// ─────────────────────────────────────────────────────────────
let S = {};

function initState() {
  S = {
    screen: 'title',
    province: null, year: null, comboKey: null,
    knowledge: 50, mood: 60,
    currentNode: 0,
    strategyHistory: [],
    flags: [],
    activeEvents: [],       // {type:'fixed'|'random', eventId, nodeIdx}
    pendingEvent: null,     // event currently shown
    examIdx: 0,
    examBonus: 0,
    baseScore: 0, finalScore: 0,
    selectedSchool: null, admitted: false,
    endingId: null,
    scoreBreakdown: {yu:0,shu:0,ying:0,zong:0}
  };
  saveState();
}

function saveState() {
  try { localStorage.setItem('gaokao_state', JSON.stringify(S)); } catch(e){}
}

function loadState() {
  try {
    const s = localStorage.getItem('gaokao_state');
    if (s) { S = JSON.parse(s); return true; }
  } catch(e){}
  return false;
}

// ─────────────────────────────────────────────────────────────
// 4. SCORE ENGINE
// ─────────────────────────────────────────────────────────────
function calcBaseScore() {
  const r = PROVINCE_RANGES[S.province];
  // knowledge 50 = median; each point = about 2.5 pts of score
  const score = r.med + (S.knowledge - 50) * 2.8;
  return Math.round(Math.max(r.min + 20, Math.min(r.max - 20, score)));
}

function applyExamDecision(decision, optIdx) {
  const opt = decision.options[optIdx];
  const ef = opt.effect;
  const moodFactor = S.mood > 70 ? 1.2 : S.mood > 50 ? 1.0 : S.mood > 35 ? 0.8 : 0.6;
  const variance = (Math.random() * 2 - 1) * ef.variance * moodFactor;
  return Math.round(ef.base_delta * moodFactor + variance);
}

function calcFinalScore() {
  S.baseScore = calcBaseScore();
  S.finalScore = Math.min(750, Math.max(150, S.baseScore + S.examBonus));
  // Distribute to subjects roughly
  const total = S.finalScore;
  S.scoreBreakdown = {
    yu: Math.round(total * 0.21 + (Math.random()-0.5)*10),
    shu: Math.round(total * 0.21 + (Math.random()-0.5)*15),
    ying: Math.round(total * 0.21 + (Math.random()-0.5)*10),
    zong: 0
  };
  S.scoreBreakdown.zong = S.finalScore - S.scoreBreakdown.yu - S.scoreBreakdown.shu - S.scoreBreakdown.ying;
  // Clamp all
  Object.keys(S.scoreBreakdown).forEach(k => {
    S.scoreBreakdown[k] = Math.max(30, Math.min(150, S.scoreBreakdown[k]));
  });
}

function getRanking(score) {
  if (score >= 690) return '全省前 0.1% · 传说级';
  if (score >= 650) return '全省前 1% · 顶尖水准';
  if (score >= 600) return '全省前 5% · 重点线以上';
  if (score >= 550) return '全省前 15% · 一本线以上';
  if (score >= 480) return '全省前 35% · 二本线附近';
  if (score >= 380) return '全省前 60% · 专科线以上';
  return '未达专科线';
}

function getSchoolCut(school) {
  const cut = school.cut[S.province];
  if (!cut) return null;
  // Year adjustment: older years have slightly different lines
  const yearAdj = {2003:-15,2008:-10,2013:-5,2017:0,2023:10};
  return cut + (yearAdj[S.year] || 0);
}

function determineEnding() {
  const score = S.finalScore;
  const flags = S.flags;
  const strategies = S.strategyHistory;
  const restCount = strategies.filter(s=>s==='rest'||s==='relax').length;
  const grindCount = strategies.filter(s=>s==='grind_weak'||s==='reinforce'||s==='mock').length;
  const helpOthers = flags.filter(f=>f==='help_others').length;
  const familyComply = flags.filter(f=>f==='family_comply').length;
  const familyResist = flags.filter(f=>f==='family_resist').length;

  if (flags.includes('cheat_route')) return '09';
  if (score >= 640 && grindCount >= 10) return '01';
  if (score >= 560 && helpOthers >= 2) return '08';
  if (familyComply >= 2 && score >= 500) return '05';
  if (familyResist >= 2 && score >= 520) return '04';
  if (score < 380 && S.mood >= 60 && restCount >= 8) return '10';
  if (score < 420) return '06';
  if (score >= 580 && grindCount < 8) return '02';
  if (score >= 540 && score < 580) return '07';
  if (restCount >= 12) return '03';
  return '02';
}

// ─────────────────────────────────────────────────────────────
// 5. EVENT SCHEDULING
// ─────────────────────────────────────────────────────────────
function setupEvents() {
  const events = [];
  // Fixed events for this combo
  const fixedList = CONTENT.fixedEvents[S.comboKey] || [];
  fixedList.forEach(ev => events.push({type:'fixed', eventId:ev.id, nodeIdx:ev.node-1}));

  // Random events: pick 5 from pool
  const pool = [...CONTENT.randomEvents];
  const chosen = [];
  while (chosen.length < 5 && pool.length > 0) {
    const idx = Math.floor(Math.random() * pool.length);
    chosen.push(pool.splice(idx, 1)[0]);
  }
  // Place them at random non-fixed nodes
  const usedNodes = new Set(events.map(e=>e.nodeIdx));
  const availNodes = Array.from({length:20},(_,i)=>i).filter(i=>!usedNodes.has(i) && i>0);
  chosen.forEach((ev, i) => {
    if (i < availNodes.length) {
      events.push({type:'random', eventId:ev.id, nodeIdx:availNodes[i]});
    }
  });

  S.activeEvents = events;
}

function getEventForNode(nodeIdx) {
  return S.activeEvents.find(e => e.nodeIdx === nodeIdx) || null;
}

function getEventData(type, id) {
  if (type === 'fixed') {
    const combo = CONTENT.fixedEvents[S.comboKey] || [];
    return combo.find(e=>e.id===id);
  }
  return CONTENT.randomEvents.find(e=>e.id===id);
}

function timeline() {
  const dots = Array.from({length:20},(_,i) => {
    const cls = i < S.currentNode ? 'done' : i === S.currentNode ? 'current' : '';
    return `<div class="tl-dot ${cls}"></div>`;
  }).join('');
  const daysLeft = 100 - S.currentNode * 5;
  return `<div class="timeline">${dots}<span class="progress-text">距高考 ${daysLeft} 天</span></div>`;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function resumeGame() {
  loadState();
  goToCurrentScreen();
}

function goToCurrentScreen() {
  const map = {
    title: showTitle, select: showSelect, era: showEra,
    node: showNode, event: ()=>showEventScreen(S.pendingEvent),
    examIntro: showExamIntro, examDecision: ()=>showExamDecision(),
    scoreReveal: showScoreReveal, volunteer: showVolunteer,
    result: showResult, ending: showEnding
  };
  (map[S.screen] || showTitle)();
}

function showSelect() { showTitle(); }
function selectProvince(p) { titleSelectProvince(p); }
function selectYear(y, locked) { if (!locked) titleSelectYear(y); }
function randomSelect() { titleRandom();
}

function getEra(province, year) {
  const key = `${province}_${year}`;
  const prov = PROVINCES.find(p=>p.id===province);
  const provName = prov?.name || province;
  const ext = ERA_EXT[key];
  if (ext) return {province:provName,year,title:`${provName} · ${year}`,tagline:ext.tagline,desc:ext.desc,imgSeed:ext.imgSeed,stats:CONTENT.eras[key]?.stats||{applicants:'—',acceptanceRate:'—',rule:'全国卷，满分750'}};
  if (CONTENT.eras[key]) return {...CONTENT.eras[key],imgSeed:20};
  // province-specific fallback
  const provDesc = PROV_DESCS[province] || PROV_DESCS.default;
  const provKey = Object.keys(CONTENT.eras).find(k=>k.startsWith(province+'_'));
  const base = CONTENT.eras[provKey] || CONTENT.eras['henan_2003'];
  return {province:provName,year,title:`${provName} · ${year}`,tagline:'那年，命运的刻度落在这里',desc:provDesc,imgSeed:20,stats:base.stats||{applicants:'—',acceptanceRate:'—',rule:'全国卷，满分750'}};
}
function confirmSelect() {
  if (!S.province || !S.year) return;
  S.comboKey = `${S.province}_${S.year}`;
  showEra();
}

function showEra() {
  S.screen = 'era';
  const era = getEra(S.province, S.year);
  if (!era) { showTitle(); return; }
  const eraSeed = era.imgSeed || 20;
  render(`
    <img class="era-img" src="https://picsum.photos/seed/${eraSeed}/460/180" alt="" loading="eager">
    <div class="stamp">${era.title}</div>
    <div style="font-family:'STSong',serif;font-size:20px;color:#2c1a0e;margin-bottom:8px;letter-spacing:2px">${era.tagline}</div>
    <div class="card">
      <p>${era.desc}</p>
      <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">
        <div><div class="dim">报考人数</div><div class="bold">${era.stats.applicants}</div></div>
        <div><div class="dim">本科录取率</div><div class="bold">${era.stats.acceptanceRate}</div></div>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #e0d0b0">
        <div class="dim" style="margin-bottom:4px">考试制度</div>
        <div style="font-size:13px;color:#3d2b1a">${era.stats.rule}</div>
      </div>
    </div>
    <div class="card-sm" style="margin-bottom:20px">
      <div class="dim" style="margin-bottom:6px">你的初始状态</div>
      <div style="display:flex;gap:20px">
        <div><span class="dim">知识储备</span> <strong>50</strong></div>
        <div><span class="dim">临场状态</span> <strong>60</strong></div>
      </div>
      <div style="font-size:12px;color:#8b7355;margin-top:8px">100天里的选择会改变这两个数字，最终影响你的考场发挥。</div>
    </div>
    <button class="btn btn-primary" onclick="startGame()">开始 100 天备考</button>
    <button class="btn" style="margin-top:8px" onclick="showSelect()">重新选择</button>
  `);
}

function startGame() {
  S.knowledge = 50; S.mood = 60;
  S.currentNode = 0; S.strategyHistory = []; S.flags = [];
  S.examIdx = 0; S.examBonus = 0;
  setupEvents();
  showNode();
}

function showNode() {
  S.screen = 'node';
  saveState();
  const node = S.currentNode;
  const daysLeft = 100 - node * 5;
  const dayOf = node * 5 + 5;
  const atmo = NODE_ATMO[node % NODE_ATMO.length];

  // Period label
  let period = '备考高峰期';
  if (node >= 15) period = '最后冲刺';
  else if (node >= 12) period = '临考前夕';
  else if (node >= 8) period = '中期复习';

  const stratIcons = {grind_weak:'📖',reinforce:'🏆',balanced:'⚖️',mock:'📝',rest:'😌',relax:'🌱'};
  const stratRisk = {grind_weak:'稳健',reinforce:'保守',balanced:'均衡',mock:'随机',rest:'回血',relax:'放松'};
  const stratColor = {grind_weak:'#1a3820',reinforce:'#1a3820',balanced:'#8a6610',mock:'#8a4010',rest:'#1a3820',relax:'#1a3820'};
  const stratBtns = STRATEGIES.map((st) => {
    const kn = st.effect.knowledge||0, mood = st.effect.mood||0;
    const knBar = kn>0?`<span style="color:#1a6830;font-weight:600">知识+${kn}</span>`:kn<0?`<span style="color:#8b1a1a">知识${kn}</span>`:'<span style="color:var(--ink-dim)">知识±?</span>';
    const moodBar = mood>0?`<span style="color:#1a6830;font-weight:600">状态+${mood}</span>`:mood<0?`<span style="color:#8b1a1a">状态${mood}</span>`:'';
    const extra = st.effect.mock?'<span style="color:#8a4010">结果随机</span>':'';
    return `<button class="strat-card" onclick="chooseStrategy('${st.id}')">
      <div class="sc-icon">${stratIcons[st.id]||'📚'}</div>
      <div class="sc-body">
        <div class="sc-label">${st.label}</div>
        <div class="sc-desc">${st.desc}</div>
        <div class="sc-effects">${knBar} ${moodBar} ${extra}</div>
      </div>
      <div class="sc-tag" style="background:${stratColor[st.id]}15;color:${stratColor[st.id]};border-color:${stratColor[st.id]}55">${stratRisk[st.id]}</div>
    </button>`;
  }).join('');

  render(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <div class="kicker">${period}</div>
        <div style="font-family:'STSong',serif;font-size:18px;color:#1a1206">第 ${dayOf} 天</div>
      </div>
      <div class="stamp" style="margin:0;font-size:10px;transform:rotate(2deg)">距考 ${daysLeft} 天</div>
    </div>
    ${timeline()}
    ${statBars()}
    <img class="scene-img-sm" src="https://picsum.photos/seed/${getImgSeed('study',node)}/460/130" alt="" loading="lazy">
    <div class="atmo-box">${atmo}</div>
    <div class="section-title">今天怎么过 <span style="font-size:10px;color:var(--ink-dim);letter-spacing:0">(选一项)</span></div>
    <div class="strat-list">${stratBtns}</div>
  `);
}

function chooseStrategy(stratId) {
  const strat = STRATEGIES.find(s=>s.id===stratId);
  if (!strat) return;

  // Disable cards immediately
  document.querySelectorAll('.strat-card').forEach(c=>{c.style.pointerEvents='none';c.style.opacity='.5';});

  let knDelta = strat.effect.knowledge;
  let moodDelta = strat.effect.mood;
  const isMock = strat.effect.mock;

  if (isMock) {
    knDelta = Math.round((Math.random() * 13) - 5);
    moodDelta = -3;
  }
  const moodMult = S.mood > 70 ? 1.2 : S.mood > 50 ? 1.0 : S.mood > 35 ? 0.8 : 0.6;
  knDelta = Math.round(knDelta * moodMult);

  const prevKn = S.knowledge, prevMood = S.mood;
  S.knowledge = clamp(S.knowledge + knDelta, 10, 100);
  S.mood = clamp(S.mood + moodDelta, 10, 100);
  S.strategyHistory.push(stratId);

  // Flash result overlay
  const kn = S.knowledge - prevKn, md = S.mood - prevMood;
  const knColor = kn>0?'sfr-up':kn<0?'sfr-down':'sfr-neutral';
  const mdColor = md>0?'sfr-up':md<0?'sfr-down':'sfr-neutral';
  const knText = kn>0?`知识 +${kn}`:kn<0?`知识 ${kn}`:'知识 ~';
  const mdText = md>0?`状态 +${md}`:md<0?`状态 ${md}`:'状态 ~';
  const mockNote = isMock?`<div style="font-size:10px;color:var(--ink-dim);margin-top:4px">${kn>=0?'模拟发挥不错':'模拟有所失常'}</div>`:'';

  const flash = document.createElement('div');
  flash.className = 'strat-result-flash';
  flash.innerHTML = `
    <div class="sfr-title">${strat.label}</div>
    <div class="sfr-delta">
      <div class="sfr-item ${knColor}">${knText}</div>
      <div class="sfr-item ${mdColor}">${mdText}</div>
    </div>
    <div class="sfr-bars">
      <div class="sfr-bar-row"><div class="sfr-bar-lbl">知识储备</div><div class="sfr-bar-wrap"><div class="sfr-bar-fill ${S.knowledge<30?'bad':S.knowledge<55?'warn':''}" style="width:${S.knowledge}%"></div></div></div>
      <div class="sfr-bar-row"><div class="sfr-bar-lbl">临场状态</div><div class="sfr-bar-wrap"><div class="sfr-bar-fill ${S.mood<30?'bad':S.mood<55?'warn':''}" style="width:${S.mood}%"></div></div></div>
    </div>
    ${mockNote}
  `;
  document.getElementById('app').appendChild(flash);

  setTimeout(() => {
    flash.remove();
    const ev = getEventForNode(S.currentNode);
    if (ev) {
      const evData = getEventData(ev.type, ev.eventId);
      if (evData) {
        S.pendingEvent = { type: ev.type, data: evData };
        saveState();
        showEventScreen(S.pendingEvent);
        return;
      }
    }
    advanceNode();
  }, 1300);
}

function showEventScreen(ev) {
  if (!ev) { advanceNode(); return; }
  S.screen = 'event';
  saveState();
  const d = ev.data;
  const letters = ['A','B','C','D','E'];
  const optBtns = d.options.map((opt, i) =>
    `<button class="btn-opt" onclick="chooseEvent(${i})"><span class="opt-letter">${letters[i]}</span><span class="opt-text">${opt.label}</span></button>`
  ).join('');

  const catMap={家庭压力:'event_family',人际关系:'event_friend',道德选择:'event_moral',意外惊喜:'event_surprise',外部干扰:'event_study',自我怀疑:'event_study'};
  const evImgCtx = catMap[d.category] || 'event_default';
  const evImgSeed = getImgSeed(evImgCtx, (d.id||'').charCodeAt(1)||0);
  render(`
    <img class="scene-img-sm" src="https://picsum.photos/seed/${evImgSeed}/460/130" alt="" loading="lazy">
    <div class="stamp" style="margin-bottom:12px">${d.name}</div>
    <div class="card" style="margin-bottom:16px">
      <div class="dim" style="margin-bottom:8px">发生了</div>
      <p style="font-style:italic">${d.scene}</p>
    </div>
    <div class="q-block" style="margin-bottom:16px">
      <p style="color:#2c1a0e">${d.text}</p>
    </div>
    <div class="section-title">你怎么做</div>
    <div class="btn-list">${optBtns}</div>
  `);
}

function chooseEvent(optIdx) {
  const ev = S.pendingEvent;
  if (!ev) { advanceNode(); return; }
  const opt = ev.data.options[optIdx];
  const ef = opt.effect;

  S.knowledge = clamp(S.knowledge + (ef.score_modifier || 0), 10, 100);
  S.mood = clamp(S.mood + (ef.mood || 0), 10, 100);

  // Special flags
  if (opt.special) S.flags.push(opt.special);
  if (opt.special === 'cheat_route') {
    // Cheat always gets caught
    showCheatCaught();
    return;
  }

  S.pendingEvent = null;
  advanceNode();
}

function showCheatCaught() {
  S.screen = 'event';
  saveState();
  render(`
    <div class="stamp red" style="margin-bottom:16px">作弊被查</div>
    <div class="card">
      <p>监考老师走过来，把那张纸拿走了。你知道接下来会发生什么。</p>
      <p>有些路，走进去之前你以为有出口。</p>
    </div>
    <div class="q-block" style="margin-bottom:20px">
      <p>本次考试取消资格。</p>
    </div>
    <button class="btn btn-red" onclick="goToEndingDirect('09')">接受结果</button>
  `);
}

function goToEndingDirect(endingId) {
  S.endingId = endingId;
  calcFinalScore();
  S.finalScore = 0;
  S.admitted = false;
  showEnding();
}

function advanceNode() {
  S.currentNode++;
  S.pendingEvent = null;
  if (S.currentNode >= 20) {
    showExamIntro();
  } else {
    showNode();
  }
}

function showExamIntro() {
  S.screen = 'examIntro';
  saveState();
  const era = getEra(S.province, S.year);
  const examDate = {2003:'2003年7月7日',2008:'2008年6月7日',2013:'2013年6月7日',2017:'2017年6月7日',2023:'2023年6月7日'};
  const date = examDate[S.year] || `${S.year}年6月7日`;

  const examImgSeed = getImgSeed('exam', S.year % 4);
  render(`
    <img class="scene-img" src="https://picsum.photos/seed/${examImgSeed}/460/170" alt="" loading="lazy">
    <div class="exam-header">
      <div class="exam-title">${era.province}省 ${S.year} 年普通高等学校招生统一考试</div>
      <div class="exam-sub">准考证号 ██████████████  姓名 ████</div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="dim" style="margin-bottom:8px">${date} · 09:00</div>
      <p>你站在考场门口。今天天气很好，也可能不好——你没有特别注意。</p>
      <p>前一百天的事是真实的。接下来这几个小时，也是真实的。</p>
      <p>铅笔、橡皮、准考证、水。都在。</p>
    </div>
    <div class="card-sm" style="margin-bottom:20px">
      <div class="dim" style="margin-bottom:6px">你带进考场的</div>
      <div style="display:flex;gap:20px">
        <div><span class="dim">知识储备</span> <strong style="color:${S.knowledge>65?'#1e3a1e':S.knowledge>40?'#8b6914':'#8b1a1a'}">${S.knowledge}</strong></div>
        <div><span class="dim">临场状态</span> <strong style="color:${S.mood>65?'#1e3a1e':S.mood>40?'#8b6914':'#8b1a1a'}">${S.mood}</strong></div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startExam()">进入考场</button>
  `);
}

function startExam() {
  S.examIdx = 0;
  S.examBonus = 0;
  showExamDecision();
}

function showExamDecision() {
  S.screen = 'examDecision';
  saveState();
  const decisions = CONTENT.examMicroDecisions;
  if (S.examIdx >= decisions.length) {
    finishExam();
    return;
  }
  const d = decisions[S.examIdx];
  const examLetters = ['A','B','C','D'];
  const optBtns = d.options.map((opt, i) =>
    `<button class="btn-opt" onclick="chooseExamDecision(${i})"><span class="opt-letter">${examLetters[i]}</span><span class="opt-text">${opt.label}</span></button>`
  ).join('');

  const examDSeed = getImgSeed('exam', S.examIdx);
  render(`
    <img class="scene-img-sm" src="https://picsum.photos/seed/${examDSeed}/460/120" alt="" loading="lazy">
    <div class="exam-header">
      <div class="exam-title">${d.subject}科目</div>
      <div class="exam-sub">${S.examIdx+1} / ${decisions.length}</div>
    </div>
    <div class="q-block" style="margin-bottom:12px">
      <div class="q-num">考场现场</div>
      <div class="q-text">${d.scene}</div>
    </div>
    <p style="color:#3d2b1a;font-size:14px;margin-bottom:16px">${d.text}</p>
    <div class="section-title">你的处理方式</div>
    <div class="btn-list">${optBtns}</div>
    <div class="dim center" style="margin-top:12px">进度 ${S.examIdx+1}/${decisions.length}</div>
  `);
}

function chooseExamDecision(optIdx) {
  const d = CONTENT.examMicroDecisions[S.examIdx];
  const delta = applyExamDecision(d, optIdx);
  S.examBonus += delta;
  S.examIdx++;
  showExamDecision();
}

function finishExam() {
  calcFinalScore();
  showScoreReveal();
}

function showScoreReveal() {
  S.screen = 'scoreReveal';
  saveState();
  const ranking = getRanking(S.finalScore);
  const sb = S.scoreBreakdown;

  render(`
    <div class="exam-header">
      <div class="exam-title">${S.year} 年高考成绩通知单</div>
    </div>
    <div class="score-big" id="scoreBig">---</div>
    <div class="dim center mb16">满分 750 分</div>
    <div class="score-sub-row">
      <div class="score-sub-item">
        <div class="score-sub-val" id="sc-yu">--</div>
        <div class="dim">语文</div>
      </div>
      <div class="score-sub-item">
        <div class="score-sub-val" id="sc-shu">--</div>
        <div class="dim">数学</div>
      </div>
      <div class="score-sub-item">
        <div class="score-sub-val" id="sc-ying">--</div>
        <div class="dim">英语</div>
      </div>
      <div class="score-sub-item">
        <div class="score-sub-val" id="sc-zong">--</div>
        <div class="dim">综合</div>
      </div>
    </div>
    <div class="card-sm" style="text-align:center;margin-bottom:20px">
      <div style="font-size:12px;color:#8b1a1a">${ranking}</div>
    </div>
    <button class="btn btn-primary" id="volunteerBtn" style="display:none" onclick="showVolunteer()">填报志愿 →</button>
  `);

  // Animate score
  let cur = 0;
  const target = S.finalScore;
  const step = Math.ceil(target / 40);
  const timer = setInterval(() => {
    cur = Math.min(cur + step, target);
    const el = document.getElementById('scoreBig');
    if (el) el.textContent = cur;
    if (cur >= target) {
      clearInterval(timer);
      // Show breakdown
      setTimeout(() => {
        ['yu','shu','ying','zong'].forEach(k => {
          const el = document.getElementById(`sc-${k}`);
          if (el) el.textContent = sb[k];
        });
        const btn = document.getElementById('volunteerBtn');
        if (btn) btn.style.display = 'block';
      }, 500);
    }
  }, 35);
}

function showVolunteer() {
  S.screen = 'volunteer';
  saveState();
  const score = S.finalScore;

  // Filter eligible schools
  const eligible = SCHOOLS.filter(s => {
    const cut = getSchoolCut(s);
    return cut !== null && score >= cut - 30; // show within range
  });

  const schoolItems = eligible.map((s, i) => {
    const cut = getSchoolCut(s);
    const canApply = score >= cut;
    const reach = score >= cut && score < cut + 20;
    return `
      <div class="school-item ${S.selectedSchool===i?'sel':''}" onclick="selectSchool(${i})">
        <div>
          <div class="school-name">${s.name}</div>
          <div class="school-cut">${s.major} · 分数线约 ${cut} 分 ${canApply?'':'<span style="color:#8b1a1a">（有风险）</span>'}</div>
        </div>
        <div class="school-tier-badge" style="background:${s.tier==='顶尖'?'#8b1a1a':s.tier==='985'?'#1e3a1e':s.tier==='211'?'#2d4a2d':'#5a4a2a'}">${s.tier}</div>
      </div>
    `;
  }).join('');

  const volSeed = getImgSeed('volunteer', 0);
  render(`
    <img class="scene-img" src="https://picsum.photos/seed/${volSeed}/460/160" alt="" loading="lazy">
    <div class="kicker">志愿填报</div>
    <h2>选择你的第一志愿</h2>
    <div class="card-sm" style="margin-bottom:16px">
      <div class="dim">你的分数</div>
      <div style="font-size:24px;font-weight:700;color:#2c1a0e">${score} 分</div>
    </div>
    ${eligible.length === 0 ? '<div class="card"><p style="color:#8b1a1a">分数较低，可填报专科志愿或考虑复读。</p></div>' : ''}
    ${schoolItems}
    <div class="spacer"></div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="submitVolunteer()" ${S.selectedSchool===null?'disabled style="opacity:.4"':''}>提交志愿</button>
  `);
}

function selectSchool(idx) {
  S.selectedSchool = idx;
  showVolunteer();
}

function submitVolunteer() {
  if (S.selectedSchool === null) return;
  const eligible = SCHOOLS.filter(s => {
    const cut = getSchoolCut(s);
    return cut !== null && S.finalScore >= cut - 30;
  });
  const school = eligible[S.selectedSchool];
  if (!school) { S.admitted = false; showResult(); return; }
  const cut = getSchoolCut(school);
  S.admitted = S.finalScore >= cut;
  S.selectedSchool = S.selectedSchool; // save index for display
  // Store school name for result screen
  S._schoolName = school.name;
  S._schoolTier = school.tier;
  S._schoolCut = cut;
  showResult();
}

function showResult() {
  S.screen = 'result';
  saveState();
  S.endingId = determineEnding();

  if (S.admitted) {
    render(`
      <div class="stamp stamp-ok" style="margin-bottom:16px">录取通知</div>
      <div class="card" style="border-color:#2d4a2d;background:#f0f8e8;margin-bottom:16px">
        <div class="dim" style="margin-bottom:6px">恭喜你被录取至</div>
        <div style="font-family:'STSong',serif;font-size:22px;color:#1e3a1e;margin-bottom:4px">${S._schoolName || '本科院校'}</div>
        <div class="dim">分数线 ${S._schoolCut} · 你的分数 ${S.finalScore}</div>
      </div>
      <div class="card-sm" style="margin-bottom:20px">
        <p style="font-size:13px">那个封着你名字的信封，你妈妈在邮差来之前就守在门口了。</p>
      </div>
      <button class="btn btn-primary" onclick="showEnding()">查看结局 →</button>
    `);
  } else {
    const reasons = S.finalScore < 380 ? '分数未达专科线' : `差 ${S._schoolCut - S.finalScore} 分未达报考学校分数线`;
    render(`
      <div class="stamp red" style="margin-bottom:16px">落榜</div>
      <div class="card" style="border-color:#c8a96e;margin-bottom:16px">
        <div class="dim" style="margin-bottom:6px">${reasons}</div>
        <div style="font-size:14px;color:#3d2b1a">你的分数：${S.finalScore} 分</div>
      </div>
      <div class="card-sm" style="margin-bottom:20px">
        <p style="font-size:13px">那封信没有来。你等了很长时间，然后停止等了。</p>
      </div>
      <button class="btn btn-primary" onclick="showEnding()">查看结局 →</button>
    `);
  }
}

function showEnding() {
  S.screen = 'ending';
  saveState();
  if (!S.endingId) S.endingId = determineEnding();
  const ending = CONTENT.endings[S.endingId];
  if (!ending) { initState(); showTitle(); return; }

  const bgColors = {
    '01':'#f0f8e8','02':'#f8f4e8','03':'#f5edd8',
    '04':'#ece8f5','05':'#f5eee8','06':'#fdf0f0',
    '07':'#f5f0e8','08':'#e8f0f5','09':'#f5e8e8','10':'#e8f5f0'
  };
  const bg = bgColors[S.endingId] || '#f5edd8';

  render(`
    <div style="text-align:center;margin-bottom:8px">
      <div class="kicker">结局 ${S.endingId}</div>
    </div>
    <div class="ending-name">${ending.name}</div>
    <hr class="divider">
    <div class="ending-tagline">${ending.tagline}</div>
    <hr class="divider">
    <div class="card-sm" style="margin-bottom:16px;text-align:center">
      <div class="dim" style="margin-bottom:4px">${S.year} · ${(PROVINCES.find(p=>p.id===S.province)||{}).name||S.province}</div>
      <div style="font-size:18px;font-weight:700">${S.finalScore > 0 ? S.finalScore + ' 分' : '取消资格'}</div>
      <div class="dim">${getRanking(S.finalScore)}</div>
    </div>
    <div class="dim center" style="margin-bottom:16px;font-size:12px">截图分享，让朋友也来试试</div>
    <button class="btn btn-primary" onclick="newGame()">再走一遍</button>
    <button class="btn" style="margin-top:8px" onclick="showTitle()">返回首页</button>
  `);

  // Set bg
  root.querySelector('.screen').style.background = bg;
}

function newGame() {
  const p = S.province, y = S.year;
  initState();
  S.province = p; S.year = y; S.comboKey = `${p}_${y}`;
  startGame();
}

// ─────────────────────────────────────────────────────────────
// 8. INIT
// ─────────────────────────────────────────────────────────────
const hasState = loadState();
if (hasState && S.screen && S.screen !== 'title') {
  // Restore to title with resume option
  S.screen = S.screen; // keep it
  showTitle();
} else {
  initState();
  showTitle();
}
</script>
</body>
</html>
