  hp:100,food:50,trust:30,threat:0,day:1,
  events:{ev1:false,ev2:false,ev3:false},
  currentScene:'Scene1',p1x:160,p1y:224,p2x:320,p2y:480,
  save:function(){localStorage.setItem('ccv2',JSON.stringify(this));},
  load:function(){try{var d=JSON.parse(localStorage.getItem('ccv2'));if(d){this.hp=d.hp;this.food=d.food;this.trust=d.trust;this.threat=d.threat;this.day=d.day;this.events=d.events;this.currentScene=d.currentScene;this.p1x=d.p1x;this.p1y=d.p1y;this.p2x=d.p2x;this.p2y=d.p2y;}}catch(e){}},
  reset:function(){this.hp=100;this.food=50;this.trust=30;this.threat=0;this.day=1;this.events={ev1:false,ev2:false,ev3:false};this.currentScene='Scene1';this.p1x=160;this.p1y=224;this.p2x=320;this.p2y=480;localStorage.removeItem('ccv2');}
};
var TILE=32,C_BG=0x0a0e1a,C_WALL=0x1a2a3a,C_FLOOR=0x0d1520,C_CYAN=0x00d4ff,C_GREEN=0x00ff88,C_RED=0xff4455,C_GOLD=0xffaa00;

function makeHUD(scene,locKey){
  var W=scene.scale.width,hud=scene.add.container(0,0).setDepth(100).setScrollFactor(0);
  var bar=scene.add.graphics();
  bar.fillStyle(0x050a10,0.95);bar.fillRect(0,0,W,44);
  bar.lineStyle(1,C_CYAN,0.6);bar.strokeRect(0,0,W,44);
  hud.add(bar);
  var dayT=scene.add.text(10,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#00d4ff'});hud.add(dayT);
  var hpT=scene.add.text(110,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#ff6688'});hud.add(hpT);
  var foodT=scene.add.text(270,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#ffcc44'});hud.add(foodT);
  var trustT=scene.add.text(430,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#44ffcc'});hud.add(trustT);
  var threatT=scene.add.text(590,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#ff4455'});hud.add(threatT);
  var locT=scene.add.text(W/2,14,'',{fontFamily:'Courier New',fontSize:'12px',color:'#446688'}).setOrigin(0.5,0);hud.add(locT);
  function bar5(v){var n=Math.max(0,Math.min(5,Math.round(v/20)));return '\u2588'.repeat(n)+'\u2591'.repeat(5-n);}
  hud.refresh=function(){
    dayT.setText(t('day')+GS.day+t('dayUnit'));
    hpT.setText(t('hp')+' '+bar5(GS.hp));
    foodT.setText(t('food')+' '+bar5(GS.food));
    trustT.setText(t('trust')+' '+bar5(GS.trust));
    threatT.setText(t('threat')+' '+bar5(GS.threat));
    locT.setText(t(locKey));
  };
  hud.refresh();
  return hud;
}

function makeDialog(scene){
  var W=scene.scale.width,H=scene.scale.height,DH=185;
  var c=scene.add.container(0,H-DH).setDepth(200).setVisible(false).setScrollFactor(0);
  var bg=scene.add.graphics();
  bg.fillStyle(0x050a10,0.97);bg.fillRect(0,0,W,DH);
  bg.lineStyle(2,C_CYAN,0.9);bg.strokeRect(1,1,W-2,DH-2);
  c.add(bg);
  var spk=scene.add.text(18,12,'',{fontFamily:'Courier New',fontSize:'13px',color:'#00ff88'});c.add(spk);
  var body=scene.add.text(18,34,'',{fontFamily:'Courier New',fontSize:'12px',color:'#aaccdd',wordWrap:{width:W-36}});c.add(body);
  var timerBg=scene.add.graphics();timerBg.fillStyle(0x112233,1);timerBg.fillRect(18,108,W-36,7);c.add(timerBg);
  var timerBar=scene.add.graphics();c.add(timerBar);
  var btns=[];
  for(var i=0;i<3;i++){
    var bx=18+i*((W-36)/3),bw=(W-36)/3-6;
    var bbg=scene.add.graphics();
    bbg.fillStyle(0x05151f,1);bbg.fillRect(bx,120,bw,36);
    bbg.lineStyle(1,C_CYAN,0.7);bbg.strokeRect(bx,120,bw,36);
    c.add(bbg);
    var btxt=scene.add.text(bx+bw/2,138,'',{fontFamily:'Courier New',fontSize:'11px',color:'#00d4ff',wordWrap:{width:bw-10}}).setOrigin(0.5);c.add(btxt);
    var zone=scene.add.zone(bx,120,bw,36).setOrigin(0).setInteractive();c.add(zone);
    (function(z,bg2,bw2,bx2){
      z.on('pointerover',function(){bg2.clear();bg2.fillStyle(C_CYAN,0.15);bg2.fillRect(bx2,120,bw2,36);bg2.lineStyle(1,C_CYAN,1);bg2.strokeRect(bx2,120,bw2,36);});
      z.on('pointerout',function(){bg2.clear();bg2.fillStyle(0x05151f,1);bg2.fillRect(bx2,120,bw2,36);bg2.lineStyle(1,C_CYAN,0.7);bg2.strokeRect(bx2,120,bw2,36);});
    })(zone,bbg,bw,bx);
    btns.push({zone:zone,txt:btxt,bg:bbg,bx:bx,bw:bw});
  }
  var timerV=0,timerOn=false,timerCb=null;
  c.updateTimer=function(dt){
    if(!timerOn)return;
    timerV-=dt/10000;
    if(timerV<=0){timerV=0;timerOn=false;timerBar.clear();if(timerCb)timerCb();}
    else{timerBar.clear();timerBar.fillStyle(C_CYAN,0.8);timerBar.fillRect(18,108,(W-36)*timerV,7);}
  };
  c.show=function(speaker,text,opts,onTimer){
    c.setVisible(true);spk.setText(speaker);body.setText(text);
    btns.forEach(function(b){b.zone.setVisible(false);b.txt.setText('');});
    if(opts&&opts.length){
      opts.forEach(function(o,i){
        if(i>=3)return;
        btns[i].zone.setVisible(true);btns[i].txt.setText(o.label);
        btns[i].zone.removeAllListeners('pointerdown');
        btns[i].zone.on('pointerdown',function(){timerOn=false;c.hide();if(o.cb)o.cb();});
      });
    }
    if(onTimer){timerOn=true;timerV=1;timerCb=onTimer;timerBar.clear();timerBar.fillStyle(C_CYAN,0.8);timerBar.fillRect(18,108,W-36,7);}
    else{timerOn=false;timerBar.clear();}
  };
  c.hide=function(){c.setVisible(false);timerOn=false;};
  return c;
}

function makePuzzle(scene){
  var W=scene.scale.width,H=scene.scale.height;
  var c=scene.add.container(W/2-300,H/2-200).setDepth(300).setVisible(false).setScrollFactor(0);
  var bg=scene.add.graphics();
  bg.fillStyle(0x050a10,0.98);bg.fillRect(0,0,600,400);
  bg.lineStyle(3,C_GOLD,1);bg.strokeRect(1,1,598,398);
  c.add(bg);
  var titleT=scene.add.text(300,22,'',{fontFamily:'Courier New',fontSize:'15px',color:'#ffcc00',align:'center'}).setOrigin(0.5,0);c.add(titleT);
  var descT=scene.add.text(300,65,'',{fontFamily:'Courier New',fontSize:'12px',color:'#aaccdd',align:'center',wordWrap:{width:560}}).setOrigin(0.5,0);c.add(descT);
  var hintT=scene.add.text(300,155,'',{fontFamily:'Courier New',fontSize:'11px',color:'#446688',align:'center'}).setOrigin(0.5,0);c.add(hintT);
  var ibg=scene.add.graphics();ibg.fillStyle(0x05151f,1);ibg.fillRect(150,210,300,40);ibg.lineStyle(2,C_GOLD,0.8);ibg.strokeRect(150,210,300,40);c.add(ibg);
  var inputT=scene.add.text(300,230,'_',{fontFamily:'Courier New',fontSize:'18px',color:'#ffcc00'}).setOrigin(0.5);c.add(inputT);
  var fbT=scene.add.text(300,265,'',{fontFamily:'Courier New',fontSize:'12px',color:'#00ff88',align:'center'}).setOrigin(0.5,0);c.add(fbT);
  function mkBtn(x,w,col,labelKey){
    var bbg=scene.add.graphics();bbg.fillStyle(0x050a10,1);bbg.fillRect(x,330,w,38);bbg.lineStyle(2,col,0.8);bbg.strokeRect(x,330,w,38);c.add(bbg);
    var btxt=scene.add.text(x+w/2,349,t(labelKey),{fontFamily:'Courier New',fontSize:'12px',color:'#'+col.toString(16).padStart(6,'0')}).setOrigin(0.5);c.add(btxt);
    var z=scene.add.zone(x,330,w,38).setOrigin(0).setInteractive();c.add(z);
    return{z:z,txt:btxt,labelKey:labelKey};
  }
  var confirmBtn=mkBtn(80,180,0x00ff88,'confirm');
  var skipBtn=mkBtn(340,180,0xff4455,'skip');
  var inputVal='',correctAns='',onOk=null,onFail=null,solved=false;
  function upd(){inputT.setText(inputVal+'_');}
  function keyH(e){
    if(!c.visible)return;
    if(e.key==='Backspace')inputVal=inputVal.slice(0,-1);
    else if(e.key==='Enter'){check();return;}
    else if(e.key.length===1&&inputVal.length<8)inputVal+=e.key;
    upd();
  }
  function check(){
    if(solved)return;
    if(inputVal.trim()===correctAns){
      solved=true;GS.food=Math.min(100,GS.food+20);
      fbT.setText(t('puzzle_correct')).setColor('#00ff88');
      scene.input.keyboard.off('keydown',keyH);
      scene.time.delayedCall(1400,function(){c.setVisible(false);if(onOk)onOk();});
    }else{
      fbT.setText(t('puzzle_wrong')).setColor('#ff4455');
      GS.hp=Math.max(0,GS.hp-15);inputVal='';upd();
    }
  }
  c.show=function(title,desc,hint,ans,ok,fail){
    c.setVisible(true);titleT.setText(title);descT.setText(desc);hintT.setText(hint);
    fbT.setText('');inputVal='';correctAns=ans;onOk=ok;onFail=fail;solved=false;upd();
    confirmBtn.txt.setText(t('confirm'));skipBtn.txt.setText(t('skip'));
    scene.input.keyboard.on('keydown',keyH);
    confirmBtn.z.removeAllListeners('pointerdown');confirmBtn.z.on('pointerdown',check);
    skipBtn.z.removeAllListeners('pointerdown');skipBtn.z.on('pointerdown',function(){
      scene.input.keyboard.off('keydown',keyH);
      GS.hp=Math.max(0,GS.hp-10);fbT.setText(t('puzzle_skip')).setColor('#ff4455');
      scene.time.delayedCall(1200,function(){c.setVisible(false);if(onFail)onFail();});
    });
  };
  return c;
}

function makeEndOverlay(scene){
  var W=scene.scale.width,H=scene.scale.height;
  var c=scene.add.container(0,0).setDepth(500).setVisible(false).setScrollFactor(0);
  var dim=scene.add.graphics();dim.fillStyle(0,0.82);dim.fillRect(0,0,W,H);c.add(dim);
  var panel=scene.add.graphics();c.add(panel);
  var titleT=scene.add.text(W/2,H/2-130,'',{fontFamily:'Courier New',fontSize:'26px',color:'#ff4455',stroke:'#440011',strokeThickness:3}).setOrigin(0.5);c.add(titleT);
  var infoT=scene.add.text(W/2,H/2-60,'',{fontFamily:'Courier New',fontSize:'13px',color:'#aaccdd',align:'center',lineSpacing:8}).setOrigin(0.5);c.add(infoT);
  var ratingT=scene.add.text(W/2,H/2+30,'',{fontFamily:'Courier New',fontSize:'20px',color:'#ffcc00'}).setOrigin(0.5);c.add(ratingT);
  function mkBtn(x,col,labelKey){
    var bg=scene.add.graphics();bg.fillStyle(0x050a10,1);bg.fillRect(x,H/2+80,170,36);bg.lineStyle(2,col,0.9);bg.strokeRect(x,H/2+80,170,36);c.add(bg);
    var txt=scene.add.text(x+85,H/2+98,'',{fontFamily:'Courier New',fontSize:'13px',color:'#'+col.toString(16).padStart(6,'0')}).setOrigin(0.5);c.add(txt);
    var z=scene.add.zone(x,H/2+80,170,36).setOrigin(0).setInteractive();c.add(z);
    return{z:z,txt:txt,labelKey:labelKey};
  }
  var restartBtn=mkBtn(W/2-200,0x00ff88,'restart');
  var shareBtn=mkBtn(W/2+30,C_CYAN,'share');
  function setup(isWin,cause){
    panel.clear();
    var col=isWin?0x00ff88:0xff4455;
    panel.fillStyle(0x050a10,0.98);panel.fillRect(W/2-270,H/2-160,540,290);
    panel.lineStyle(3,col,1);panel.strokeRect(W/2-270,H/2-160,540,290);
    if(isWin){titleT.setText(t('win_title')).setColor('#00ff88');infoT.setText(t('win_msg')+'\n\n'+t('survived')+': '+GS.day);ratingT.setText(t('rating')+': A');}
    else{
      titleT.setText(t('death_title')).setColor('#ff4455');
      var cs=cause==='hp'?t('death_hp'):cause==='threat'?t('death_threat'):t('death_food');
      var r=GS.day<=1?'F':GS.day===2?'D':GS.day===3?'C':'B';
      infoT.setText(t('survived')+': '+GS.day+'\n'+cs);ratingT.setText(t('rating')+': '+r);
    }
    restartBtn.txt.setText(t('restart'));shareBtn.txt.setText(t('share'));
    restartBtn.z.removeAllListeners('pointerdown');
    restartBtn.z.on('pointerdown',function(){c.setVisible(false);GS.reset();scene.scene.start('Scene1');});
    shareBtn.z.removeAllListeners('pointerdown');
    shareBtn.z.on('pointerdown',function(){
      var r=GS.day<=1?'F':GS.day===2?'D':GS.day===3?'C':isWin?'A':'B';
      navigator.clipboard.writeText('CEECORE: Last Human V2 | '+t('survived')+': '+GS.day+' | '+t('rating')+': '+r).catch(function(){});
      shareBtn.txt.setText(t('copied'));scene.time.delayedCall(2000,function(){shareBtn.txt.setText(t('share'));});
    });
    c.setVisible(true);
  }
  c.showDeath=function(cause){setup(false,cause);};
  c.showWin=function(){setup(true,'');};
  return c;
}
function makePauseOverlay(scene){
  var W=scene.scale.width,H=scene.scale.height;
  var c=scene.add.container(0,0).setDepth(400).setVisible(false).setScrollFactor(0);
  var dim=scene.add.graphics();dim.fillStyle(0,0.6);dim.fillRect(0,0,W,H);c.add(dim);
  var txt=scene.add.text(W/2,H/2,'',{fontFamily:'Courier New',fontSize:'22px',color:'#00d4ff',align:'center'}).setOrigin(0.5);c.add(txt);
  c.refresh=function(){txt.setText(t('pause_title')+'\n\n'+t('pause_resume'));};
  c.refresh();
  return c;
}

class TitleScene extends Phaser.Scene{
  constructor(){super({key:'TitleScene'});}
  create(){
    window.currentScene=this;
    var W=this.scale.width,H=this.scale.height;
    var bg=this.add.graphics();
    bg.fillStyle(C_BG,1);bg.fillRect(0,0,W,H);
    bg.lineStyle(1,0x112233,0.3);
    for(var x=0;x<W;x+=32){bg.beginPath();bg.moveTo(x,0);bg.lineTo(x,H);bg.strokePath();}
    for(var y=0;y<H;y+=32){bg.beginPath();bg.moveTo(0,y);bg.lineTo(W,y);bg.strokePath();}

class Scene1 extends Phaser.Scene{
  constructor(){super({key:'Scene1'});}
  create(){
    window.currentScene=this;
    GS.currentScene='Scene1';
    this.busy=false;this.paused=false;
    var COLS=20,ROWS=15,MW=COLS*TILE,MH=ROWS*TILE;
    this.cameras.main.setBounds(0,0,MW,MH);
    // Draw map
    var g=this.add.graphics();
    g.fillStyle(C_FLOOR,1);g.fillRect(0,0,MW,MH);
    // Grid
    g.lineStyle(1,0x0f1e2e,0.4);
    for(var c=0;c<=COLS;c++){g.beginPath();g.moveTo(c*TILE,0);g.lineTo(c*TILE,MH);g.strokePath();}
    for(var r=0;r<=ROWS;r++){g.beginPath();g.moveTo(0,r*TILE);g.lineTo(MW,r*TILE);g.strokePath();}
    // Walls
    this.walls=[];
    var wallTiles=[];
    for(var c=0;c<COLS;c++){wallTiles.push([c,0]);wallTiles.push([c,ROWS-1]);}
    for(var r=1;r<ROWS-1;r++){wallTiles.push([0,r]);wallTiles.push([COLS-1,r]);}
    // Inner obstacles
    [[3,3],[3,4],[4,3],[7,8],[8,8],[7,9],[12,4],[12,5],[13,4],[16,6],[16,7],[2,11],[2,12],[3,12]].forEach(function(p){wallTiles.push(p);});
    g.fillStyle(C_WALL,1);
    wallTiles.forEach(([c,r])=>{
      g.fillRect(c*TILE,r*TILE,TILE,TILE);
      g.lineStyle(1,0x2a4a5a,0.5);g.strokeRect(c*TILE+2,r*TILE+2,TILE-4,TILE-4);
      this.walls.push({x:c*TILE,y:r*TILE,w:TILE,h:TILE});
    });
    // Radio
    g.fillStyle(C_CYAN,0.15);g.fillRect(9*TILE,3*TILE,TILE*2,TILE);
    g.lineStyle(2,C_CYAN,0.9);g.strokeRect(9*TILE+1,3*TILE+1,TILE*2-2,TILE-2);
    g.fillStyle(C_CYAN,0.6);g.fillRect(9*TILE+6,3*TILE+8,20,12);g.fillRect(9*TILE+10,3*TILE+4,6,8);
    // Stairs
    g.fillStyle(C_GOLD,0.15);g.fillRect(15*TILE,13*TILE,TILE,TILE);
    g.lineStyle(2,C_GOLD,0.9);g.strokeRect(15*TILE+1,13*TILE+1,TILE-2,TILE-2);
    g.lineStyle(1,C_GOLD,0.8);
    for(var i=0;i<4;i++){g.beginPath();g.moveTo(15*TILE+4+i*5,13*TILE+8+i*5);g.lineTo(15*TILE+TILE-4-i*5,13*TILE+8+i*5);g.strokePath();}
    // Atmosphere cracks
    g.lineStyle(1,0x1a3a4a,0.4);
    g.beginPath();g.moveTo(100,180);g.lineTo(130,200);g.lineTo(120,220);g.strokePath();
    g.beginPath();g.moveTo(400,300);g.lineTo(420,280);g.strokePath();
    // Player
    this.px=GS.p1x;this.py=GS.p1y;
    this.pg=this.add.graphics().setDepth(10);
    this.drawPlayer();
    this.cameras.main.startFollow(this.pg,true,0.1,0.1);
    // Prompt
    this.prompt=this.add.text(0,0,t('interact'),{fontFamily:'Courier New',fontSize:'11px',color:'#00d4ff',backgroundColor:'#05080f',padding:{x:4,y:2}}).setVisible(false).setDepth(50);
    // Interactables
    this.ias=[
      {x:9*TILE,y:3*TILE,w:TILE*2,h:TILE,key:'radio',done:false,action:()=>this.ev1()},
      {x:15*TILE,y:13*TILE,w:TILE,h:TILE,key:'stairs',done:false,action:()=>this.toScene2()}
    ];
    // Systems
    this.hud=makeHUD(this,'scene1_name');
    this.dlg=makeDialog(this);
    this.pzl=makePuzzle(this);
    this.end=makeEndOverlay(this);
    this.pauseOvl=makePauseOverlay(this);
    this.scan=this.add.graphics().setDepth(99).setScrollFactor(0);
    // Input
    this.cursors=this.input.keyboard.createCursorKeys();
    this.wasd=this.input.keyboard.addKeys({up:'W',down:'S',left:'A',right:'D'});
    this.eKey=this.input.keyboard.addKey('E');
    this.escKey=this.input.keyboard.addKey('ESC');
    this.foodT=0;
    this.cameras.main.fadeIn(400);
  }
  drawPlayer(){
    this.pg.clear();this.pg.x=this.px;this.pg.y=this.py;
    this.pg.fillStyle(C_GREEN,0.15);this.pg.fillEllipse(8,18,18,8);
    this.pg.fillStyle(C_GREEN,1);this.pg.fillRect(2,2,12,14);
    this.pg.fillStyle(0xaaffcc,0.6);this.pg.fillRect(3,3,4,4);
    this.pg.fillStyle(0x003311,1);this.pg.fillRect(4,5,2,2);this.pg.fillRect(9,5,2,2);
  }
  hit(nx,ny){
    for(var w of this.walls){if(nx<w.x+w.w&&nx+14>w.x&&ny<w.y+w.h&&ny+14>w.y)return true;}
    return false;
  }
  nearIA(){
    var px=this.px+8,py=this.py+8;
    for(var ia of this.ias){var cx=ia.x+ia.w/2,cy=ia.y+ia.h/2;if(Math.hypot(px-cx,py-cy)<55)return ia;}
    return null;
  }
  checkEnd(){
    if(GS.hp<=0){this.end.showDeath('hp');this.busy=true;return true;}
    if(GS.threat>=100){this.end.showDeath('threat');this.busy=true;return true;}
    if(GS.food<=0){this.end.showDeath('food');this.busy=true;return true;}
    return false;
  }
  ev1(){
    if(GS.events.ev1){this.dlg.show('NEXUS','[已触发]',[]);this.busy=true;this.time.delayedCall(1500,()=>{this.dlg.hide();this.busy=false;});return;}
    this.busy=true;
    var done=(fxKey)=>{
      this.dlg.show('',t(fxKey),[]);
      this.time.delayedCall(2000,()=>{this.dlg.hide();this.busy=false;GS.events.ev1=true;GS.day=Math.max(GS.day,2);GS.save();this.hud.refresh();});
    };
    this.dlg.show('['+t('ev1_title')+']',t('ev1_text'),[
      {label:'A. '+t('ev1_a'),cb:()=>{GS.food=Math.min(100,GS.food+15);GS.threat=Math.min(100,GS.threat+5);done('ev1_a_fx');}},
      {label:'B. '+t('ev1_b'),cb:()=>{GS.threat=Math.max(0,GS.threat-5);GS.trust=Math.min(100,GS.trust+5);done('ev1_b_fx');}},
      {label:'C. '+t('ev1_c'),cb:()=>{GS.trust=Math.min(100,GS.trust+15);GS.threat=Math.min(100,GS.threat+10);done('ev1_c_fx');}}
    ],()=>{GS.threat=Math.max(0,GS.threat-5);GS.trust=Math.min(100,GS.trust+5);done('ev1_b_fx');});
  }
  toScene2(){
    GS.p1x=this.px;GS.p1y=this.py;GS.save();
    this.cameras.main.fade(400,0,0,0);
    this.time.delayedCall(400,()=>this.scene.start('Scene2'));
  }
  onLangChange(){this.hud.refresh();this.prompt.setText(t('interact'));this.pauseOvl.refresh();}
  update(time,delta){
    this.scan.clear();this.scan.fillStyle(C_CYAN,0.02);this.scan.fillRect(0,(time*0.07)%640,960,2);
    if(this.paused)return;
    if(Phaser.Input.Keyboard.JustDown(this.escKey)){
      this.paused=true;this.pauseOvl.setVisible(true);
      this.input.keyboard.once('keydown-ESC',()=>{this.paused=false;this.pauseOvl.setVisible(false);});
      return;
    }
    if(this.busy){this.dlg.updateTimer(delta);return;}
    if(this.checkEnd())return;
    this.foodT+=delta;
    if(this.foodT>8000){this.foodT=0;GS.food=Math.max(0,GS.food-2);this.hud.refresh();}
    var sp=2,dx=0,dy=0;
    if(this.cursors.left.isDown||this.wasd.left.isDown)dx=-sp;
    else if(this.cursors.right.isDown||this.wasd.right.isDown)dx=sp;
    if(this.cursors.up.isDown||this.wasd.up.isDown)dy=-sp;
    else if(this.cursors.down.isDown||this.wasd.down.isDown)dy=sp;
    if(dx&&!this.hit(this.px+dx,this.py))this.px+=dx;
    if(dy&&!this.hit(this.px,this.py+dy))this.py+=dy;
    this.drawPlayer();
    var ia=this.nearIA();
    if(ia){
      this.prompt.setPosition(this.px-this.cameras.main.scrollX+2,this.py-this.cameras.main.scrollY-18).setVisible(true);
      if(Phaser.Input.Keyboard.JustDown(this.eKey))ia.action();
    }else{this.prompt.setVisible(false);}
  }
}

    if(this.paused)return;
    if(Phaser.Input.Keyboard.JustDown(this.escKey)){
      this.paused=true;this.pauseOvl.setVisible(true);
      this.input.keyboard.once('keydown-ESC',()=>{this.paused=false;this.pauseOvl.setVisible(false);});
      return;
    }
    if(this.busy){this.dlg.updateTimer(delta);return;}
    if(this.checkEnd())return;
    // Drone patrol
    this.droneT+=delta;
    if(this.droneT>16){this.droneT=0;
      this.droneX+=this.droneDir*2;
      if(this.droneX>22*TILE||this.droneX<14*TILE)this.droneDir*=-1;
      this.drawDrone();
      // Drone contact
      if(Math.hypot(this.px-this.droneX,this.py-this.droneY)<40){
        GS.threat=Math.min(100,GS.threat+0.5);this.hud.refresh();
        if(!this.droneMsgShown){
          this.droneMsgShown=true;
          this.dlg.show(t('npc_drone'),t('npc_drone_text'),[]);
          this.busy=true;this.time.delayedCall(2000,()=>{this.dlg.hide();this.busy=false;this.droneMsgShown=false;});
        }
      }
    }
    this.foodT+=delta;
    if(this.foodT>8000){this.foodT=0;GS.food=Math.max(0,GS.food-2);this.hud.refresh();}
    var sp=2,dx=0,dy=0;
    if(this.cursors.left.isDown||this.wasd.left.isDown)dx=-sp;
    else if(this.cursors.right.isDown||this.wasd.right.isDown)dx=sp;
    if(this.cursors.up.isDown||this.wasd.up.isDown)dy=-sp;
    else if(this.cursors.down.isDown||this.wasd.down.isDown)dy=sp;
    if(dx&&!this.hit(this.px+dx,this.py))this.px+=dx;
    if(dy&&!this.hit(this.px,this.py+dy))this.py+=dy;
    this.drawPlayer();
    var ia=this.nearIA();
    if(ia){
      this.prompt.setPosition(this.px-this.cameras.main.scrollX+2,this.py-this.cameras.main.scrollY-18).setVisible(true);
      if(Phaser.Input.Keyboard.JustDown(this.eKey))ia.action();
    }else{this.prompt.setVisible(false);}
  }
}

var config={
  type:Phaser.AUTO,
  width:960,height:640,
  backgroundColor:'#0a0e1a',
  parent:'game-container',
  scene:[TitleScene,Scene1,Scene2]
};
var game=new Phaser.Game(config);


</script>
